[var(--text-primary)]\"\n                value={editUserRole}\n                onChange={(event) =\u003E setEditUserRole(resolveRole(event.target.value))}\n              \u003E\n                \u003Coption value=\"USER\"\u003EUSER\u003C/option\u003E\n                \u003Coption value=\"ADMIN\"\u003EADMIN\u003C/option\u003E\n              \u003C/select\u003E\n            \u003C/label\u003E\n            \u003Clabel className=\"flex items-center gap-2 text-sm text-[var(--text-primary)]\"\u003E\n              \u003Cinput\n                type=\"checkbox\"\n                checked={editUserActive}\n                onChange={(event) =\u003E setEditUserActive(event.target.checked)}\n              /\u003E\n              Usuario ativo\n            \u003C/label\u003E\n          \u003C/form\u003E\n        \u003C/Modal\u003E\n\n        \u003CModal\n          open={editingInvoice !== null}\n          title=\"Editar fatura\"\n          onClose={() =\u003E setEditingInvoice(null)}\n          footer={\n            \u003C\u003E\n              \u003CButton variant=\"ghost\" onClick={() =\u003E setEditingInvoice(null)}\u003E\n                Cancelar\n              \u003C/Button\u003E\n              \u003CButton\n                onClick={handleSaveInvoice}\n                disabled={updateInvoiceMutation.isPending || !editingInvoice}\n              \u003E\n                {updateInvoiceMutation.isPending ? 'Salvando...' : 'Salvar'}\n              \u003C/Button\u003E\n            \u003C/\u003E\n          }\n        \u003E\n          \u003Cform className=\"grid gap-3\"\u003E\n            \u003CInput\n              label=\"Mes de referencia\"\n              value={editInvoiceMes}\n              onChange={(event) =\u003E setEditInvoiceMes(event.target.value)}\n              placeholder=\"Ex: JAN/2024\"\n            /\u003E\n          \u003C/form\u003E\n        \u003C/Modal\u003E\n\n        \u003CModal\n          open={invoiceDetails !== null}\n          title=\"Informacoes da fatura\"\n          onClose={() =\u003E setInvoiceDetails(null)}\n          footer={\n            \u003CButton type=\"button\" variant=\"ghost\" onClick={() =\u003E setInvoiceDetails(null)}\u003E\n              Fechar\n            \u003C/Button\u003E\n          }\n        \u003E\n          {invoiceDetails ? (\n            \u003Cdiv className=\"grid gap-3 text-sm text-[var(--text-primary)]\"\u003E\n              \u003CInvoiceDetailItem label=\"Arquivo\" value={invoiceDetails.fileName} /\u003E\n              \u003CInvoiceDetailItem\n                label=\"Numero cliente\"\n                value={invoiceDetails.numeroCliente}\n              /\u003E\n              \u003CInvoiceDetailItem\n                label=\"Mes de referencia\"\n                value={invoiceDetails.mesReferencia}\n              /\u003E\n              \u003CInvoiceDetailItem\n                label=\"Data de upload\"\n                value={formatDate(invoiceDetails.createdAt)}\n              /\u003E\n              \u003Cdiv className=\"rounded-lg border border-[var(--border-color)] bg-[var(--surface-2)] p-3\"\u003E\n                \u003Cp className=\"mb-2 text-sm font-semibold text-[var(--text-primary)]\"\u003E\n                  Consumo e valores\n                \u003C/p\u003E\n                \u003Cdiv className=\"grid gap-2 sm:grid-cols-2\"\u003E\n                  \u003CInvoiceDetailItem\n                    label=\"Consumo (kWh)\"\n                    value={formatNumber(invoiceDetails.consumoEnergiaEletricaKwh)}\n                  /\u003E\n                  \u003CInvoiceDetailItem\n                    label=\"Energia compensada (kWh)\"\n                    value={formatNumber(invoiceDetails.energiaCompensadaKwh)}\n                  /\u003E\n                  \u003CInvoiceDetailItem\n                    label=\"Valor sem GD (R$)\"\n                    value={formatCurrency(invoiceDetails.valorTotalSemGdRs)}\n                  /\u003E\n                  \u003CInvoiceDetailItem\n                    label=\"Economia GD (R$)\"\n                    value={formatCurrency(invoiceDetails.economiaGdRs)}\n                  /\u003E\n                \u003C/div\u003E\n              \u003C/div\u003E\n            \u003C/div\u003E\n          ) : null}\n        \u003C/Modal\u003E\n\n        \u003CModal\n          open={deleteTarget !== null}\n          title=\"Confirmar exclus\u00e3o\"\n          onClose={() =\u003E setDeleteTarget(null)}\n          footer={\n            \u003C\u003E\n              \u003CButton variant=\"ghost\" onClick={() =\u003E setDeleteTarget(null)}\u003E\n                Cancelar\n              \u003C/Button\u003E\n              \u003CButton\n                variant=\"danger\"\n                onClick={handleConfirmDelete}\n                disabled={\n                  deleteUserMutation.isPending ||\n                  deleteInvoiceMutation.isPending ||\n                  deleteDocumentMutation.isPending ||\n                  !deleteTarget\n                }\n              \u003E\n                Excluir\n              \u003C/Button\u003E\n            \u003C/\u003E\n          }\n        \u003E\n          \u003Cp className=\"text-sm text-[var(--text-primary)]\"\u003E\n            {buildDeleteConfirmationMessage(deleteTarget)}\n          \u003C/p\u003E\n        \u003C/Modal\u003E\n      \u003C/AppShell\u003E\n    \u003C/RequireAuth\u003E\n  );\n}\n\nfunction buildDeleteConfirmationMessage(target: DeleteTarget | null) {\n  if (!target) {\n    return '';\n  }\n  if (target.kind === 'usuario') {\n    return `Tem certeza que deseja excluir este usuario: ${target.label}?`;\n  }\n  if (target.kind === 'fatura') {\n    return `Tem certeza que deseja excluir esta fatura: ${target.label}?`;\n  }\n  return `Tem certeza que deseja excluir este arquivo: ${target.label}?`;\n}\n\nfunction InvoiceDetailItem({ label, value }: { label: string; value: string }) {\n  return (\n    \u003Cdiv className=\"rounded border border-[var(--border-color)] bg-[var(--surface-1)] px-3 py-2\"\u003E\n      \u003Cp className=\"text-xs font-semibold uppercase tracking-wide text-[var(--text-secondary)]\"\u003E\n        {label}\n      \u003C/p\u003E\n      \u003Cp className=\"mt-1 break-all text-sm text-[var(--text-primary)]\"\u003E{value}\u003C/p\u003E\n    \u003C/div\u003E\n  );\n}\n\nfunction readAuditValue(log: Record\u003Cstring, unknown\u003E, key: string) {\n  const value = log[key];\n  if (value === null || value === undefined || value === '') {\n    return '-';\n  }\n  return String(value);\n}\n\nfunction resolveAuditUsername(log: Record\u003Cstring, unknown\u003E) {\n  const actor = log.actor;\n  if (typeof actor !== 'object' || actor === null) {\n    return '-';\n  }\n  const actorRecord = actor as Record\u003Cstring, unknown\u003E;\n  return String(actorRecord.username ?? '-');\n}\n\nfunction formatDate(value: string) {\n  if (!value || value === '-') {\n    return '-';\n  }\n  const date = new Date(value);\n  if (Number.isNaN(date.getTime())) {\n    return value;\n  }\n  return new Intl.DateTimeFormat('pt-BR', {\n    dateStyle: 'short',\n    timeStyle: 'short',\n  }).format(date);\n}\n\nfunction toRecord(value: unknown): Record\u003Cstring, unknown\u003E {\n  if (typeof value !== 'object' || value === null) {\n    return {};\n  }\n  return value as Record\u003Cstring, unknown\u003E;\n}\n\nfunction readNumericValue(payload: Record\u003Cstring, unknown\u003E, key: string) {\n  const value = payload[key];\n  if (typeof value === 'number') {\n    return value;\n  }\n  if (typeof value === 'string') {\n    const parsed = Number.parseFloat(value);\n    if (Number.isFinite(parsed)) {\n      return parsed;\n    }\n  }\n  return 0;\n}\n\nfunction formatNumber(value: number) {\n  return new Intl.NumberFormat('pt-BR', {\n    maximumFractionDigits: 2,\n  }).format(value);\n}\n\nfunction formatCurrency(value: number) {\n  return new Intl.NumberFormat('pt-BR', {\n    style: 'currency',\n    currency: 'BRL',\n  }).format(value);\n}\n","frontend/src/app/api/auth/login/route.ts":"import { NextResponse } from 'next/server';\nimport { getBackendApiUrl } from '@/shared/config/server-env';\nimport { setSessionCookies } from '@/shared/api/server-auth';\n\nexport async function POST(request: Request) {\n  const body = await request.json();\n  const backendUrl = getBackendApiUrl();\n\n  const response = await fetch(`${backendUrl}/api/auth/login`, {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify(body),\n  });\n\n  const json = (await response.json()) as {\n    success: boolean;\n    data?: {\n      accessToken: string;\n      refreshToken: string;\n      accessTokenExpiresIn: string;\n      refreshTokenExpiresIn: string;\n      user: {\n        id: string;\n        email: string;\n        username: string;\n        role: 'ADMIN' | 'USER';\n      };\n    };\n  };\n\n  const nextResponse = NextResponse.json(json, { status: response.status });\n\n  if (response.ok \u0026\u0026 json.success \u0026\u0026 json.data) {\n    setSessionCookies(nextResponse, json.data);\n  }\n\n  return nextResponse;\n}\n","frontend/src/app/api/auth/logout/route.ts":"import { NextResponse } from 'next/server';\nimport { clearSessionCookies, getServerRefreshToken } from '@/shared/api/server-auth';\nimport { getBackendApiUrl } from '@/shared/config/server-env';\n\nexport async function POST() {\n  const backendUrl = getBackendApiUrl();\n  const refreshToken = await getServerRefreshToken();\n\n  if (refreshToken) {\n    await fetch(`${backendUrl}/api/auth/logout`, {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ refreshToken }),\n    });\n  }\n\n  const response = NextResponse.json({\n    success: true,\n    data: { message: 'Logout realizado com sucesso.' },\n  });\n  clearSessionCookies(response);\n  return response;\n}\n","frontend/src/app/api/auth/me/route.ts":"import { NextResponse } from 'next/server';\nimport { getBackendApiUrl } from '@/shared/config/server-env';\nimport {\n  getServerAccessToken,\n  refreshAccessTokenIfNeeded,\n  setSessionCookies,\n} from '@/shared/api/server-auth';\n\nexport async function GET() {\n  const backendUrl = getBackendApiUrl();\n  let accessToken = await getServerAccessToken();\n\n  if (!accessToken) {\n    const refreshed = await refreshAccessTokenIfNeeded();\n    if (!refreshed) {\n      return NextResponse.json(\n        {\n          success: false,\n          error: { message: 'Nao autenticado.' },\n        },\n        { status: 401 },\n      );\n    }\n    accessToken = refreshed.accessToken;\n  }\n\n  const response = await fetch(`${backendUrl}/api/auth/me`, {\n    headers: {\n      Authorization: `Bearer ${accessToken}`,\n    },\n    cache: 'no-store',\n  });\n\n  const json = await response.json();\n  const nextResponse = NextResponse.json(json, { status: response.status });\n\n  if (!response.ok \u0026\u0026 response.status === 401) {\n    const refreshed = await refreshAccessTokenIfNeeded();\n    if (refreshed) {\n      setSessionCookies(nextResponse, refreshed);\n    }\n  }\n\n  return nextResponse;\n}\n","frontend/src/app/api/auth/refresh/route.ts":"import { NextResponse } from 'next/server';\nimport { getBackendApiUrl } from '@/shared/config/server-env';\nimport { setSessionCookies } from '@/shared/api/server-auth';\n\nexport async function POST(request: Request) {\n  const body = await request.json();\n  const backendUrl = getBackendApiUrl();\n\n  const response = await fetch(`${backendUrl}/api/auth/refresh`, {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify(body),\n  });\n\n  const json = (await response.json()) as {\n    success: boolean;\n    data?: {\n      accessToken: string;\n      refreshToken: string;\n      accessTokenExpiresIn: string;\n      refreshTokenExpiresIn: string;\n      user: {\n        id: string;\n        email: string;\n        username: string;\n        role: 'ADMIN' | 'USER';\n      };\n    };\n  };\n\n  const nextResponse = NextResponse.json(json, { status: response.status });\n  if (response.ok \u0026\u0026 json.success \u0026\u0026 json.data) {\n    setSessionCookies(nextResponse, json.data);\n  }\n  return nextResponse;\n}\n","frontend/src/app/api/auth/register/route.ts":"import { NextResponse } from 'next/server';\nimport { getBackendApiUrl } from '@/shared/config/server-env';\nimport { setSessionCookies } from '@/shared/api/server-auth';\n\nexport async function POST(request: Request) {\n  const body = await request.json();\n  const backendUrl = getBackendApiUrl();\n\n  const response = await fetch(`${backendUrl}/api/auth/register`, {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify(body),\n  });\n\n  const json = (await response.json()) as {\n    success: boolean;\n    data?: {\n      accessToken: string;\n      refreshToken: string;\n      accessTokenExpiresIn: string;\n      refreshTokenExpiresIn: string;\n      user: {\n        id: string;\n        email: string;\n        username: string;\n        role: 'ADMIN' | 'USER';\n      };\n    };\n  };\n\n  const nextResponse = NextResponse.json(json, { status: response.status });\n\n  if (response.ok \u0026\u0026 json.success \u0026\u0026 json.data) {\n    setSessionCookies(nextResponse, json.data);\n  }\n\n  return nextResponse;\n}\n","frontend/src/app/api/proxy/[...path]/route.ts":"import { NextResponse } from 'next/server';\nimport { getBackendApiUrl } from '@/shared/config/server-env';\nimport {\n  getServerAccessToken,\n  refreshAccessTokenIfNeeded,\n  setSessionCookies,\n} from '@/shared/api/server-auth';\n\nasync function proxy(request: Request, path: string[]) {\n  const backendUrl = getBackendApiUrl();\n  const targetUrl = `${backendUrl}/api/${path.join('/')}${new URL(request.url).search}`;\n  const accessToken = await getServerAccessToken();\n\n  const body =\n    request.method === 'GET' || request.method === 'DELETE'\n      ? undefined\n      : await request.arrayBuffer();\n\n  const makeRequest = async (token?: string) =\u003E\n    fetch(targetUrl, {\n      method: request.method,\n      headers: {\n        ...(request.headers.get('content-type')\n          ? { 'Content-Type': request.headers.get('content-type') as string }\n          : {}),\n        ...(token ? { Authorization: `Bearer ${token}` } : {}),\n      },\n      body: body ? Buffer.from(body) : undefined,\n      cache: 'no-store',\n    });\n\n  let response = await makeRequest(accessToken);\n  let refreshedPayload: Awaited\u003CReturnType\u003Ctypeof refreshAccessTokenIfNeeded\u003E\u003E =\n    null;\n\n  if (response.status === 401) {\n    refreshedPayload = await refreshAccessTokenIfNeeded();\n    if (refreshedPayload) {\n      response = await makeRequest(refreshedPayload.accessToken);\n    }\n  }\n\n  const text = await response.text();\n  let payload: unknown = null;\n  try {\n    payload = text ? JSON.parse(text) : null;\n  } catch {\n    payload = { success: false, error: { message: text || 'Erro inesperado.' } };\n  }\n\n  const nextResponse = NextResponse.json(payload, { status: response.status });\n  if (refreshedPayload) {\n    setSessionCookies(nextResponse, refreshedPayload);\n  }\n  return nextResponse;\n}\n\ntype Params = { params: Promise\u003C{ path: string[] }\u003E };\n\nexport async function GET(request: Request, { params }: Params) {\n  return proxy(request, (await params).path);\n}\nexport async function POST(request: Request, { params }: Params) {\n  return proxy(request, (await params).path);\n}\nexport async function PATCH(request: Request, { params }: Params) {\n  return proxy(request, (await params).path);\n}\nexport async function DELETE(request: Request, { params }: Params) {\n  return proxy(request, (await params).path);\n}\n","frontend/src/app/dashboard/page.tsx":"'use client';\n\nimport { useQuery } from '@tanstack/react-query';\nimport { AppShell } from '@/widgets/app-shell/app-shell';\nimport { RequireAuth } from '@/features/session/require-auth';\nimport { Card } from '@/shared/ui/card';\nimport { getConsolidatedDashboard } from '@/entities/invoice/api/invoice.client';\n\nexport default function DashboardPage() {\n  const dashboard = useQuery({\n    queryKey: ['dashboard', 'consolidated'],\n    queryFn: getConsolidatedDashboard,\n  });\n\n  return (\n    \u003CRequireAuth\u003E\n      \u003CAppShell\u003E\n        \u003Cdiv className=\"mx-auto w-full max-w-6xl\"\u003E\n          {dashboard.isLoading ? (\n            \u003Cp className=\"text-sm text-[var(--text-secondary)]\"\u003ECarregando dashboard...\u003C/p\u003E\n          ) : null}\n          {dashboard.isError ? (\n            \u003Cp className=\"text-sm text-[var(--danger)]\"\u003E\n              {dashboard.error instanceof Error\n                ? dashboard.error.message\n                : 'Falha ao carregar dashboard.'}\n            \u003C/p\u003E\n          ) : null}\n          \u003Cdiv className=\"mb-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4\"\u003E\n            \u003CMetricHighlight\n              label=\"Consumo (kWh)\"\n              value={formatNumber(dashboard.data?.consumoEnergiaEletricaKwh ?? 0)}\n            /\u003E\n            \u003CMetricHighlight\n              label=\"Energia compensada (kWh)\"\n              value={formatNumber(dashboard.data?.energiaCompensadaKwh ?? 0)}\n            /\u003E\n            \u003CMetricHighlight\n              label=\"Valor sem GD (R$)\"\n              value={formatCurrency(dashboard.data?.valorTotalSemGdRs ?? 0)}\n            /\u003E\n            \u003CMetricHighlight\n              label=\"Economia GD (R$)\"\n              value={formatCurrency(dashboard.data?.economiaGdRs ?? 0)}\n            /\u003E\n          \u003C/div\u003E\n          \u003Cdiv className=\"grid gap-4 md:grid-cols-2\"\u003E\n            \u003CCard title=\"Resultados de Energia (kWh)\"\u003E\n              \u003Cp className=\"text-sm text-[var(--text-secondary)]\"\u003E\n                Consumo de energia: {formatNumber(dashboard.data?.consumoEnergiaEletricaKwh ?? 0)}\n              \u003C/p\u003E\n              \u003Cp className=\"text-sm text-[var(--text-secondary)]\"\u003E\n                Energia compensada: {formatNumber(dashboard.data?.energiaCompensadaKwh ?? 0)}\n              \u003C/p\u003E\n            \u003C/Card\u003E\n            \u003CCard title=\"Resultados Financeiros (R$)\"\u003E\n              \u003Cp className=\"text-sm text-[var(--text-secondary)]\"\u003E\n                Valor total sem GD: {formatCurrency(dashboard.data?.valorTotalSemGdRs ?? 0)}\n              \u003C/p\u003E\n              \u003Cp className=\"text-sm text-[var(--text-secondary)]\"\u003E\n                Economia GD: {formatCurrency(dashboard.data?.economiaGdRs ?? 0)}\n              \u003C/p\u003E\n            \u003C/Card\u003E\n          \u003C/div\u003E\n        \u003C/div\u003E\n      \u003C/AppShell\u003E\n    \u003C/RequireAuth\u003E\n  );\n}\n\nfunction MetricHighlight({ label, value }: { label: string; value: string }) {\n  return (\n    \u003Cdiv className=\"rounded-lg border border-[var(--border-color)] bg-[var(--surface-1)] p-3\"\u003E\n      \u003Cp className=\"text-xs font-semibold uppercase tracking-wide text-[var(--text-secondary)]\"\u003E{label}\u003C/p\u003E\n      \u003Cp className=\"mt-1 text-lg font-semibold text-[var(--text-primary)]\"\u003E{value}\u003C/p\u003E\n    \u003C/div\u003E\n  );\n}\n\nfunction formatNumber(value: number) {\n  return new Intl.NumberFormat('pt-BR', {\n    maximumFractionDigits: 2,\n  }).format(value);\n}\n\nfunction formatCurrency(value: number) {\n  return new Intl.NumberFormat('pt-BR', {\n    style: 'currency',\n    currency: 'BRL',\n  }).format(value);\n}\n","frontend/src/app/invoices/page.tsx":"'use client';\n\nimport { useMutation, useQuery, useQueryClient } from '@tanstack/react-query';\nimport { FormEvent, useState } from 'react';\nimport { AppShell } from '@/widgets/app-shell/app-shell';\nimport { RequireAuth } from '@/features/session/require-auth';\nimport { Card } from '@/shared/ui/card';\nimport { Input } from '@/shared/ui/input';\nimport { Button } from '@/shared/ui/button';\nimport { Modal } from '@/shared/ui/modal';\nimport { MonthSelector } from '@/shared/ui/month-selector';\nimport {\n  type InvoiceRecord,\n  listInvoices,\n  listMyDocuments,\n  uploadInvoice,\n} from '@/entities/invoice/api/invoice.client';\n\nexport default function InvoicesPage() {\n  const pageSize = 10;\n  const queryClient = useQueryClient();\n  const [numeroClienteInput, setNumeroClienteInput] = useState('');\n  const [periodoInicioInput, setPeriodoInicioInput] = useState('');\n  const [periodoFimInput, setPeriodoFimInput] = useState('');\n  const [filters, setFilters] = useState({\n    numeroCliente: '',\n    periodoInicio: '',\n    periodoFim: '',\n  });\n  const [message, setMessage] = useState('');\n  const [messageType, setMessageType] = useState\u003C'success' | 'error' | 'info'\u003E('info');\n  const [page, setPage] = useState(1);\n  const [selectedInvoice, setSelectedInvoice] = useState\u003CInvoiceRecord | null\u003E(null);\n\n  const invoicesQuery = useQuery({\n    queryKey: [\n      'invoices',\n      filters.numeroCliente,\n      filters.periodoInicio,\n      filters.periodoFim,\n      page,\n      pageSize,\n    ],\n    queryFn: () =\u003E\n      listInvoices({\n        numeroCliente: filters.numeroCliente || undefined,\n        periodoInicio: filters.periodoInicio || undefined,\n        periodoFim: filters.periodoFim || undefined,\n        page,\n        pageSize,\n      }),\n  });\n\n  const docsQuery = useQuery({\n    queryKey: ['my-documents'],\n    queryFn: listMyDocuments,\n  });\n\n  const uploadMutation = useMutation({\n    mutationFn: uploadInvoice,\n    onSuccess: () =\u003E {\n      setMessage('Arquivo processado com sucesso.');\n      setMessageType('success');\n      void queryClient.invalidateQueries({ queryKey: ['invoices'] });\n      void queryClient.invalidateQueries({ queryKey: ['my-documents'] });\n    },\n    onError: (err) =\u003E {\n      setMessage(err instanceof Error ? err.message : 'Falha ao processar arquivo.');\n      setMessageType('error');\n    },\n  });\n\n  function handleUpload(event: FormEvent\u003CHTMLFormElement\u003E) {\n    event.preventDefault();\n    setMessage('');\n    setMessageType('info');\n    const form = new FormData(event.currentTarget);\n    const file = form.get('file');\n    if (!(file instanceof File)) {\n      setMessage('Selecione um arquivo PDF.');\n      setMessageType('error');\n      return;\n    }\n    if (file.type !== 'application/pdf') {\n      setMessage('Apenas arquivos PDF sao suportados.');\n      setMessageType('error');\n      return;\n    }\n    if (file.size \u003E 50 * 1024 * 1024) {\n      setMessage('Arquivo excede o limite de 50MB.');\n      setMessageType('error');\n      return;\n    }\n    uploadMutation.mutate(file);\n  }\n\n  function handleApplyFilters(event: FormEvent\u003CHTMLFormElement\u003E) {\n    event.preventDefault();\n    const inicioKey = toMonthKey(periodoInicioInput);\n    const fimKey = toMonthKey(periodoFimInput);\n    if (inicioKey !== null \u0026\u0026 fimKey !== null \u0026\u0026 inicioKey \u003E fimKey) {\n      setMessage('Periodo invalido: o inicio deve ser menor ou igual ao fim.');\n      setMessageType('error');\n      return;\n    }\n    setFilters({\n      numeroCliente: numeroClienteInput.trim(),\n      periodoInicio: periodoInicioInput.trim(),\n      periodoFim: periodoFimInput.trim(),\n    });\n    setPage(1);\n  }\n\n  function handleClearFilters() {\n    setNumeroClienteInput('');\n    setPeriodoInicioInput('');\n    setPeriodoFimInput('');\n    setFilters({ numeroCliente: '', periodoInicio: '', periodoFim: '' });\n    setPage(1);\n    setMessage('');\n    setMessageType('info');\n  }\n\n  function renderMessageClass() {\n    if (messageType === 'error') {\n      return 'mt-3 text-sm text-[var(--danger)]';\n    }\n    if (messageType === 'success') {\n      return 'mt-3 text-sm text-[var(--accent-strong)]';\n    }\n    return 'mt-3 text-sm text-[var(--text-secondary)]';\n  }\n\n  return (\n    \u003CRequireAuth\u003E\n      \u003CAppShell\u003E\n        \u003Cdiv className=\"mx-auto grid w-full max-w-7xl min-w-0 gap-4\"\u003E\n          \u003CCard title=\"Upload e processamento de fatura\"\u003E\n            \u003Cform\n              className=\"mx-auto flex w-full max-w-5xl flex-col gap-3\"\n              onSubmit={handleUpload}\n            \u003E\n              \u003CInput label=\"Arquivo PDF\" name=\"file\" type=\"file\" accept=\"application/pdf\" /\u003E\n              \u003CButton type=\"submit\" disabled={uploadMutation.isPending}\u003E\n                {uploadMutation.isPending ? 'Processando...' : 'Enviar PDF'}\n              \u003C/Button\u003E\n            \u003C/form\u003E\n            {message ? (\n              \u003Cp className={renderMessageClass()}\u003E{message}\u003C/p\u003E\n            ) : null}\n          \u003C/Card\u003E\n\n          \u003CCard title=\"Biblioteca de faturas\"\u003E\n            \u003Cform\n              className=\"mb-4 grid gap-3 md:grid-cols-2 xl:grid-cols-4\"\n              onSubmit={handleApplyFilters}\n            \u003E\n              \u003CInput\n                label=\"Filtro numero cliente\"\n                value={numeroClienteInput}\n                onChange={(event) =\u003E setNumeroClienteInput(event.target.value)}\n              /\u003E\n              \u003CMonthSelector\n                label=\"Periodo inicio\"\n                value={periodoInicioInput}\n                onChange={setPeriodoInicioInput}\n              /\u003E\n              \u003CMonthSelector\n                label=\"Periodo fim\"\n                value={periodoFimInput}\n                onChange={setPeriodoFimInput}\n              /\u003E\n              \u003Cdiv className=\"flex items-end gap-2 md:col-span-2 xl:col-span-1\"\u003E\n                \u003CButton type=\"submit\"\u003EAplicar filtros\u003C/Button\u003E\n                \u003CButton type=\"button\" onClick={handleClearFilters}\u003E\n                  Limpar\n                \u003C/Button\u003E\n              \u003C/div\u003E\n            \u003C/form\u003E\n            {invoicesQuery.isError ? (\n              \u003Cp className=\"mb-3 text-sm text-[var(--danger)]\"\u003E\n                {invoicesQuery.error instanceof Error\n                  ? invoicesQuery.error.message\n                  : 'Falha ao carregar as faturas.'}\n              \u003C/p\u003E\n            ) : null}\n            \u003Cdiv className=\"hidden min-w-0 overflow-x-auto md:block\"\u003E\n              \u003Ctable className=\"min-w-full text-left text-sm\"\u003E\n                \u003Cthead className=\"bg-[var(--surface-2)] text-[var(--text-primary)]\"\u003E\n                  \u003Ctr\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003EArquivo\u003C/th\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003ENumero cliente\u003C/th\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003EMes referencia\u003C/th\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003EAcoes\u003C/th\u003E\n                  \u003C/tr\u003E\n                \u003C/thead\u003E\n                \u003Ctbody\u003E\n                  {(invoicesQuery.data ?? []).map((invoice) =\u003E (\n                    \u003Ctr key={invoice.id} className=\"border-b border-[var(--border-color)]\"\u003E\n                      \u003Ctd className=\"px-3 py-2\"\u003E{invoice.fileName}\u003C/td\u003E\n                      \u003Ctd className=\"px-3 py-2\"\u003E{invoice.numeroCliente}\u003C/td\u003E\n                      \u003Ctd className=\"px-3 py-2\"\u003E{invoice.mesReferencia}\u003C/td\u003E\n                      \u003Ctd className=\"px-3 py-2\"\u003E\n                        \u003CButton type=\"button\" variant=\"ghost\" onClick={() =\u003E setSelectedInvoice(invoice)}\u003E\n                          Ver informacoes\n                        \u003C/Button\u003E\n                      \u003C/td\u003E\n                    \u003C/tr\u003E\n                  ))}\n                \u003C/tbody\u003E\n              \u003C/table\u003E\n            \u003C/div\u003E\n            \u003Cdiv className=\"grid gap-3 md:hidden\"\u003E\n              {(invoicesQuery.data ?? []).map((invoice) =\u003E (\n                \u003Carticle\n                  key={`mobile-invoice-${invoice.id}`}\n                  className=\"rounded-lg border border-[var(--border-color)] bg-[var(--surface-2)] p-3 text-sm text-[var(--text-primary)]\"\n                \u003E\n                  \u003Cp className=\"break-all\"\u003E\u003Cstrong\u003EArquivo:\u003C/strong\u003E {invoice.fileName}\u003C/p\u003E\n                  \u003Cp className=\"break-all\"\u003E\u003Cstrong\u003ENumero cliente:\u003C/strong\u003E {invoice.numeroCliente}\u003C/p\u003E\n                  \u003Cp\u003E\u003Cstrong\u003EMes referencia:\u003C/strong\u003E {invoice.mesReferencia}\u003C/p\u003E\n                  \u003Cdiv className=\"mt-3\"\u003E\n                    \u003CButton type=\"button\" variant=\"ghost\" onClick={() =\u003E setSelectedInvoice(invoice)}\u003E\n                      Ver informacoes\n                    \u003C/Button\u003E\n                  \u003C/div\u003E\n                \u003C/article\u003E\n              ))}\n            \u003C/div\u003E\n            {invoicesQuery.isLoading ? (\n              \u003Cp className=\"mt-3 text-sm text-[var(--text-secondary)]\"\u003ECarregando faturas...\u003C/p\u003E\n            ) : null}\n            {!invoicesQuery.isLoading \u0026\u0026 !invoicesQuery.isError \u0026\u0026 (invoicesQuery.data ?? []).length === 0 ? (\n              \u003Cp className=\"mt-3 text-sm text-[var(--text-secondary)]\"\u003E\n                Nenhuma fatura encontrada para os filtros informados.\n              \u003C/p\u003E\n            ) : null}\n            \u003Cdiv className=\"mt-4 flex flex-wrap items-center justify-between gap-2 rounded border border-[var(--border-color)] bg-[var(--surface-2)] p-2 text-sm text-[var(--text-primary)]\"\u003E\n              \u003Cspan\u003EPagina atual: {page}\u003C/span\u003E\n              \u003Cdiv className=\"flex items-center gap-2\"\u003E\n                \u003CButton type=\"button\" variant=\"ghost\" disabled={page === 1} onClick={() =\u003E setPage((current) =\u003E Math.max(1, current - 1))}\u003E\n                  Pagina anterior\n                \u003C/Button\u003E\n                \u003CButton\n                  type=\"button\"\n                  variant=\"ghost\"\n                  disabled={invoicesQuery.isLoading || (invoicesQuery.data ?? []).length \u003C pageSize}\n                  onClick={() =\u003E setPage((current) =\u003E current + 1)}\n                \u003E\n                  Proxima pagina\n                \u003C/Button\u003E\n              \u003C/div\u003E\n            \u003C/div\u003E\n          \u003C/Card\u003E\n\n          \u003CCard title=\"Meus documentos enviados\"\u003E\n            {docsQuery.isError ? (\n              \u003Cp className=\"mb-3 text-sm text-[var(--danger)]\"\u003E\n                {docsQuery.error instanceof Error\n                  ? docsQuery.error.message\n                  : 'Falha ao carregar documentos.'}\n              \u003C/p\u003E\n            ) : null}\n            \u003Cdiv className=\"hidden min-w-0 overflow-x-auto md:block\"\u003E\n              \u003Ctable className=\"min-w-full text-left text-sm\"\u003E\n                \u003Cthead className=\"bg-[var(--surface-2)] text-[var(--text-primary)]\"\u003E\n                  \u003Ctr\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003EArquivo\u003C/th\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003ETipo\u003C/th\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003ETamanho\u003C/th\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003ECriado em\u003C/th\u003E\n                  \u003C/tr\u003E\n                \u003C/thead\u003E\n                \u003Ctbody\u003E\n                  {(docsQuery.data ?? []).map((doc) =\u003E (\n                    \u003Ctr key={doc.id} className=\"border-b border-[var(--border-color)]\"\u003E\n                      \u003Ctd className=\"px-3 py-2 break-all\"\u003E{doc.fileName}\u003C/td\u003E\n                      \u003Ctd className=\"px-3 py-2 break-all\"\u003E{doc.mimeType}\u003C/td\u003E\n                      \u003Ctd className=\"px-3 py-2\"\u003E{formatBytes(doc.sizeBytes)}\u003C/td\u003E\n                      \u003Ctd className=\"px-3 py-2\"\u003E{formatDate(doc.createdAt)}\u003C/td\u003E\n                    \u003C/tr\u003E\n                  ))}\n                \u003C/tbody\u003E\n              \u003C/table\u003E\n            \u003C/div\u003E\n            \u003Cdiv className=\"grid gap-3 md:hidden\"\u003E\n              {(docsQuery.data ?? []).map((doc) =\u003E (\n                \u003Carticle\n                  key={`mobile-doc-${doc.id}`}\n                  className=\"rounded-lg border border-[var(--border-color)] bg-[var(--surface-2)] p-3 text-sm text-[var(--text-primary)]\"\n                \u003E\n                  \u003Cp className=\"break-all\"\u003E\u003Cstrong\u003EArquivo:\u003C/strong\u003E {doc.fileName}\u003C/p\u003E\n                  \u003Cp className=\"break-all\"\u003E\u003Cstrong\u003ETipo:\u003C/strong\u003E {doc.mimeType}\u003C/p\u003E\n                  \u003Cp\u003E\u003Cstrong\u003ETamanho:\u003C/strong\u003E {formatBytes(doc.sizeBytes)}\u003C/p\u003E\n                  \u003Cp\u003E\u003Cstrong\u003ECriado em:\u003C/strong\u003E {formatDate(doc.createdAt)}\u003C/p\u003E\n                \u003C/article\u003E\n              ))}\n            \u003C/div\u003E\n            {docsQuery.isLoading ? (\n              \u003Cp className=\"mt-3 text-sm text-[var(--text-secondary)]\"\u003ECarregando documentos...\u003C/p\u003E\n            ) : null}\n            {!docsQuery.isLoading \u0026\u0026 !docsQuery.isError \u0026\u0026 (docsQuery.data ?? []).length === 0 ? (\n              \u003Cp className=\"mt-3 text-sm text-[var(--text-secondary)]\"\u003E\n                Nenhum documento enviado ate o momento.\n              \u003C/p\u003E\n            ) : null}\n          \u003C/Card\u003E\n        \u003C/div\u003E\n\n        \u003CModal\n          open={selectedInvoice !== null}\n          title=\"Informacoes da fatura\"\n          onClose={() =\u003E setSelectedInvoice(null)}\n          footer={\n            \u003CButton type=\"button\" variant=\"ghost\" onClick={() =\u003E setSelectedInvoice(null)}\u003E\n              Fechar\n            \u003C/Button\u003E\n          }\n        \u003E\n          {selectedInvoice ? (\n            \u003Cdiv className=\"grid gap-3 text-sm text-[var(--text-primary)]\"\u003E\n              \u003CInvoiceInfoRow label=\"Arquivo\" value={selectedInvoice.fileName} /\u003E\n              \u003CInvoiceInfoRow label=\"Numero do cliente\" value={selectedInvoice.numeroCliente} /\u003E\n              \u003CInvoiceInfoRow label=\"Mes de referencia\" value={selectedInvoice.mesReferencia} /\u003E\n              \u003CInvoiceInfoRow label=\"Data de envio\" value={formatDate(selectedInvoice.createdAt)} /\u003E\n              \u003Cdiv className=\"rounded-lg border border-[var(--border-color)] bg-[var(--surface-2)] p-3\"\u003E\n                \u003Cp className=\"mb-2 text-sm font-semibold text-[var(--text-primary)]\"\u003EConsumo e valores\u003C/p\u003E\n                \u003Cdiv className=\"grid gap-2 sm:grid-cols-2\"\u003E\n                  \u003CInvoiceInfoRow\n                    label=\"Consumo (kWh)\"\n                    value={formatNumber(selectedInvoice.metrics?.consumoEnergiaEletricaKwh ?? 0)}\n                  /\u003E\n                  \u003CInvoiceInfoRow\n                    label=\"Energia compensada (kWh)\"\n                    value={formatNumber(selectedInvoice.metrics?.energiaCompensadaKwh ?? 0)}\n                  /\u003E\n                  \u003CInvoiceInfoRow\n                    label=\"Valor sem GD (R$)\"\n                    value={formatCurrency(selectedInvoice.metrics?.valorTotalSemGdRs ?? 0)}\n                  /\u003E\n                  \u003CInvoiceInfoRow\n                    label=\"Economia GD (R$)\"\n                    value={formatCurrency(selectedInvoice.metrics?.economiaGdRs ?? 0)}\n                  /\u003E\n                \u003C/div\u003E\n              \u003C/div\u003E\n            \u003C/div\u003E\n          ) : null}\n        \u003C/Modal\u003E\n      \u003C/AppShell\u003E\n    \u003C/RequireAuth\u003E\n  );\n}\n\nfunction InvoiceInfoRow({ label, value }: { label: string; value: string }) {\n  return (\n    \u003Cdiv className=\"rounded border border-[var(--border-color)] bg-[var(--surface-1)] px-3 py-2\"\u003E\n      \u003Cp className=\"text-xs font-semibold uppercase tracking-wide text-[var(--text-secondary)]\"\u003E{label}\u003C/p\u003E\n      \u003Cp className=\"mt-1 break-all text-sm text-[var(--text-primary)]\"\u003E{value}\u003C/p\u003E\n    \u003C/div\u003E\n  );\n}\n\nfunction toMonthKey(value: string) {\n  if (!value) {\n    return null;\n  }\n  const isoMatch = value.trim().match(/^(\\d{4})-(\\d{2})$/);\n  if (isoMatch) {\n    const parsedYear = Number.parseInt(isoMatch[1], 10);\n    const parsedMonth = Number.parseInt(isoMatch[2], 10);\n    if (!Number.isFinite(parsedYear) || !Number.isFinite(parsedMonth)) {\n      return null;\n    }\n    return parsedYear * 100 + parsedMonth;\n  }\n\n  const slashMatch = value.trim().match(/^([A-Za-z]{3}|\\d{1,2})\\/(\\d{4})$/);\n  if (!slashMatch) {\n    return null;\n  }\n  const monthToken = slashMatch[1].toLowerCase();\n  const parsedYear = Number.parseInt(slashMatch[2], 10);\n  const months: Record\u003Cstring, number\u003E = {\n    jan: 1,\n    fev: 2,\n    mar: 3,\n    abr: 4,\n    mai: 5,\n    jun: 6,\n    jul: 7,\n    ago: 8,\n    set: 9,\n    out: 10,\n    nov: 11,\n    dez: 12,\n  };\n  const parsedMonth =\n    monthToken in months\n      ? months[monthToken]\n      : Number.parseInt(monthToken, 10);\n  if (!Number.isFinite(parsedYear) || !Number.isFinite(parsedMonth)) {\n    return null;\n  }\n  return parsedYear * 100 + parsedMonth;\n}\n\nfunction formatBytes(bytes: number) {\n  if (!Number.isFinite(bytes) || bytes \u003C= 0) {\n    return '0 B';\n  }\n  const units = ['B', 'KB', 'MB', 'GB'];\n  const exponent = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);\n  const value = bytes / 1024 ** exponent;\n  return `${value.toFixed(value \u003E= 10 || exponent === 0 ? 0 : 1)} ${units[exponent]}`;\n}\n\nfunction formatDate(value: string) {\n  const date = new Date(value);\n  if (Number.isNaN(date.getTime())) {\n    return value;\n  }\n  return new Intl.DateTimeFormat('pt-BR', {\n    dateStyle: 'short',\n    timeStyle: 'short',\n  }).format(date);\n}\n\nfunction formatNumber(value: number) {\n  return new Intl.NumberFormat('pt-BR', {\n    maximumFractionDigits: 2,\n  }).format(value);\n}\n\nfunction formatCurrency(value: number) {\n  return new Intl.NumberFormat('pt-BR', {\n    style: 'currency',\n    currency: 'BRL',\n  }).format(value);\n}\n","frontend/src/app/login/page.tsx":"import Link from 'next/link';\nimport { LoginForm } from '@/features/auth/login-form';\n\nexport default function LoginPage() {\n  return (\n    \u003Cmain className=\"mx-auto flex min-h-screen max-w-md flex-col justify-center px-6\"\u003E\n      \u003Csection className=\"rounded-xl border border-[var(--border-color)] bg-[var(--surface-1)] p-6 shadow-sm\"\u003E\n        \u003Ch1 className=\"mb-1 text-2xl font-bold text-[var(--text-primary)]\"\u003EEntrar\u003C/h1\u003E\n        \u003Cp className=\"mb-5 text-sm text-[var(--text-secondary)]\"\u003E\n          Acesse a plataforma enterprise de faturas.\n        \u003C/p\u003E\n        \u003CLoginForm /\u003E\n        \u003Cp className=\"mt-4 text-sm text-[var(--text-secondary)]\"\u003E\n          Nao tem conta?{' '}\n          \u003CLink href=\"/register\" className=\"font-semibold text-[var(--accent)]\"\u003E\n            Registrar\n          \u003C/Link\u003E\n        \u003C/p\u003E\n      \u003C/section\u003E\n    \u003C/main\u003E\n  );\n}\n","frontend/src/app/profile/page.tsx":"'use client';\n\nimport { useMutation } from '@tanstack/react-query';\nimport { FormEvent, useState } from 'react';\nimport { AppShell } from '@/widgets/app-shell/app-shell';\nimport { RequireAuth } from '@/features/session/require-auth';\nimport { Card } from '@/shared/ui/card';\nimport { Input } from '@/shared/ui/input';\nimport { Button } from '@/shared/ui/button';\nimport { updateProfileRequest } from '@/entities/auth/api/auth.client';\nimport { setAuthUser } from '@/entities/auth/model/auth.slice';\nimport { useAppDispatch, useAppSelector } from '@/shared/store/hooks';\n\nexport default function ProfilePage() {\n  const user = useAppSelector((state) =\u003E state.auth.user);\n  const dispatch = useAppDispatch();\n  const [message, setMessage] = useState('');\n\n  const mutation = useMutation({\n    mutationFn: updateProfileRequest,\n    onSuccess: (updatedUser) =\u003E {\n      dispatch(setAuthUser(updatedUser));\n      setMessage('Perfil atualizado com sucesso.');\n    },\n    onError: (err) =\u003E {\n      setMessage(err instanceof Error ? err.message : 'Falha ao atualizar perfil.');\n    },\n  });\n\n  function onSubmit(event: FormEvent\u003CHTMLFormElement\u003E) {\n    event.preventDefault();\n    setMessage('');\n    const formData = new FormData(event.currentTarget);\n    mutation.mutate({\n      username: String(formData.get('username') ?? '') || undefined,\n      password: String(formData.get('password') ?? '') || undefined,\n    });\n  }\n\n  return (\n    \u003CRequireAuth\u003E\n      \u003CAppShell\u003E\n        \u003Cdiv className=\"mx-auto w-full max-w-3xl\"\u003E\n          \u003CCard title=\"Meu perfil\"\u003E\n            \u003Cform className=\"flex w-full flex-col gap-4\" onSubmit={onSubmit}\u003E\n              \u003CInput\n                label=\"Nome de usuario\"\n                name=\"username\"\n                defaultValue={user?.username}\n              /\u003E\n              \u003CInput\n                label=\"Nova senha (opcional)\"\n                type=\"password\"\n                name=\"password\"\n                placeholder=\"Deixe em branco para nao alterar\"\n              /\u003E\n              \u003CButton type=\"submit\" disabled={mutation.isPending} className=\"sm:w-fit\"\u003E\n                {mutation.isPending ? 'Salvando...' : 'Salvar alteracoes'}\n              \u003C/Button\u003E\n            \u003C/form\u003E\n            {message ? (\n              \u003Cp className=\"mt-4 text-sm text-[var(--text-secondary)]\"\u003E{message}\u003C/p\u003E\n            ) : null}\n          \u003C/Card\u003E\n        \u003C/div\u003E\n      \u003C/AppShell\u003E\n    \u003C/RequireAuth\u003E\n  );\n}\n","frontend/src/app/register/page.tsx":"import Link from 'next/link';\nimport { RegisterForm } from '@/features/auth/register-form';\n\nexport default function RegisterPage() {\n  return (\n    \u003Cmain className=\"mx-auto flex min-h-screen max-w-md flex-col justify-center px-6\"\u003E\n      \u003Csection className=\"rounded-xl border border-[var(--border-color)] bg-[var(--surface-1)] p-6 shadow-sm\"\u003E\n        \u003Ch1 className=\"mb-1 text-2xl font-bold text-[var(--text-primary)]\"\u003ECriar conta\u003C/h1\u003E\n        \u003Cp className=\"mb-5 text-sm text-[var(--text-secondary)]\"\u003E\n          Registro com autentica\u00e7\u00e3o segura e RBAC.\n        \u003C/p\u003E\n        \u003CRegisterForm /\u003E\n        \u003Cp className=\"mt-4 text-sm text-[var(--text-secondary)]\"\u003E\n          Ja possui conta?{' '}\n          \u003CLink href=\"/login\" className=\"font-semibold text-[var(--accent)]\"\u003E\n            Entrar\n          \u003C/Link\u003E\n        \u003C/p\u003E\n      \u003C/section\u003E\n    \u003C/main\u003E\n  );\n}\n","frontend/src/entities/admin/api/admin.client.ts":"'use client';\n\nimport { apiClient } from '@/shared/api/client';\nimport { unwrapApiResponse, type ApiEnvelope } from '@/shared/api/types';\n\nexport async function listAdminUsers() {\n  const response = await apiClient.get\u003CApiEnvelope\u003CRecord\u003Cstring, unknown\u003E[]\u003E\u003E(\n    '/admin/users',\n  );\n  return unwrapApiResponse(response.data);\n}\n\nexport async function createAdminUser(payload: {\n  email: string;\n  username: string;\n  password: string;\n  role?: 'ADMIN' | 'USER';\n}) {\n  const response = await apiClient.post\u003CApiEnvelope\u003CRecord\u003Cstring, unknown\u003E\u003E\u003E(\n    '/admin/users',\n    payload,\n  );\n  return unwrapApiResponse(response.data);\n}\n\nexport async function updateAdminUser(\n  userId: string,\n  payload: {\n    username?: string;\n    password?: string;\n    role?: 'ADMIN' | 'USER';\n    isActive?: boolean;\n  },\n) {\n  const response = await apiClient.patch\u003CApiEnvelope\u003CRecord\u003Cstring, unknown\u003E\u003E\u003E(\n    `/admin/users/${userId}`,\n    payload,\n  );\n  return unwrapApiResponse(response.data);\n}\n\nexport async function deleteAdminUser(userId: string) {\n  const response = await apiClient.delete\u003CApiEnvelope\u003CRecord\u003Cstring, unknown\u003E\u003E\u003E(\n    `/admin/users/${userId}`,\n  );\n  return unwrapApiResponse(response.data);\n}\n\nexport async function listAdminInvoices() {\n  const response = await apiClient.get\u003CApiEnvelope\u003CRecord\u003Cstring, unknown\u003E[]\u003E\u003E(\n    '/admin/invoices',\n  );\n  return unwrapApiResponse(response.data);\n}\n\nexport async function updateAdminInvoiceReferenceMonth(\n  invoiceId: string,\n  mesReferencia: string,\n) {\n  const response = await apiClient.patch\u003CApiEnvelope\u003CRecord\u003Cstring, unknown\u003E\u003E\u003E(\n    `/admin/invoices/${invoiceId}/reference-month`,\n    { mesReferencia },\n  );\n  return unwrapApiResponse(response.data);\n}\n\nexport async function deleteAdminInvoice(invoiceId: string) {\n  const response = await apiClient.delete\u003CApiEnvelope\u003CRecord\u003Cstring, unknown\u003E\u003E\u003E(\n    `/admin/invoices/${invoiceId}`,\n  );\n  return unwrapApiResponse(response.data);\n}\n\nexport async function listAdminDocuments() {\n  const response = await apiClient.get\u003CApiEnvelope\u003CRecord\u003Cstring, unknown\u003E[]\u003E\u003E(\n    '/admin/documents',\n  );\n  return unwrapApiResponse(response.data);\n}\n\nexport async function downloadAdminDocument(documentId: string) {\n  const response = await apiClient.get\u003C\n    ApiEnvelope\u003C{ fileName: string; mimeType: string; contentBase64: string }\u003E\n  \u003E(`/admin/documents/${documentId}/download`);\n  return unwrapApiResponse(response.data);\n}\n\nexport async function deleteAdminDocument(documentId: string) {\n  const response = await apiClient.delete\u003CApiEnvelope\u003CRecord\u003Cstring, unknown\u003E\u003E\u003E(\n    `/admin/documents/${documentId}`,\n  );\n  return unwrapApiResponse(response.data);\n}\n\nexport async function listAdminAuditLogs(params?: {\n  page?: number;\n  pageSize?: number;\n}) {\n  const response = await apiClient.get\u003CApiEnvelope\u003CRecord\u003Cstring, unknown\u003E[]\u003E\u003E(\n    '/admin/audit-logs',\n    {\n      params,\n    },\n  );\n  return unwrapApiResponse(response.data);\n}\n","frontend/src/entities/auth/api/auth.client.ts":"'use client';\n\nimport axios from 'axios';\nimport { unwrapApiResponse, type ApiEnvelope } from '@/shared/api/types';\nimport type { AuthUser } from '../model/auth.types';\n\ntype AuthTokensPayload = {\n  accessToken: string;\n  refreshToken: string;\n  accessTokenExpiresIn: string;\n  refreshTokenExpiresIn: string;\n  user: AuthUser;\n};\n\ntype Credentials = {\n  email: string;\n  password: string;\n};\n\ntype RegisterPayload = Credentials \u0026 {\n  username: string;\n};\n\nconst authHttp = axios.create({\n  baseURL: '/api/auth',\n  withCredentials: true,\n});\n\nexport async function registerRequest(payload: RegisterPayload): Promise\u003CAuthUser\u003E {\n  try {\n    const response = await authHttp.post\u003CApiEnvelope\u003CAuthTokensPayload\u003E\u003E(\n      '/register',\n      payload,\n    );\n    return unwrapApiResponse(response.data).user;\n  } catch (error) {\n    throw new Error(resolveAuthErrorMessage(error));\n  }\n}\n\nexport async function loginRequest(payload: Credentials): Promise\u003CAuthUser\u003E {\n  try {\n    const response = await authHttp.post\u003CApiEnvelope\u003CAuthTokensPayload\u003E\u003E(\n      '/login',\n      payload,\n    );\n    return unwrapApiResponse(response.data).user;\n  } catch (error) {\n    throw new Error(resolveLoginErrorMessage(error));\n  }\n}\n\nexport async function meRequest(): Promise\u003CAuthUser\u003E {\n  const response = await authHttp.get\u003CApiEnvelope\u003CAuthUser\u003E\u003E('/me');\n  return unwrapApiResponse(response.data);\n}\n\nexport async function logoutRequest(): Promise\u003Cvoid\u003E {\n  await authHttp.post('/logout');\n}\n\nexport async function updateProfileRequest(payload: {\n  username?: string;\n  password?: string;\n}): Promise\u003CAuthUser\u003E {\n  const response = await authHttp.patch\u003CApiEnvelope\u003CAuthUser\u003E\u003E('/me', payload);\n  return unwrapApiResponse(response.data);\n}\n\nfunction resolveAuthErrorMessage(error: unknown) {\n  if (axios.isAxiosError(error)) {\n    const message = (\n      error.response?.data as { error?: { message?: string } } | undefined\n    )?.error?.message;\n\n    if (typeof message === 'string' \u0026\u0026 message.trim().length \u003E 0) {\n      return message;\n    }\n  }\n\n  return 'Credenciais invalidas.';\n}\n\nfunction resolveLoginErrorMessage(error: unknown) {\n  if (axios.isAxiosError(error)) {\n    if (error.response?.status === 404) {\n      return 'Usuario nao encontrado.';\n    }\n  }\n  return 'Credenciais invalidas.';\n}\n","frontend/src/entities/auth/model/auth.slice.ts":"import { createSlice, type PayloadAction } from '@reduxjs/toolkit';\nimport type { AuthState, AuthUser } from './auth.types';\n\nconst initialState: AuthState = {\n  user: null,\n  initialized: false,\n};\n\nconst authSlice = createSlice({\n  name: 'auth',\n  initialState,\n  reducers: {\n    setAuthUser(state, action: PayloadAction\u003CAuthUser | null\u003E) {\n      state.user = action.payload;\n      state.initialized = true;\n    },\n    clearAuthUser(state) {\n      state.user = null;\n      state.initialized = true;\n    },\n    markInitialized(state) {\n      state.initialized = true;\n    },\n  },\n});\n\nexport const { setAuthUser, clearAuthUser, markInitialized } = authSlice.actions;\nexport const authReducer = authSlice.reducer;\n","frontend/src/entities/auth/model/auth.types.ts":"export type AppRole = 'ADMIN' | 'USER';\n\nexport type AuthUser = {\n  id: string;\n  email: string;\n  username: string;\n  role: AppRole;\n};\n\nexport type AuthState = {\n  user: AuthUser | null;\n  initialized: boolean;\n};\n","frontend/src/entities/invoice/api/invoice.client.ts":"'use client';\n\nimport { apiClient } from '@/shared/api/client';\nimport { unwrapApiResponse, type ApiEnvelope } from '@/shared/api/types';\n\nexport type InvoiceRecord = {\n  id: string;\n  fileName: string;\n  numeroCliente: string;\n  mesReferencia: string;\n  createdAt: string;\n  metrics?: {\n    consumoEnergiaEletricaKwh: number;\n    energiaCompensadaKwh: number;\n    valorTotalSemGdRs: number;\n    economiaGdRs: number;\n  };\n};\n\nexport async function listInvoices(params?: {\n  numeroCliente?: string;\n  mesReferencia?: string;\n  periodoInicio?: string;\n  periodoFim?: string;\n  page?: number;\n  pageSize?: number;\n}) {\n  const response = await apiClient.get\u003CApiEnvelope\u003CInvoiceRecord[]\u003E\u003E('/invoices', {\n    params,\n  });\n  return unwrapApiResponse(response.data);\n}\n\nexport type ConsolidatedDashboard = {\n  consumoEnergiaEletricaKwh: number;\n  energiaCompensadaKwh: number;\n  valorTotalSemGdRs: number;\n  economiaGdRs: number;\n};\n\nexport async function getConsolidatedDashboard() {\n  const response = await apiClient.get\u003C\n    ApiEnvelope\u003CConsolidatedDashboard\u003E\n  \u003E('/invoices/dashboard/consolidated');\n  return unwrapApiResponse(response.data);\n}\n\nexport async function getEnergyDashboard() {\n  const consolidated = await getConsolidatedDashboard();\n  return {\n    consumoEnergiaEletricaKwh: consolidated.consumoEnergiaEletricaKwh,\n    energiaCompensadaKwh: consolidated.energiaCompensadaKwh,\n  };\n}\n\nexport async function getFinancialDashboard() {\n  const consolidated = await getConsolidatedDashboard();\n  return {\n    valorTotalSemGdRs: consolidated.valorTotalSemGdRs,\n    economiaGdRs: consolidated.economiaGdRs,\n  };\n}\n\nexport async function listMyDocuments() {\n  const response = await apiClient.get\u003CApiEnvelope\u003CDocumentRecord[]\u003E\u003E(\n    '/invoices/my-documents',\n  );\n  return unwrapApiResponse(response.data);\n}\n\nexport type DocumentRecord = {\n  id: string;\n  invoiceId: string;\n  fileName: string;\n  mimeType: string;\n  sizeBytes: number;\n  checksum: string;\n  createdAt: string;\n};\n\nexport async function uploadInvoice(file: File) {\n  const formData = new FormData();\n  formData.append('file', file);\n  const response = await apiClient.post\u003CApiEnvelope\u003CRecord\u003Cstring, unknown\u003E\u003E\u003E(\n    '/invoices/extract',\n    formData,\n  );\n  return unwrapApiResponse(response.data);\n}\n","frontend/src/features/auth/login-form.tsx":"'use client';\n\nimport { useMutation } from '@tanstack/react-query';\nimport { useRouter } from 'next/navigation';\nimport { FormEvent, useState } from 'react';\nimport { loginRequest } from '@/entities/auth/api/auth.client';\nimport { setAuthUser } from '@/entities/auth/model/auth.slice';\nimport { useAppDispatch } from '@/shared/store/hooks';\nimport { Button } from '@/shared/ui/button';\nimport { Input } from '@/shared/ui/input';\n\nexport function LoginForm() {\n  const dispatch = useAppDispatch();\n  const router = useRouter();\n  const [error, setError] = useState\u003Cstring\u003E('');\n\n  const mutation = useMutation({\n    mutationFn: loginRequest,\n    onSuccess: (user) =\u003E {\n      dispatch(setAuthUser(user));\n      router.push('/');\n    },\n    onError: (err) =\u003E {\n      setError(err instanceof Error ? err.message : 'Falha ao autenticar.');\n    },\n  });\n\n  function handleSubmit(event: FormEvent\u003CHTMLFormElement\u003E) {\n    event.preventDefault();\n    setError('');\n    const form = new FormData(event.currentTarget);\n    mutation.mutate({\n      email: String(form.get('email') ?? ''),\n      password: String(form.get('password') ?? ''),\n    });\n  }\n\n  return (\n    \u003Cform onSubmit={handleSubmit} className=\"flex flex-col gap-4\"\u003E\n      \u003CInput name=\"email\" type=\"email\" label=\"E-mail\" required /\u003E\n      \u003CInput name=\"password\" type=\"password\" label=\"Senha\" required /\u003E\n      {error ? \u003Cp className=\"text-sm text-red-600\"\u003E{error}\u003C/p\u003E : null}\n      \u003CButton type=\"submit\" disabled={mutation.isPending}\u003E\n        {mutation.isPending ? 'Entrando...' : 'Entrar'}\n      \u003C/Button\u003E\n    \u003C/form\u003E\n  );\n}\n","frontend/src/features/auth/register-form.tsx":"'use client';\n\nimport { useMutation } from '@tanstack/react-query';\nimport { useRouter } from 'next/navigation';\nimport { FormEvent, useState } from 'react';\nimport { registerRequest } from '@/entities/auth/api/auth.client';\nimport { setAuthUser } from '@/entities/auth/model/auth.slice';\nimport { useAppDispatch } from '@/shared/store/hooks';\nimport { Button } from '@/shared/ui/button';\nimport { Input } from '@/shared/ui/input';\n\nexport function RegisterForm() {\n  const dispatch = useAppDispatch();\n  const router = useRouter();\n  const [error, setError] = useState('');\n\n  const mutation = useMutation({\n    mutationFn: registerRequest,\n    onSuccess: (user) =\u003E {\n      dispatch(setAuthUser(user));\n      router.push('/');\n    },\n    onError: (err) =\u003E {\n      setError(err instanceof Error ? err.message : 'Falha ao registrar.');\n    },\n  });\n\n  function handleSubmit(event: FormEvent\u003CHTMLFormElement\u003E) {\n    event.preventDefault();\n    setError('');\n    const form = new FormData(event.currentTarget);\n    mutation.mutate({\n      username: String(form.get('username') ?? ''),\n      email: String(form.get('email') ?? ''),\n      password: String(form.get('password') ?? ''),\n    });\n  }\n\n  return (\n    \u003Cform onSubmit={handleSubmit} className=\"flex flex-col gap-4\"\u003E\n      \u003CInput name=\"username\" label=\"Nome de usuario\" required /\u003E\n      \u003CInput name=\"email\" type=\"email\" label=\"E-mail\" required /\u003E\n      \u003CInput name=\"password\" type=\"password\" label=\"Senha forte\" required /\u003E\n      {error ? \u003Cp className=\"text-sm text-red-600\"\u003E{error}\u003C/p\u003E : null}\n      \u003CButton type=\"submit\" disabled={mutation.isPending}\u003E\n        {mutation.isPending ? 'Registrando...' : 'Criar conta'}\n      \u003C/Button\u003E\n    \u003C/form\u003E\n  );\n}\n","frontend/src/features/session/init-session.tsx":"'use client';\n\nimport { useQuery } from '@tanstack/react-query';\nimport { useEffect } from 'react';\nimport { meRequest } from '@/entities/auth/api/auth.client';\nimport {\n  clearAuthUser,\n  setAuthUser,\n} from '@/entities/auth/model/auth.slice';\nimport { useAppDispatch, useAppSelector } from '@/shared/store/hooks';\n\nexport function SessionInitializer() {\n  const dispatch = useAppDispatch();\n  const initialized = useAppSelector((state) =\u003E state.auth.initialized);\n\n  const query = useQuery({\n    queryKey: ['auth', 'me'],\n    queryFn: meRequest,\n    retry: false,\n    enabled: !initialized,\n    staleTime: 60_000,\n    refetchOnWindowFocus: false,\n  });\n\n  useEffect(() =\u003E {\n    if (query.data) {\n      dispatch(setAuthUser(query.data));\n      return;\n    }\n\n    if (query.error) {\n      dispatch(clearAuthUser());\n    }\n  }, [dispatch, query.data, query.error]);\n\n  return null;\n}\n","frontend/src/features/session/require-auth.tsx":"'use client';\n\nimport { useEffect } from 'react';\nimport { useRouter } from 'next/navigation';\nimport { useAppSelector } from '@/shared/store/hooks';\n\ntype RequireAuthProps = {\n  children: React.ReactNode;\n  role?: 'ADMIN' | 'USER';\n};\n\nexport function RequireAuth({ children, role }: RequireAuthProps) {\n  const router = useRouter();\n  const { user, initialized } = useAppSelector((state) =\u003E state.auth);\n\n  useEffect(() =\u003E {\n    if (!initialized) {\n      return;\n    }\n\n    if (!user) {\n      router.replace('/login');\n      return;\n    }\n\n    if (role \u0026\u0026 user.role !== role) {\n      router.replace('/');\n    }\n  }, [initialized, role, router, user]);\n\n  if (!initialized || !user) {\n    return \u003Cp className=\"p-6 text-sm text-[var(--text-secondary)]\"\u003ECarregando sessao...\u003C/p\u003E;\n  }\n\n  if (role \u0026\u0026 user.role !== role) {\n    return null;\n  }\n\n  return \u003C\u003E{children}\u003C/\u003E;\n}\n","frontend/src/shared/api/client.ts":"'use client';\n\nimport axios from 'axios';\n\nexport const apiClient = axios.create({\n  baseURL: '/api/proxy',\n  withCredentials: true,\n});\n","frontend/src/shared/api/server-auth.ts":"import { cookies } from 'next/headers';\nimport { NextResponse } from 'next/server';\nimport {\n  ACCESS_TOKEN_COOKIE,\n  REFRESH_TOKEN_COOKIE,\n  getBackendApiUrl,\n} from '@/shared/config/server-env';\n\ntype BackendAuthPayload = {\n  accessToken: string;\n  refreshToken: string;\n  accessTokenExpiresIn: string;\n  refreshTokenExpiresIn: string;\n  user: {\n    id: string;\n    email: string;\n    username: string;\n    role: 'ADMIN' | 'USER';\n  };\n};\n\nfunction parseDurationInSeconds(rawDuration: string): number {\n  if (rawDuration.endsWith('m')) return Number(rawDuration.slice(0, -1)) * 60;\n  if (rawDuration.endsWith('h')) return Number(rawDuration.slice(0, -1)) * 3600;\n  if (rawDuration.endsWith('d')) return Number(rawDuration.slice(0, -1)) * 86400;\n  return 900;\n}\n\nexport function setSessionCookies(\n  response: NextResponse,\n  payload: BackendAuthPayload,\n) {\n  response.cookies.set(ACCESS_TOKEN_COOKIE, payload.accessToken, {\n    httpOnly: true,\n    sameSite: 'lax',\n    secure: process.env.NODE_ENV === 'production',\n    maxAge: parseDurationInSeconds(payload.accessTokenExpiresIn),\n    path: '/',\n  });\n\n  response.cookies.set(REFRESH_TOKEN_COOKIE, payload.refreshToken, {\n    httpOnly: true,\n    sameSite: 'lax',\n    secure: process.env.NODE_ENV === 'production',\n    maxAge: parseDurationInSeconds(payload.refreshTokenExpiresIn),\n    path: '/',\n  });\n}\n\nexport function clearSessionCookies(response: NextResponse) {\n  response.cookies.set(ACCESS_TOKEN_COOKIE, '', {\n    httpOnly: true,\n    maxAge: 0,\n    path: '/',\n  });\n  response.cookies.set(REFRESH_TOKEN_COOKIE, '', {\n    httpOnly: true,\n    maxAge: 0,\n    path: '/',\n  });\n}\n\nexport async function getServerAccessToken() {\n  return (await cookies()).get(ACCESS_TOKEN_COOKIE)?.value;\n}\n\nexport async function getServerRefreshToken() {\n  return (await cookies()).get(REFRESH_TOKEN_COOKIE)?.value;\n}\n\nexport async function refreshAccessTokenIfNeeded() {\n  const refreshToken = await getServerRefreshToken();\n  if (!refreshToken) {\n    return null;\n  }\n\n  const backendUrl = getBackendApiUrl();\n  const response = await fetch(`${backendUrl}/api/auth/refresh`, {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({ refreshToken }),\n    cache: 'no-store',\n  });\n\n  if (!response.ok) {\n    return null;\n  }\n\n  const json = (await response.json()) as {\n    success: boolean;\n    data?: BackendAuthPayload;\n  };\n\n  if (!json.success || !json.data) {\n    return null;\n  }\n\n  return json.data;\n}\n","frontend/src/shared/api/types.ts":"export type ApiSuccess\u003CT\u003E = {\n  success: true;\n  path: string;\n  timestamp: string;\n  data: T;\n};\n\nexport type ApiFailure = {\n  success: false;\n  path: string;\n  timestamp: string;\n  error: {\n    statusCode: number;\n    message: string;\n    details?: unknown;\n  };\n};\n\nexport type ApiEnvelope\u003CT\u003E = ApiSuccess\u003CT\u003E | ApiFailure;\n\nexport function unwrapApiResponse\u003CT\u003E(payload: ApiEnvelope\u003CT\u003E): T {\n  if (!payload.success) {\n    throw new Error(payload.error.message);\n  }\n\n  return payload.data;\n}\n","frontend/src/shared/config/server-env.ts":"export function getBackendApiUrl(): string {\n  return (\n    process.env.BACKEND_API_URL ??\n    process.env.NEXT_PUBLIC_BACKEND_API_URL ??\n    'http://localhost:3000'\n  );\n}\n\nexport const ACCESS_TOKEN_COOKIE = 'ebill_access_token';\nexport const REFRESH_TOKEN_COOKIE = 'ebill_refresh_token';\n","frontend/src/shared/store/hooks.ts":"'use client';\n\nimport { useDispatch, useSelector } from 'react-redux';\nimport type { AppDispatch, RootState } from './store';\n\nexport const useAppDispatch = useDispatch.withTypes\u003CAppDispatch\u003E();\nexport const useAppSelector = useSelector.withTypes\u003CRootState\u003E();\n","frontend/src/shared/store/store.ts":"import { configureStore } from '@reduxjs/toolkit';\nimport { authReducer } from '@/entities/auth/model/auth.slice';\n\nexport const store = configureStore({\n  reducer: {\n    auth: authReducer,\n  },\n});\n\nexport type RootState = ReturnType\u003Ctypeof store.getState\u003E;\nexport type AppDispatch = typeof store.dispatch;\n","frontend/src/shared/ui/button.tsx":"import type { ButtonHTMLAttributes } from 'react';\n\nty e-1)] px-3 py-2 text-[var(--text-primary)] outline-none ring-[var(--accent)] transition focus:ring-2 ${className}`}\n        {...props}\n      /\u003E\n    \u003C/label\u003E\n  );\n}\n","frontend/src/shared/ui/modal.tsx":"import { ReactNode } from 'react';\n\ntype ModalProps = {\n  open: boolean;\n  title: string;\n  onClose: () =\u003E void;\n  children: ReactNode;\n  footer?: ReactNode;\n};\n\nexport function Modal({ open, title, children, footer }: ModalProps) {\n  if (!open) {\n    return null;\n  }\n\n  return (\n    \u003Cdiv className=\"fixed inset-0 z-50 flex items-end justify-center bg-black/45 p-3 sm:items-center sm:p-6\"\u003E\n      \u003Cdiv className=\"flex max-h-[92vh] w-full max-w-3xl flex-col overflow-hidden rounded-xl border border-[var(--border-color)] bg-[var(--surface-1)] shadow-xl\"\u003E\n        \u003Cheader className=\"border-b border-[var(--border-color)] px-4 py-3\"\u003E\n          \u003Ch3 className=\"text-base font-semibold text-[var(--text-primary)]\"\u003E{title}\u003C/h3\u003E\n        \u003C/header\u003E\n        \u003Cdiv className=\"overflow-y-auto px-4 py-4\"\u003E{children}\u003C/div\u003E\n        {footer ? (\n          \u003Cfooter className=\"flex flex-wrap justify-end gap-2 border-t border-[var(--border-color)] px-4 py-3\"\u003E\n            {footer}\n          \u003C/footer\u003E\n        ) : null}\n      \u003C/div\u003E\n    \u003C/div\u003E\n  );\n}\n","frontend/src/shared/ui/month-selector.tsx":"import { useMemo } from 'react';\n\ntype MonthSelectorProps = {\n  label: string;\n  value: string;\n  onChange: (value: string) =\u003E void;\n  startYear?: number;\n  endYear?: number;\n};\n\nconst months = [\n  { value: '01', label: 'Jan' },\n  { value: '02', label: 'Fev' },\n  { value: '03', label: 'Mar' },\n  { value: '04', label: 'Abr' },\n  { value: '05', label: 'Mai' },\n  { value: '06', label: 'Jun' },\n  { value: '07', label: 'Jul' },\n  { value: '08', label: 'Ago' },\n  { value: '09', label: 'Set' },\n  { value: '10' <script>
(function(){
'use strict';

var I18N={
  lines:function(n){return n+' lines';},
  noFiles:'No files match',
  trunc:function(shown,total){return 'Showing first '+shown+' of '+total+' lines.';},
  copied:'Copied!'
};

var el=document.getElementById('filesData');
var raw=el?el.textContent:'{}';
var data;
try{data=JSON.parse(raw);}catch(e){data={};}

var FILES=data.files||{};
var FILE_KEYS=data.fileKeys||Object.keys(FILES).sort();
document.getElementById('totalFiles').textContent=FILE_KEYS.length;

if(typeof marked!=='undefined'){
  try{
    marked.setOptions({gfm:true,breaks:true});
  }catch(e1){
    try{marked.use({gfm:true,breaks:true});}catch(e2){}
  }
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function fmtSize(n){
  if(n<1024)return n+' B';
  if(n<1048576)return(n/1024).toFixed(1)+' KB';
  return(n/1048576).toFixed(2)+' MB';
}

function getExt(name){
  if(name.startsWith('.'))return name.slice(1).toLowerCase();
  var p=name.lastIndexOf('.');
  return p>-1?name.slice(p+1).toLowerCase():'';
}

var LANG_MAP={ts:'typescript',tsx:'typescript',js:'javascript',jsx:'javascript',json:'json',md:'markdown',css:'css',scss:'css',html:'xml',htm:'xml',yml:'yaml',yaml:'yaml',sh:'bash',prisma:'sql',graphql:'graphql',py:'python',rb:'ruby',go:'go',rs:'rust',java:'java',kt:'kotlin',swift:'swift',c:'c',cpp:'cpp',cs:'csharp'};
function getLang(name){return LANG_MAP[getExt(name)]||'plaintext';}

var EXT_COLOR={ts:'#3178c6',tsx:'#3178c6',js:'#f1e05a',jsx:'#f1e05a',json:'#ff9800',md:'#8b949e',css:'#563d7c',scss:'#c6538c',html:'#e34c26',htm:'#e34c26',prisma:'#5a67d8',yml:'#89e051',yaml:'#89e051',sh:'#89e051',svg:'#ffb13b',env:'#ebc84a',txt:'#8b949e',lock:'#8b949e',png:'#8b949e',jpg:'#8b949e',gif:'#8b949e',gitignore:'#f54d27'};

function svgFile(name,sz){
  sz=sz||16;
  var c=EXT_COLOR[getExt(name)]||'#8b949e';
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 16 16" fill="'+c+'"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688Z"/></svg>';
}
function svgFolder(open,sz){
  sz=sz||16;
  if(open)return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 16 16" fill="#54aeff"><path d="M.513 1.513A1.75 1.75 0 0 1 1.75 1h3.5c.55 0 1.07.26 1.4.7l.9 1.2a.25.25 0 0 0 .2.1H14.25c.966 0 1.75.784 1.75 1.75v7.5A1.75 1.75 0 0 1 14.25 14H1.75A1.75 1.75 0 0 1 0 12.25V3.25c0-.464.184-.91.513-1.237Z"/></svg>';
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 16 16" fill="#54aeff"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1Z"/></svg>';
}
function svgChev(open,sz){
  sz=sz||12;
  var r=open?'rotate(90deg)':'rotate(0deg)';
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 12 12" fill="#7d8590" style="transition:transform .15s;transform:'+r+'"><path d="M4.7 10c-.2 0-.4-.1-.5-.2-.3-.3-.3-.8 0-1.1L6.9 6 4.2 3.3c-.3-.3-.3-.8 0-1.1.3-.3.8-.3 1.1 0l3.3 3.2c.1.1.2.3.2.5s-.1.4-.2.5L5.3 9.7c-.2.2-.4.3-.6.3Z"/></svg>';
}

var openDirs={};
var currentFile=null;
var viewMode='code';

function buildPathTree(keys){
  var root={};
  keys.forEach(function(k){
    var parts=k.split('/');
    var node=root;
    for(var i=0;i<parts.length-1;i++){
      var pathSoFar=parts.slice(0,i+1).join('/');
      var dk='__d__'+pathSoFar;
      if(!node[dk])node[dk]={__dir:true,__name:parts[i],__path:pathSoFar,__ch:{}};
      node=node[dk].__ch;
    }
    var fn=parts[parts.length-1];
    node['__f__'+fn]={__dir:false,__name:fn,__path:k};
  });
  return root;
}

function sortedEntries(node){
  var dirs=[],fls=[];
  Object.keys(node).forEach(function(k){
    if(node[k].__dir)dirs.push(node[k]);
    else fls.push(node[k]);
  });
  dirs.sort(function(a,b){return a.__name.localeCompare(b.__name);});
  fls.sort(function(a,b){return a.__name.localeCompare(b.__name);});
  return dirs.concat(fls);
}

function renderNode(entry,depth,parent){
  var indent=(8+depth*16)+'px';
  if(entry.__dir){
    var dirKey=entry.__path;
    var isOpen=!!openDirs[dirKey];
    var row=document.createElement('div');
    row.className='ti';
    row.style.paddingLeft=indent;
    row.innerHTML='<span class="ti-chev'+(isOpen?' open':'')+'">'+svgChev(isOpen)+'</span>'
      +'<span class="ti-icon">'+svgFolder(isOpen)+'</span>'
      +'<span class="ti-name dir">'+esc(entry.__name)+'</span>';
    var childWrap=document.createElement('div');
    childWrap.className='ti-children'+(isOpen?'':' closed');
    var populated=false;
    if(isOpen){populated=true;sortedEntries(entry.__ch).forEach(function(c){renderNode(c,depth+1,childWrap);});}
    row.addEventListener('click',function(e){
      e.stopPropagation();
      isOpen=!isOpen;
      openDirs[dirKey]=isOpen;
      childWrap.classList.toggle('closed',!isOpen);
      row.querySelector('.ti-chev').className='ti-chev'+(isOpen?' open':'');
      row.querySelector('.ti-chev').innerHTML=svgChev(isOpen);
      row.querySelector('.ti-icon').innerHTML=svgFolder(isOpen);
      if(isOpen&&!populated){
        populated=true;
        sortedEntries(entry.__ch).forEach(function(c){renderNode(c,depth+1,childWrap);});
      }
    });
    parent.appendChild(row);
    parent.appendChild(childWrap);
  } else {
    var row2=document.createElement('div');
    row2.className='ti'+(entry.__path===currentFile?' active':'');
    row2.style.paddingLeft=indent;
    row2.dataset.path=entry.__path;
    row2.innerHTML='<span class="ti-chev blank">'+svgChev(false)+'</span>'
      +'<span class="ti-icon">'+svgFile(entry.__name)+'</span>'
      +'<span class="ti-name file">'+esc(entry.__name)+'</span>';
    row2.addEventListener('click',function(e){e.stopPropagation();openFile(entry.__path);});
    parent.appendChild(row2);
  }
}

function renderTree(filter){
  var treeEl=document.getElementById('tree');
  treeEl.innerHTML='';
  openDirs={};
  var keys=filter
    ?FILE_KEYS.filter(function(k){return k.toLowerCase().indexOf(filter.toLowerCase())>=0;})
    :FILE_KEYS;
  if(!keys.length){treeEl.innerHTML='<div class="sb-empty" id="treeEmpty">'+esc(I18N.noFiles)+'</div>';return;}
  if(filter){
    keys.forEach(function(k){
      var parts=k.split('/');
      var name=parts[parts.length-1];
      var d=document.createElement('div');
      d.className='ti'+(k===currentFile?' active':'');
      d.style.paddingLeft='8px';
      d.dataset.path=k;
      d.innerHTML='<span class="ti-chev blank">'+svgChev(false)+'</span>'
        +'<span class="ti-icon">'+svgFile(name)+'</span>'
        +'<span class="ti-name file" title="'+esc(k)+'">'
        +(k.length>38?'…'+k.slice(-36):esc(k))+'</span>';
      d.addEventListener('click',function(){openFile(k);});
      treeEl.appendChild(d);
    });
  } else {
    var tree=buildPathTree(keys);
    sortedEntries(tree).forEach(function(entry){renderNode(entry,0,treeEl);});
  }
}

function setMdSegVisible(show){
  var seg=document.getElementById('mdSeg');
  if(show)seg.classList.add('open');else seg.classList.remove('open');
}

function updateSegButtons(){
  var c=document.getElementById('btnCode');
  var p=document.getElementById('btnPreview');
  if(viewMode==='preview'){p.classList.add('active');c.classList.remove('active');}
  else{c.classList.add('active');p.classList.remove('active');}
}

function copyTextFallback(text){
  var ta=document.createElement('textarea');
  ta.value=text;
  ta.setAttribute('readonly','');
  ta.style.position='fixed';
  ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}

function copyToClipboard(text,onOk){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onOk).catch(function(){copyTextFallback(text);onOk();});
  }else{copyTextFallback(text);onOk();}
}

function flashBtn(btn,duration){
  btn.classList.add('ok');
  setTimeout(function(){btn.classList.remove('ok');},duration||1600);
}

var MAX_LINES=4000;

function openFile(path){
  currentFile=path;
  document.querySelectorAll('.ti[data-path]').forEach(function(n){
    n.classList.toggle('active',n.dataset.path===path);
  });
  var content=FILES[path]||'';
  var parts=path.split('/');
  var name=parts[parts.length-1];
  var ext=getExt(name);
  var lang=getLang(name);
  var lines=content.split('\n');
  var bytes=0;
  try{bytes=(new TextEncoder()).encode(content).length;}catch(e){bytes=content.length;}

  var bcEl=document.getElementById('breadcrumb');
  var bcHtml='<a class="bc-item" href="#" onclick="clearFile();return false;">energy-bill-ai-parser</a>';
  for(var i=0;i<parts.length;i++){
    bcHtml+='<span class="bc-sep">/</span>';
    if(i===parts.length-1)bcHtml+='<span class="bc-item last">'+esc(parts[i])+'</span>';
    else bcHtml+='<span class="bc-item">'+esc(parts[i])+'</span>';
  }
  bcEl.innerHTML=bcHtml;

  document.getElementById('fibLines').textContent=I18N.lines(lines.length);
  document.getElementById('fibSize').textContent=fmtSize(bytes);
  var langTag=document.getElementById('fibLang');
  langTag.textContent=lang.toUpperCase();
  langTag.style.color=EXT_COLOR[ext]||'#8b949e';

  document.getElementById('blobTitle').textContent=name;
  document.getElementById('blobSub').textContent=path;
  document.getElementById('blobFileIcon').innerHTML=svgFile(name,20);
  document.getElementById('footerPath').textContent=path;
  document.getElementById('blobHeader').classList.add('open');
  document.getElementById('blobFooter').classList.add('open');

  if(ext==='md'){
    viewMode='preview';
    setMdSegVisible(true);
    updateSegButtons();
  }else{
    viewMode='code';
    setMdSegVisible(false);
  }

  renderContent(path,content);
}

function renderContent(path,content){
  var parts=path.split('/');
  var name=parts[parts.length-1];
  var ext=getExt(name);
  var cw=document.getElementById('codeWrap');
  cw.innerHTML='';

  if(ext==='md'&&viewMode==='preview'){
    var div=document.createElement('div');
    div.className='md-view';
    div.innerHTML=typeof marked!=='undefined'
      ?marked.parse(content)
      :'<pre>'+esc(content)+'</pre>';
    div.querySelectorAll('pre code').forEach(function(b){
      try{hljs.highlightElement(b);}catch(e){}
    });
    cw.appendChild(div);
    return;
  }

  var lines=content.split('\n');
  var truncated=lines.length>MAX_LINES;
  var displayLines=truncated?lines.slice(0,MAX_LINES):lines;
  var lang=getLang(name);
  var hlSrc;
  try{
    hlSrc=hljs.highlight(displayLines.join('\n'),{language:lang,ignoreIllegals:true}).value;
  }catch(e){
    hlSrc=esc(displayLines.join('\n'));
  }
  var hlLines=hlSrc.split('\n');
  var lnHtml='';
  for(var i=0;i<displayLines.length;i++){
    var n=i+1;
    lnHtml+='<tr id="R'+n+'"><td class="ln"><a class="ln-a" id="L'+n+'" href="#L'+n+'" onclick="hlLineClick('+n+',event)">'+n+'</a></td>'
      +'<td class="lc">'+(hlLines[i]!==undefined?hlLines[i]:'')+'</td></tr>';
  }
  var table=document.createElement('table');
  table.className='ct';
  table.innerHTML='<tbody>'+lnHtml+'</tbody>';
  cw.appendChild(table);
  if(truncated){
    var note=document.createElement('div');
    note.className='trunc-note';
    note.textContent=I18N.trunc(MAX_LINES,lines.length);
    cw.appendChild(note);
  }
  var hash=window.location.hash;
  if(hash){
    var m=hash.match(/^#L(\d+)$/);
    if(m){var a=document.getElementById('L'+m[1]);if(a)setTimeout(function(){a.scrollIntoView({block:'center'});},50);}
  }
}

var lastHl=null;
function hlLineClick(n,e){
  if(e)e.preventDefault();
  var tr=document.getElementById('R'+n);
  if(!tr)return;
  if(lastHl&&lastHl!==tr){lastHl.classList.remove('hl');}
  tr.classList.toggle('hl');
  lastHl=tr.classList.contains('hl')?tr:null;
  window.location.hash='#L'+n;
}
window.hlLineClick=hlLineClick;

document.getElementById('btnCode').addEventListener('click',function(){
  if(!currentFile)return;
  var name=currentFile.split('/').pop();
  if(getExt(name)!=='md')return;
  viewMode='code';
  updateSegButtons();
  renderContent(currentFile,FILES[currentFile]||'');
});
document.getElementById('btnPreview').addEventListener('click',function(){
  if(!currentFile)return;
  var name=currentFile.split('/').pop();
  if(getExt(name)!=='md')return;
  viewMode='preview';
  updateSegButtons();
  renderContent(currentFile,FILES[currentFile]||'');
});

document.getElementById('copyBtn').addEventListener('click',function(){
  if(!currentFile)return;
  var content=FILES[currentFile]||'';
  var btn=this;
  copyToClipboard(content,function(){
    var sp=document.getElementById('lblCopy');
    var prev=sp?sp.textContent:'Copy';
    if(sp)sp.textContent=I18N.copied;
    flashBtn(btn,2000);
    setTimeout(function(){if(sp)sp.textContent=prev;},2000);
  });
});

document.getElementById('copyPathBtn').addEventListener('click',function(){
  if(!currentFile)return;
  var btn=this;
  copyToClipboard(currentFile,function(){
    var sp=document.getElementById('lblCopyPath');
    var prev=sp?sp.textContent:'Copy path';
    if(sp)sp.textContent=I18N.copied;
    flashBtn(btn,2000);
    setTimeout(function(){if(sp)sp.textContent=prev;},2000);
  });
});

document.getElementById('searchInput').addEventListener('input',function(){
  renderTree(this.value.trim()||null);
});

function expandRecursive(container){
  var folders=container.querySelectorAll('.ti:not([data-path])');
  var changed=false;
  folders.forEach(function(f){
    var cwn=f.nextElementSibling;
    if(cwn&&cwn.classList.contains('closed')){
      f.click();
      changed=true;
    }
  });
  if(changed)setTimeout(function(){expandRecursive(container);},60);
}
document.getElementById('expandAll').addEventListener('click',function(){
  expandRecursive(document.getElementById('tree'));
});
document.getElementById('collapseAll').addEventListener('click',function(){
  document.querySelectorAll('.ti-children').forEach(function(c){c.classList.add('closed');});
  document.querySelectorAll('.ti:not([data-path]) .ti-chev').forEach(function(s){
    s.classList.remove('open');
    s.innerHTML=svgChev(false);
  });
  document.querySelectorAll('.ti:not([data-path]) .ti-icon').forEach(function(s){
    s.innerHTML=svgFolder(false);
  });
  openDirs={};
});

(function(){
  var handle=document.getElementById('resizeHandle');
  var sb=document.getElementById('sidebar');
  var dragging=false,startX=0,startW=0;
  handle.addEventListener('mousedown',function(e){
    dragging=true;startX=e.clientX;startW=sb.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cssText+='cursor:col-resize;user-select:none;-webkit-user-select:none';
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    var w=Math.max(140,Math.min(520,startW+(e.clientX-startX)));
    sb.style.width=w+'px';
  });
  document.addEventListener('mouseup',function(){
    if(!dragging)return;
    dragging=false;
    handle.classList.remove('dragging');
    document.body.style.cursor='';
    document.body.style.userSelect='';
  });
})();

renderTree(null);
})();
</script>
