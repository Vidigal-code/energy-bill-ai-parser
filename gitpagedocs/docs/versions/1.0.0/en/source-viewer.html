ntext: 'FileCryptoService',\n      message: PtBrMessages.logs.crypto.encryptingFile,\n    });\n    const secret = this.getSecretKey();\n    const jwe = await new CompactEncrypt(content)\n      .setProtectedHeader({ alg: 'dir', enc: 'A256GCM' })\n      .encrypt(secret);\n\n    return Buffer.from(jwe, 'utf-8');\n  }\n\n  /**\n   *\n   * EN: Decrypts stored JWE payload to recover original binary content.\n   *\n   * PT: Descriptografa payload JWE armazenado para recuperar o conteudo original.\n   *\n   * @params content Encrypted file buffer.\n   * @returns Decrypted file content.\n   */\n  async decrypt(content: Buffer): Promise\u003CBuffer\u003E {\n    ApiLogger.info({\n      context: 'FileCryptoService',\n      message: PtBrMessages.logs.crypto.decryptingFile,\n    });\n    const secret = this.getSecretKey();\n    const { plaintext } = await compactDecrypt(\n      content.toString('utf-8'),\n      secret,\n    );\n    return Buffer.from(plaintext);\n  }\n\n  checksum(content: Buffer): string {\n    return createHash('sha256').update(content).digest('hex');\n  }\n\n  private getSecretKey(): Uint8Array {\n    const secret = this.configService.get\u003Cstring\u003E('JWE_SECRET') ?? '';\n    return new TextEncoder().encode(secret.padEnd(32, '0').slice(0, 32));\n  }\n}\n","backend/src/modules/storage/domain/document-storage.port.ts":"export type UploadDocumentInput = {\n  objectKey: string;\n  content: Buffer;\n  mimeType: string;\n};\n\nexport type StoredDocumentFile = {\n  content: Buffer;\n  mimeType: string;\n};\n\nexport interface DocumentStoragePort {\n  upload(input: UploadDocumentInput): Promise\u003Cvoid\u003E;\n  download(objectKey: string): Promise\u003CStoredDocumentFile\u003E;\n  remove(objectKey: string): Promise\u003Cvoid\u003E;\n}\n\nexport const DOCUMENT_STORAGE_TOKEN = Symbol('DOCUMENT_STORAGE_TOKEN');\n","backend/src/modules/storage/infrastructure/s3-document-storage.adapter.ts":"import { Injectable, OnModuleInit } from '@nestjs/common';\nimport { ConfigService } from '@nestjs/config';\nimport {\n  CreateBucketCommand,\n  DeleteObjectCommand,\n  GetObjectCommand,\n  HeadBucketCommand,\n  PutObjectCommand,\n  S3Client,\n} from '@aws-sdk/client-s3';\nimport { ApiLogger } from '../../../shared/logging/api-logger';\nimport {\n  DocumentStoragePort,\n  StoredDocumentFile,\n  UploadDocumentInput,\n} from '../domain/document-storage.port';\n\n@Injectable()\nexport class S3DocumentStorageAdapter\n  implements DocumentStoragePort, OnModuleInit\n{\n  private readonly client: S3Client;\n  private readonly bucket: string;\n  private bucketReady = false;\n  private bucketEnsuringPromise: Promise\u003Cvoid\u003E | null = null;\n\n  constructor(private readonly configService: ConfigService) {\n    this.bucket = this.configService.get\u003Cstring\u003E('S3_BUCKET') ?? 'energy-bills';\n    this.client = new S3Client({\n      region: this.configService.get\u003Cstring\u003E('S3_REGION') ?? 'us-east-1',\n      endpoint: this.configService.get\u003Cstring\u003E('S3_ENDPOINT'),\n      forcePathStyle:\n        this.configService.get\u003Cstring\u003E('S3_FORCE_PATH_STYLE') === 'true',\n      credentials: {\n        accessKeyId:\n          this.configService.get\u003Cstring\u003E('S3_ACCESS_KEY_ID') ?? 'test',\n        secretAccessKey:\n          this.configService.get\u003Cstring\u003E('S3_SECRET_ACCESS_KEY') ?? 'test',\n      },\n    });\n  }\n\n  async onModuleInit(): Promise\u003Cvoid\u003E {\n    await this.ensureBucketExists();\n  }\n\n  async upload(input: UploadDocumentInput): Promise\u003Cvoid\u003E {\n    try {\n      await this.ensureBucketExists();\n      await this.client.send(\n        new PutObjectCommand({\n          Bucket: this.bucket,\n          Key: input.objectKey,\n          Body: input.content,\n          ContentType: input.mimeType,\n        }),\n      );\n    } catch (e) {\n      ApiLogger.logError({\n        path: 'S3-upload',\n        statusCode: 500,\n        message: 'Falha fatal ao enviar arquivo para o bucket S3.',\n        error: e,\n      });\n      throw e;\n    }\n  }\n\n  async download(objectKey: string): Promise\u003CStoredDocumentFile\u003E {\n    const response = await this.client.send(\n      new GetObjectCommand({\n        Bucket: this.bucket,\n        Key: objectKey,\n      }),\n    );\n\n    const bytes = await response.Body?.transformToByteArray();\n    return {\n      content: Buffer.from(bytes ?? []),\n      mimeType: response.ContentType ?? 'application/octet-stream',\n    };\n  }\n\n  async remove(objectKey: string): Promise\u003Cvoid\u003E {\n    await this.client.send(\n      new DeleteObjectCommand({\n        Bucket: this.bucket,\n        Key: objectKey,\n      }),\n    );\n  }\n\n  private async ensureBucketExists(): Promise\u003Cvoid\u003E {\n    if (this.bucketReady) {\n      return;\n    }\n    if (this.bucketEnsuringPromise) {\n      await this.bucketEnsuringPromise;\n      return;\n    }\n\n    this.bucketEnsuringPromise = this.ensureBucketExistsInternal();\n    try {\n      await this.bucketEnsuringPromise;\n      this.bucketReady = true;\n    } finally {\n      this.bucketEnsuringPromise = null;\n    }\n  }\n\n  private async ensureBucketExistsInternal(): Promise\u003Cvoid\u003E {\n    if (await this.bucketExists()) {\n      return;\n    }\n\n    try {\n      await this.client.send(\n        new CreateBucketCommand({\n          Bucket: this.bucket,\n        }),\n      );\n\n      ApiLogger.info({\n        context: 'S3Storage',\n        message: `Bucket ${this.bucket} criado automaticamente.`,\n      });\n    } catch (error) {\n      if (this.isAlreadyExistsError(error)) {\n        return;\n      }\n\n      ApiLogger.logError({\n        path: 'S3-create-bucket',\n        statusCode: 500,\n        message: `Falha ao criar bucket ${this.bucket}.`,\n        error,\n      });\n      throw error;\n    }\n  }\n\n  private async bucketExists(): Promise\u003Cboolean\u003E {\n    try {\n      await this.client.send(\n        new HeadBucketCommand({\n          Bucket: this.bucket,\n        }),\n      );\n      return true;\n    } catch (error) {\n      if (this.isNotFoundError(error)) {\n        return false;\n      }\n      throw error;\n    }\n  }\n\n  private isNotFoundError(error: unknown): boolean {\n    if (!error || typeof error !== 'object') {\n      return false;\n    }\n\n    const maybe = error as {\n      name?: string;\n      Code?: string;\n      $metadata?: { httpStatusCode?: number };\n    };\n    return (\n      maybe.name === 'NotFound' ||\n      maybe.Code === 'NoSuchBucket' ||\n      maybe.$metadata?.httpStatusCode === 404\n    );\n  }\n\n  private isAlreadyExistsError(error: unknown): boolean {\n    if (!error || typeof error !== 'object') {\n      return false;\n    }\n\n    const maybe = error as { name?: string; Code?: string };\n    return (\n      maybe.name === 'BucketAlreadyOwnedByYou' ||\n      maybe.Code === 'BucketAlreadyOwnedByYou' ||\n      maybe.name === 'BucketAlreadyExists' ||\n      maybe.Code === 'BucketAlreadyExists'\n    );\n  }\n}\n","backend/src/shared/config/duration.util.ts":"const DURATION_REGEX = /^(\\d+)([smhd])$/i;\n\nconst UNIT_TO_SECONDS: Record\u003Cstring, number\u003E = {\n  s: 1,\n  m: 60,\n  h: 3600,\n  d: 86400,\n};\n\nexport function durationToSeconds(value: string): number {\n  const match = value.trim().match(DURATION_REGEX);\n  if (!match) {\n    return 900;\n  }\n\n  const amount = Number.parseInt(match[1], 10);\n  const unit = match[2].toLowerCase();\n  const multiplier = UNIT_TO_SECONDS[unit];\n  if (!amount || !multiplier) {\n    return 900;\n  }\n\n  return amount * multiplier;\n}\n","backend/src/shared/config/env.schema.ts":"import { z } from 'zod';\n\nconst BOOLEAN_FLAG_VALUES = ['true', 'false'] as const;\nconst LLM_PROVIDER_VALUES = [\n  'ollama',\n  'openai',\n  'gemini',\n  'google',\n  'claude',\n] as const;\n\nconst booleanFlagSchema = z\n  .string()\n  .trim()\n  .transform((value) =\u003E value.toLowerCase())\n  .pipe(z.enum(BOOLEAN_FLAG_VALUES));\n\nexport const envSchema = z.object({\n  NODE_ENV: z\n    .enum(['development', 'test', 'production'])\n    .optional()\n    .default('development'),\n  PORT: z.coerce.number().int().positive().optional().default(3000),\n  HELMET_ENABLED: booleanFlagSchema.optional().default('true'),\n  RATE_LIMIT_TTL_MS: z.coerce\n    .number()\n    .int()\n    .positive()\n    .optional()\n    .default(60000),\n  RATE_LIMIT_LIMIT: z.coerce.number().int().positive().optional().default(100),\n  SWAGGER_ENABLED: booleanFlagSchema.optional().default('true'),\n  SWAGGER_PATH: z.string().min(1).optional().default('api/docs'),\n  DATABASE_URL: z.string().min(1, 'DATABASE_URL is required'),\n  JWT_ACCESS_SECRET: z.string().min(1, 'JWT_ACCESS_SECRET is required'),\n  JWT_REFRESH_SECRET: z.string().min(1, 'JWT_REFRESH_SECRET is required'),\n  JWT_ACCESS_EXPIRES_IN: z.string().min(1).optional().default('15m'),\n  JWT_REFRESH_EXPIRES_IN: z.string().min(1).optional().default('7d'),\n  JWT_ISSUER: z.string().min(1).optional().default('energy-bill-ai-parser'),\n  JWE_SECRET: z.string().min(32, 'JWE_SECRET must be at least 32 characters'),\n  DEFAULT_ADMIN_EMAIL: z\n    .string()\n    .email()\n    .optional()\n    .default('admin@local.test'),\n  DEFAULT_ADMIN_USERNAME: z.string().min(3).optional().default('admin'),\n  DEFAULT_ADMIN_PASSWORD: z.string().min(8).optional().default('Admin@123456'),\n  STORAGE_DRIVER: z\n    .enum(['aws', 'localstack'])\n    .optional()\n    .default('localstack'),\n  S3_REGION: z.string().min(1).optional().default('us-east-1'),\n  S3_BUCKET: z.string().min(1).optional().default('energy-bills'),\n  S3_ENDPOINT: z.string().url().optional().default('http://localhost:4566'),\n  S3_ACCESS_KEY_ID: z.string().min(1).optional().default('test'),\n  S3_SECRET_ACCESS_KEY: z.string().min(1).optional().default('test'),\n  S3_FORCE_PATH_STYLE: booleanFlagSchema.optional().default('true'),\n  OPEN_SOURCE_IA: booleanFlagSchema.optional().default('false'),\n  LLM_PROVIDER: z.enum(LLM_PROVIDER_VALUES).optional().default('gemini'),\n  OLLAMA_BASE_URL: z\n    .string()\n    .url()\n    .optional()\n    .default('http://localhost:11434'),\n  OLLAMA_MODEL: z.string().min(1).optional().default('llama3.2-vision'),\n  OPENAI_BASE_URL: z\n    .string()\n    .url()\n    .optional()\n    .default('https://api.openai.com/v1'),\n  OPENAI_MODEL: z.string().min(1).optional().default('gpt-4.1-mini'),\n  GEMINI_BASE_URL: z\n    .string()\n    .url()\n    .optional()\n    .default('https://generativelanguage.googleapis.com/v1beta'),\n  GEMINI_MODEL: z.string().min(1).optional().default('gemini-2.5-flash'),\n  ANTHROPIC_BASE_URL: z\n    .string()\n    .url()\n    .optional()\n    .default('https://api.anthropic.com/v1'),\n  ANTHROPIC_MODEL: z\n    .string()\n    .min(1)\n    .optional()\n    .default('claude-3-5-sonnet-latest'),\n  PDF_MAX_FILE_SIZE_MB: z.coerce.number().positive().optional().default(50),\n  ROLLBACK_ON_INVOICE_FAILURE: booleanFlagSchema.optional().default('true'),\n  LOGS: booleanFlagSchema.optional().default('true'),\n  INVOICE_EXTRACTION_REFERENCE: z.string().optional(),\n  INVOICE_EXTRACTION_PROMPT: z.string().optional(),\n  INVOICE_EXTRACTION_CONTEXT: z.string().optional(),\n  OPENAI_API_KEY: z.string().optional(),\n  GEMINI_API_KEY: z.string().optional(),\n  ANTHROPIC_API_KEY: z.string().optional(),\n});\n\nexport type EnvSchema = z.infer\u003Ctypeof envSchema\u003E;\n","backend/src/shared/config/pdf-upload.config.ts":"const DEFAULT_PDF_MAX_FILE_SIZE_MB = 50;\nconst BYTES_IN_MB = 1024 * 1024;\n\nexport function resolvePdfMaxFileSizeMb(rawValue?: string | number): number {\n  const numericValue =\n    typeof rawValue === 'number'\n      ? rawValue\n      : Number.parseFloat(String(rawValue ?? ''));\n\n  if (!Number.isFinite(numericValue) || numericValue \u003C= 0) {\n    return DEFAULT_PDF_MAX_FILE_SIZE_MB;\n  }\n\n  return numericValue;\n}\n\nexport function resolvePdfMaxFileSizeBytes(rawValue?: string | number): number {\n  const mb = resolvePdfMaxFileSizeMb(rawValue);\n  return Math.floor(mb * BYTES_IN_MB);\n}\n","backend/src/shared/http/filters/http-exception.filter.ts":"import {\n  ArgumentsHost,\n  Catch,\n  ExceptionFilter,\n  HttpException,\n  HttpStatus,\n} from '@nestjs/common';\nimport { Request, Response } from 'express';\nimport { ApiResponsePresenter } from '../presenters/api-response.presenter';\nimport { ApiLogger } from '../../logging/api-logger';\nimport { PtBrMessages } from '../../messages/pt-br.messages';\n\n@Catch()\nexport class HttpExceptionFilter implements ExceptionFilter {\n  catch(exception: unknown, host: ArgumentsHost): void {\n    const context = host.switchToHttp();\n    const response = context.getResponse\u003CResponse\u003E();\n    const request = context.getRequest\u003CRequest\u003E();\n\n    const status =\n      exception instanceof HttpException\n        ? exception.getStatus()\n        : HttpStatus.INTERNAL_SERVER_ERROR;\n\n    let message: string | string[] = PtBrMessages.common.internalServerError;\n    let details: unknown;\n\n    const multerCode =\n      exception \u0026\u0026\n      typeof exception === 'object' \u0026\u0026\n      'code' in exception \u0026\u0026\n      typeof (exception as { code?: unknown }).code === 'string'\n        ? (exception as { code: string }).code\n        : undefined;\n\n    if (multerCode === 'LIMIT_FILE_SIZE') {\n      message = PtBrMessages.invoices.pdfExceededMaximumAllowed;\n      details = {\n        code: multerCode,\n      };\n      ApiLogger.logError({\n        path: request.url,\n        method: request.method,\n        statusCode: HttpStatus.PAYLOAD_TOO_LARGE,\n        message,\n      });\n      response.status(HttpStatus.PAYLOAD_TOO_LARGE).json(\n        ApiResponsePresenter.error({\n          path: request.url,\n          statusCode: HttpStatus.PAYLOAD_TOO_LARGE,\n          message,\n          details,\n        }),\n      );\n      return;\n    }\n\n    if (exception instanceof HttpException) {\n      const responsePayload = exception.getResponse();\n      if (typeof responsePayload === 'string') {\n        message = responsePayload;\n      } else if (\n        responsePayload \u0026\u0026\n        typeof responsePayload === 'object' \u0026\u0026\n        'message' in responsePayload\n      ) {\n        const payloadWithMessage = responsePayload as { message?: unknown };\n        if (\n          typeof payloadWithMessage.message === 'string' ||\n          Array.isArray(payloadWithMessage.message)\n        ) {\n          message = payloadWithMessage.message;\n        }\n        details = responsePayload;\n      }\n    }\n\n    ApiLogger.logError({\n      path: request.url,\n      method: request.method,\n      statusCode: status,\n      message,\n      error: status === 500 ? exception : undefined,\n    });\n\n    response.status(status).json(\n      ApiResponsePresenter.error({\n        path: request.url,\n        statusCode: status,\n        message,\n        details,\n      }),\n    );\n  }\n}\n","backend/src/shared/http/interceptors/success-response.interceptor.ts":"import {\n  CallHandler,\n  ExecutionContext,\n  Injectable,\n  NestInterceptor,\n} from '@nestjs/common';\nimport { Request } from 'express';\nimport { map, Observable } from 'rxjs';\nimport { ApiResponsePresenter } from '../presenters/api-response.presenter';\nimport { ApiLogger } from '../../logging/api-logger';\n\n@Injectable()\nexport class SuccessResponseInterceptor\u003CT\u003E implements NestInterceptor\u003C\n  T,\n  unknown\n\u003E {\n  intercept(\n    context: ExecutionContext,\n    next: CallHandler\u003CT\u003E,\n  ): Observable\u003Cunknown\u003E {\n    if (context.getType\u003C'http'\u003E() !== 'http') {\n      return next.handle();\n    }\n\n    const request = context.switchToHttp().getRequest\u003CRequest\u003E();\n    const timestamp = new Date().toISOString();\n\n    return next.handle().pipe(\n      map((data) =\u003E {\n        ApiLogger.logSuccess({\n          path: request.url,\n          method: request.method,\n        });\n\n        return ApiResponsePresenter.success({\n          path: request.url,\n          timestamp,\n          data,\n        });\n      }),\n    );\n  }\n}\n","backend/src/shared/http/presenters/api-response.presenter.ts":"export type ApiSuccessResponse\u003CT\u003E = {\n  success: true;\n  path: string;\n  timestamp: string;\n  data: T;\n};\n\nexport type ApiErrorResponse = {\n  success: false;\n  path: string;\n  timestamp: string;\n  error: {\n    statusCode: number;\n    message: string | string[];\n    details?: unknown;\n  };\n};\n\nexport class ApiResponsePresenter {\n  static success\u003CT\u003E(params: {\n    path: string;\n    data: T;\n    timestamp?: string;\n  }): ApiSuccessResponse\u003CT\u003E {\n    return {\n      success: true,\n      path: params.path,\n      timestamp: params.timestamp ?? new Date().toISOString(),\n      data: params.data,\n    };\n  }\n\n  static error(params: {\n    path: string;\n    statusCode: number;\n    message: string | string[];\n    details?: unknown;\n    timestamp?: string;\n  }): ApiErrorResponse {\n    return {\n      success: false,\n      path: params.path,\n      timestamp: params.timestamp ?? new Date().toISOString(),\n      error: {\n        statusCode: params.statusCode,\n        message: params.message,\n        details: params.details,\n      },\n    };\n  }\n}\n","backend/src/shared/http/security/setup-helmet.ts":"import type { INestApplication } from '@nestjs/common';\nimport helmet from 'helmet';\n\ntype SetupHelmetInput = {\n  app: INestApplication;\n  enabled: boolean;\n};\n\nexport function setupHelmet(input: SetupHelmetInput): void {\n  if (!input.enabled) {\n    return;\n  }\n\n  input.app.use(\n    helmet({\n      // Swagger UI utiliza inline scripts/styles; CSP estrita quebra a doc interativa.\n      contentSecurityPolicy: false,\n      crossOriginEmbedderPolicy: false,\n      crossOriginResourcePolicy: { policy: 'same-site' },\n      frameguard: { action: 'deny' },\n      referrerPolicy: { policy: 'no-referrer' },\n      hidePoweredBy: true,\n      hsts: {\n        maxAge: 15552000,\n        includeSubDomains: true,\n        preload: false,\n      },\n    }),\n  );\n}\n","backend/src/shared/http/swagger/setup-swagger.ts":"import { INestApplication } from '@nestjs/common';\nimport { DocumentBuilder, SwaggerModule } from '@nestjs/swagger';\n\ntype SetupSwaggerInput = {\n  app: INestApplication;\n  enabled: boolean;\n  path: string;\n};\n\nexport function setupSwagger(input: SetupSwaggerInput): void {\n  if (!input.enabled) {\n    return;\n  }\n\n  const configPt = new DocumentBuilder()\n    .setTitle('Plataforma de Faturas de Energia (API)')\n    .setDescription(\n      'Documenta\u00e7\u00e3o da API backend para autentica\u00e7\u00e3o, processamento de faturas e administra\u00e7\u00e3o.',\n    )\n    .setVersion('1.0.0')\n    .addBearerAuth()\n    .build();\n\n  const documentPt = SwaggerModule.createDocument(input.app, configPt);\n  SwaggerModule.setup('api/docs/pt', input.app, documentPt);\n\n  const configEn = new DocumentBuilder()\n    .setTitle('Energy Bill AI Parser API')\n    .setDescription(\n      'Backend API documentation for authentication, invoice processing, and administration.',\n    )\n    .setVersion('1.0.0')\n    .addBearerAuth()\n    .build();\n\n  const documentEn = SwaggerModule.createDocument(input.app, configEn);\n  localizeSwaggerDocumentToEnglish(\n    documentEn as unknown as Record\u003Cstring, unknown\u003E,\n  );\n  SwaggerModule.setup('api/docs/en', input.app, documentEn);\n}\n\nfunction localizeSwaggerDocumentToEnglish(document: Record\u003Cstring, unknown\u003E) {\n  const paths = document.paths;\n  if (!paths || typeof paths !== 'object') {\n    return;\n  }\n\n  for (const pathItem of Object.values(paths as Record\u003Cstring, unknown\u003E)) {\n    if (!pathItem || typeof pathItem !== 'object') {\n      continue;\n    }\n\n    for (const operation of Object.values(\n      pathItem as Record\u003Cstring, unknown\u003E,\n    )) {\n      if (!operation || typeof operation !== 'object') {\n        continue;\n      }\n\n      const op = operation as { summary?: unknown; description?: unknown };\n\n      if (typeof op.summary === 'string') {\n        op.summary = translateSummaryToEnglish(op.summary);\n      }\n\n      if (typeof op.description === 'string') {\n        op.description = translateDescriptionToEnglish(op.description);\n      }\n    }\n  }\n}\n\nfunction translateSummaryToEnglish(summary: string) {\n  const map: Record\u003Cstring, string\u003E = {\n    'Verificar sa\u00fade da API': 'Check API health',\n    'Registrar usu\u00e1rio': 'Register user',\n    'Autenticar usu\u00e1rio': 'Authenticate user',\n    'Gerar novo access token via refresh token':\n      'Generate new access token via refresh token',\n    'Encerrar sess\u00e3o do usu\u00e1rio': 'End user session',\n    'Obter perfil do usu\u00e1rio autenticado': 'Get authenticated user profile',\n    'Atualizar perfil do usu\u00e1rio autenticado':\n      'Update authenticated user profile',\n    'Enviar PDF e processar extra\u00e7\u00e3o da fatura':\n      'Upload PDF and process invoice extraction',\n    'Listar faturas com filtros': 'List invoices with filters',\n    'Consultar dashboard consolidado (energia + financeiro)':\n      'Get consolidated dashboard (energy + financial)',\n    'Consultar dashboard de energia (kWh)': 'Get energy dashboard (kWh)',\n    'Consultar dashboard financeiro (R$)': 'Get financial dashboard (BRL)',\n    'Listar documentos do usu\u00e1rio autenticado':\n      'List authenticated user documents',\n    'Listar usu\u00e1rios (admin)': 'List users (admin)',\n    'Criar usu\u00e1rio (admin)': 'Create user (admin)',\n    'Atualizar usu\u00e1rio (admin)': 'Update user (admin)',\n    'Remover usu\u00e1rio (admin)': 'Delete user (admin)',\n    'Listar documentos com filtros (admin)':\n      'List documents with filters (admin)',\n    'Listar : 'Documents returned successfully',\n  };\n\n  return map[description] ?? description;\n}\n","backend/src/shared/logging/api-logger.ts":"import { Logger } from '@nestjs/common';\n\ntype BaseHttpLogInput = {\n  path: string;\n  method?: string;\n};\n\ntype SuccessLogInput = BaseHttpLogInput;\n\ntype ErrorLogInput = BaseHttpLogInput \u0026 {\n  statusCode: number;\n  message: string | string[];\n  error?: unknown;\n};\n\ntype InfoLogInput = {\n  context?: string;\n  message: string;\n};\n\ntype WarningLogInput = {\n  context?: string;\n  message: string;\n};\n\ntype LogLogInput = {\n  context?: string;\n  message: string;\n};\n\nexport class ApiLogger {\n  private static readonly logger = new Logger('ApiLogger');\n  private static readonly colors = {\n    reset: '\\x1b[0m',\n    blue: '\\x1b[34m',\n    yellow: '\\x1b[33m',\n    green: '\\x1b[32m',\n    red: '\\x1b[31m',\n    cyan: '\\x1b[36m',\n  } as const;\n\n  private static logsEnabled(): boolean {\n    return process.env.LOGS?.toLowerCase() !== 'false';\n  }\n\n  private static colorize(level: string, color: string): string {\n    return `${color}${level}${this.colors.reset}`;\n  }\n\n  private static buildContext(context?: string): string {\n    return context ? ` [${context}]` : '';\n  }\n\n  static log(input: LogLogInput): void {\n    if (!this.logsEnabled()) {\n      return;\n    }\n\n    this.logger.log(\n      `${this.colorize('[LOG]', this.colors.blue)}${this.buildContext(input.context)} ${input.message}`,\n    );\n  }\n\n  static info(input: InfoLogInput): void {\n    if (!this.logsEnabled()) {\n      return;\n    }\n\n    this.logger.log(\n      `${this.colorize('[INFO]', this.colors.cyan)}${this.buildContext(input.context)} ${input.message}`,\n    );\n  }\n\n  static warning(input: WarningLogInput): void {\n    if (!this.logsEnabled()) {\n      return;\n    }\n\n    this.logger.warn(\n      `${this.colorize('[WARNING]', this.colors.yellow)}${this.buildContext(input.context)} ${input.message}`,\n    );\n  }\n\n  static logSuccess(input: SuccessLogInput): void {\n    if (!this.logsEnabled()) {\n      return;\n    }\n\n    const method = input.method ?? 'UNKNOWN';\n    this.logger.log(\n      `${this.colorize('[SUCCESS]', this.colors.green)} ${method} ${input.path}`,\n    );\n  }\n\n  static logError(input: ErrorLogInput): void {\n    if (!this.logsEnabled()) {\n      return;\n    }\n\n    const method = input.method ?? 'UNKNOWN';\n    const message = Array.isArray(input.message)\n      ? input.message.join(', ')\n      : input.message;\n\n    this.logger.error(\n      `${this.colorize('[ERROR]', this.colors.red)} ${method} ${input.path} ${input.statusCode} - ${message}`,\n    );\n\n    if (input.error) {\n      this.logger.error(input.error);\n    }\n  }\n}\n","backend/src/shared/messages/pt-br.messages.ts":"export class PtBrMessages {\n  static readonly common = {\n    unknownError: 'Erro desconhecido.',\n    internalServerError: 'Erro interno do servidor.',\n  };\n\n  static readonly auth = {\n    emailAlreadyExists: 'Este e-mail ja existe.',\n    usernameAlreadyExists: 'Este nome de usuario ja existe.',\n    invalidCredentials: 'Credenciais invalidas.',\n    invalidRefreshToken: 'Refresh token invalido.',\n    tokenDoesNotBelongToAuthenticatedUser:\n      'Token nao pertence ao usuario autenticado.',\n    userNotFound: 'Usuario nao encontrado.',\n    noDataForUpdate: 'Nenhum dado valido foi enviado para atualizacao.',\n    logoutSuccess: 'Logout realizado com sucesso.',\n    userRegistered: 'Usuario registrado com sucesso.',\n    loginSuccess: 'Login realizado com sucesso.',\n    profileUpdated: 'Perfil atualizado com sucesso.',\n    unauthenticated: 'Nao autenticado.',\n    noPermission: 'Sem permissao para acessar este recurso.',\n    accessDenied403: {\n      statusCode: 403,\n      error: 'Forbidden',\n      message: 'Sem permissao para acessar este recurso.',\n    },\n    passwordMustContainUppercase:\n      'A senha deve conter ao menos uma letra maiuscula pplication;\n\n  const authServiceMock = {\n    register: jest.fn().mockResolvedValue({ accessToken: 'token-register' }),\n    login: jest.fn().mockResolvedValue({ accessToken: 'token-login' }),\n    refresh: jest.fn().mockResolvedValue({ accessToken: 'token-refresh' }),\n    logout: jest.fn().mockResolvedValue({ message: 'ok' }),\n    me: jest.fn().mockResolvedValue({\n      id: 'user_1',\n      email: 'user@test.local',\n      username: 'user',\n      role: 'USER',\n    }),\n    updateProfile: jest.fn().mockResolvedValue({\n      id: 'user_1',\n      email: 'user@test.local',\n      username: 'updated',\n      role: 'USER',\n    }),\n  };\n\n  beforeAll(async () =\u003E {\n    const moduleRef: TestingModule = await Test.createTestingModule({\n      controllers: [AuthController],\n      providers: [{ provide: AuthService, useValue: authServiceMock }],\n    })\n      .overrideGuard(JwtAuthGuard)\n      .useValue({\n        canActivate: (ctx: ExecutionContext) =\u003E {\n          const httpRequest = ctx.switchToHttp().getRequest\u003C{\n            user?: {\n              sub: string;\n              email: string;\n              username: string;\n              role: 'USER' | 'ADMIN';\n            };\n          }\u003E();\n          httpRequest.user = {\n            sub: 'user_1',\n            email: 'user@test.local',\n            username: 'user',\n            role: 'USER',\n          };\n          return true;\n        },\n      })\n      .overrideGuard(RolesGuard)\n      .useValue({ canActivate: () =\u003E true })\n      .compile();\n\n    app = moduleRef.createNestApplication();\n    await app.init();\n  });\n\n  afterAll(async () =\u003E {\n    await app.close();\n  });\n\n  it('deve executar register', async () =\u003E {\n    const server = app.getHttpServer() as Parameters\u003Ctypeof request\u003E[0];\n    const response = await request(server).post('/auth/register').send({\n      email: 'new@test.local',\n      username: 'newuser',\n      password: 'Admin@123456',\n    });\n    const body = response.body as { accessToken: string };\n    expect(response.status).toBe(201);\n    expect(body.accessToken).toBe('token-register');\n  });\n\n  it('deve executar me com usu\u00e1rio autenticado', async () =\u003E {\n    const server = app.getHttpServer() as Parameters\u003Ctypeof request\u003E[0];\n    const response = await request(server).get('/auth/me');\n    const body = response.body as { id: string };\n    expect(response.status).toBe(200);\n    expect(body.id).toBe('user_1');\n  });\n});\n","backend/tests/integration/invoices.extract.spec.ts":"import { INestApplication } from '@nestjs/common';\nimport { ConfigService } from '@nestjs/config';\nimport { Test, TestingModule } from '@nestjs/testing';\nimport request from 'supertest';\nimport { AuditService } from '../../src/modules/audit/application/audit.service';\nimport type { ExecutionContext } from '@nestjs/common';\nimport type { AuthUser } from '../../src/modules/auth/domain/auth-user.type';\nimport { JwtAuthGuard } from '../../src/modules/auth/presentation/guards/jwt-auth.guard';\nimport { RolesGuard } from '../../src/modules/auth/presentation/guards/roles.guard';\nimport { InvoicesQueryService } from '../../src/modules/invoices/application/invoices-query.service';\nimport { ProcessInvoiceExtractionUseCase } from '../../src/modules/invoices/application/process-invoice-extraction.use-case';\nimport { InvoicesController } from '../../src/modules/invoices/presentation/invoices.controller';\nimport { LLM_EXTRACTOR_TOKEN } from '../../src/modules/llm/llm-extractor.interface';\nimport { FileCryptoService } from '../../src/modules/storage/application/file-crypto.service';\nimport { DOCUMENT_STORAGE_TOKEN } from '../../src/modules/storage/domain/document-storage.port';\nimport { PrismaService } from '../../src/shared/prisma/prisma.service';\n\ndescribe('Invoices extract (integration)', () =\u003E {\n  let app: INestApplication;\n\n  const extraction = {\n    'N\u00ba DO CLI xtractInvoiceData.mockResolvedValue(extraction);\n    prismaMock.invoice.findMany.mockResolvedValue([]);\n    prismaMock.invoiceMetrics.aggregate.mockResolvedValue({\n      _sum: {\n        consumoEnergiaEletricaKwh: 506,\n        energiaCompensadaKwh: 456,\n        valorTotalSemGdRs: 329.6,\n        economiaGdRs: -222.22,\n      },\n    });\n  });\n\n  beforeAll(async () =\u003E {\n    const moduleRef: TestingModule = await Test.createTestingModule({\n      controllers: [InvoicesController],\n      providers: [\n        ProcessInvoiceExtractionUseCase,\n        InvoicesQueryService,\n        { provide: PrismaService, useValue: prismaMock },\n        { provide: LLM_EXTRACTOR_TOKEN, useValue: llmMock },\n        { provide: DOCUMENT_STORAGE_TOKEN, useValue: storageMock },\n        { provide: FileCryptoService, useValue: cryptoMock },\n        { provide: AuditService, useValue: auditMock },\n        {\n          provide: ConfigService,\n          useValue: {\n            get: (key: string) =\u003E {\n              const map: Record\u003Cstring, unknown\u003E = {\n                PDF_MAX_FILE_SIZE_MB: 1,\n                S3_BUCKET: 'energy-bills',\n                OPEN_SOURCE_IA: 'false',\n                LLM_PROVIDER: 'gemini',\n              };\n              return map[key];\n            },\n          },\n        },\n      ],\n    })\n      .overrideGuard(JwtAuthGuard)\n      .useValue({\n        canActivate: (ctx: ExecutionContext) =\u003E {\n          const httpRequest = ctx.switchToHttp().getRequest\u003C{\n            user?: AuthUser;\n          }\u003E();\n          httpRequest.user = mockUser;\n          return true;\n        },\n      })\n      .overrideGuard(RolesGuard)\n      .useValue({ canActivate: () =\u003E true })\n      .compile();\n\n    app = moduleRef.createNestApplication();\n    await app.init();\n  });\n\n  afterAll(async () =\u003E {\n    await app.close();\n  });\n\n  it('deve processar extra\u00e7\u00e3o com upload de PDF', async () =\u003E {\n    const server = app.getHttpServer() as Parameters\u003Ctypeof request\u003E[0];\n    const response = await request(server)\n      .post('/invoices/extract')\n      .attach('file', Buffer.from('%PDF-1.4 test'), {\n        filename: 'fatura.pdf',\n        contentType: 'application/pdf',\n      });\n    const body = response.body as { invoiceId: string; documentId: string };\n\n    expect(response.status).toBe(201);\n    expect(body.invoiceId).toBe('inv_1');\n    expect(body.documentId).toBe('doc_1');\n    expect(llmMock.extractInvoiceData).toHaveBeenCalledTimes(1);\n    expect(storageMock.upload).toHaveBeenCalledTimes(1);\n  });\n\n  it('deve retornar 400 quando arquivo n\u00e3o for enviado', async () =\u003E {\n    const server = app.getHttpServer() as Parameters\u003Ctypeof request\u003E[0];\n    const response = await request(server).post('/invoices/extract');\n    expect(response.status).toBe(400);\n  });\n\n  it('deve retornar 415 quando arquivo n\u00e3o for PDF', async () =\u003E {\n    const server = app.getHttpServer() as Parameters\u003Ctypeof request\u003E[0];\n    const response = await request(server)\n      .post('/invoices/extract')\n      .attach('file', Buffer.from('plain-text'), {\n        filename: 'nota.txt',\n        contentType: 'text/plain',\n      });\n\n    expect(response.status).toBe(415);\n  });\n\n  it('deve retornar 413 quando PDF exceder limite configurado', async () =\u003E {\n    const server = app.getHttpServer() as Parameters\u003Ctypeof request\u003E[0];\n    const payload = Buffer.alloc(2 * 1024 * 1024, 'a');\n    const response = await request(server)\n      .post('/invoices/extract')\n      .attach('file', payload, {\n        filename: 'fatura-grande.pdf',\n        contentType: 'application/pdf',\n      });\n\n    expect(response.status).toBe(413);\n  });\n\n  it('deve registrar erro e remover arquivo quando LLM falhar', async () =\u003E {\n    llmMock.extractInvoiceData.mockRejectedValueOnce(\n      new Error('LLM indisponivel'),\n    );\n\n    const server = app.getHttpServer() as Parameters\u003Ctypeof request\u003E[0];\n    const response = await request(server)\n      .post('/invoices/extract')\n      .attach('file', Buffer.from('%PDF-1.4 fail-test'), {\n        filename: 'fatura-falha.pdf',\n        contentType: 'application/pdf',\n      });\n\n    expect(response.status).toBe(500);\n    expect(storageMock.upload).toHaveBeenCalledTimes(1);\n    expect(storageMock.remove).toHaveBeenCalledTimes(1);\n    expect(auditMock.write).toHaveBeenCalledTimes(1);\n  });\n\n  it('deve listar faturas filtrando por periodo', async () =\u003E {\n    prismaMock.invoice.findMany.mockResolvedValueOnce([\n      {\n        id: 'inv_jan',\n        fileName: 'jan.pdf',\n        numeroCliente: '7204076116',\n        mesReferencia: 'JAN/2024',\n        createdAt: new Date().toISOString(),\n        metrics: {\n          consumoEnergiaEletricaKwh: 506,\n          energiaCompensadaKwh: 456,\n          valorTotalSemGdRs: 329.6,\n          economiaGdRs: -222.22,\n        },\n      },\n      {\n        id: 'inv_fev',\n        fileName: 'fev.pdf',\n        numeroCliente: '7204076116',\n        mesReferencia: 'FEV/2024',\n        createdAt: new Date().toISOString(),\n        metrics: {\n          consumoEnergiaEletricaKwh: 400,\n          energiaCompensadaKwh: 300,\n          valorTotalSemGdRs: 200,\n          economiaGdRs: -100,\n        },\n      },\n    ]);\n\n    const server = app.getHttpServer() as Parameters\u003Ctypeof request\u003E[0];\n    const response = await request(server).get(\n      '/invoices?numeroCliente=7204076116\u0026periodoInicio=fev/2024\u0026periodoFim=fev/2024',\n    );\n    const body = response.body as Array\u003C{ mesReferencia?: string }\u003E;\n\n    expect(response.status).toBe(200);\n    expect(body).toHaveLength(1);\n    expect(body[0]?.mesReferencia).toBe('FEV/2024');\n  });\n\n  it('deve retornar 400 quando periodoInicio for maior que periodoFim', async () =\u003E {\n    const server = app.getHttpServer() as Parameters\u003Ctypeof request\u003E[0];\n    const response = await request(server).get(\n      '/invoices?periodoInicio=mar/2024\u0026periodoFim=jan/2024',\n    );\n\n    expect(response.status).toBe(400);\n  });\n\n  it('deve encaminhar pagina e pageSize para consulta paginada', async () =\u003E {\n    prismaMock.invoice.findMany.mockResolvedValueOnce([\n      {\n        id: 'inv_1',\n        fileName: 'fatura-1.pdf',\n        numeroCliente: '7204076116',\n        mesReferencia: 'JAN/2024',\n        createdAt: new Date().toISOString(),\n        metrics: undefined,\n      },\n      {\n        id: 'inv_2',\n        fileName: 'fatura-2.pdf',\n        numeroCliente: '7204076116',\n        mesReferencia: 'FEV/2024',\n        createdAt: new Date().toISOString(),\n        metrics: undefined,\n      },\n      {\n        id: 'inv_3',\n        fileName: 'fatura-3.pdf',\n        numeroCliente: '7204076116',\n        mesReferencia: 'MAR/2024',\n        createdAt: new Date().toISOString(),\n        metrics: undefined,\n      },\n    ]);\n\n    const server = app.getHttpServer() as Parameters\u003Ctypeof request\u003E[0];\n    const response = await request(server).get('/invoices?page=2\u0026pageSize=1');\n\n    expect(response.status).toBe(200);\n    expect(prismaMock.invoice.findMany).toHaveBeenCalledWith(\n      expect.objectContaining({\n        skip: 1,\n        take: 1,\n      }),\n    );\n  });\n\n  it('deve retornar dashboard consolidado', async () =\u003E {\n    const server = app.getHttpServer() as Parameters\u003Ctypeof request\u003E[0];\n    const response = await request(server).get(\n      '/invoices/dashboard/consolidated',\n    );\n\n    expect(response.status).toBe(200);\n    expect(response.body).toEqual({\n      consumoEnergiaEletricaKwh: 506,\n      energiaCompensadaKwh: 456,\n      valorTotalSemGdRs: 329.6,\n      economiaGdRs: -222.22,\n    });\n  });\n});\n","backend/tests/integration/prisma.persistence.spec.ts":"import { PrismaClient } from '@prisma/client';\n\nconst shouldRunDbIntegration =\n  process.env.RUN_DB_INTEGRATION !== 'false' \u0026\u0026\n  Boolean(process.env.DATABASE_URL);\n\nconst describeDb = shouldRunDbIntegration ? describe : describe.skip;\n\ndescribeDb('Prisma persistence (integration)', () =\u003E {\n  let prisma: PrismaClient;\n\n  beforeAll(async () =\u003E {\n    prisma = new PrismaClient();\n    await prisma.$connect();\n  });\n\n  afterAll(async () =\u003E {\n    await prisma.invoiceMetrics.deleteMany();\n    await prisma.storedDocument.deleteMany();\n    await prisma.invoice.deleteMany();\n    await prisma.user.deleteMany();\n    await prisma.$disconnect();\n  });\n\n  it('deve inserir e consultar usuario e fatura no banco real', async () =\u003E {\n    const user = await prisma.user.create({\n      data: {\n        email: 'db.integration@local.test',\n        username: 'db_integration_user',\n        passwordHash: 'hash',\n        role: 'USER',\n      },\n    });\n\n    const invoice = await prisma.invoice.create({\n      data: {\n        uploaderUserId: user.id,\n        fileName: 'fatura.pdf',\n        status: 'SUCCESS',\n        numeroCliente: '7204076116',\n        mesReferencia: 'JAN/2024',\n        energiaEletricaQuantidadeKwh: 50,\n        energiaEletricaValorRs: 47.75,\n        energiaSceeSemIcmsQuantidadeKwh: 456,\n        energiaSceeSemIcmsValorRs: 232.42,\n        energiaCompensadaGdiQuantidadeKwh: 456,\n        energiaCompensadaGdiValorRs: -222.22,\n        contribIlumPublicaMunicipalValorRs: 49.43,\n        extractionProvider: 'gemini',\n        rawExtractionJson: { source: 'db-integration-test' },\n      },\n    });\n\n    await prisma.invoiceMetrics.create({\n      data: {\n        invoiceId: invoice.id,\n        consumoEnergiaEletricaKwh: 506,\n        energiaCompensadaKwh: 456,\n        valorTotalSemGdRs: 329.6,\n        economiaGdRs: -222.22,\n      },\n    });\n\n    const found = await prisma.invoice.findMany({\n      where: { id: invoice.id },\n      include: { metrics: true, uploader: true },\n    });\n\n    expect(found).toHaveLength(1);\n    expect(found[0]?.uploader.email).toBe('db.integration@local.test');\n    expect(Number(found[0]?.metrics?.consumoEnergiaEletricaKwh ?? 0)).toBe(506);\n    expect(found[0]?.numeroCliente).toBe('7204076116');\n  });\n});\n","backend/tests/setup/jest.setup.ts":"jest.mock('jose', () =\u003E ({\n  CompactEncrypt: class {\n    setProtectedHeader() {\n      return this;\n    }\n    encrypt() {\n      return Promise.resolve('mock-jwe-token');\n    }\n  },\n  compactDecrypt: jest.fn(() =\u003E\n    Promise.resolve({\n      plaintext: Buffer.from('mock-plaintext'),\n    }),\n  ),\n}));\n","backend/tests/setup/test-env.ts":"process.env.NODE_ENV = process.env.NODE_ENV ?? 'test';\nprocess.env.LOGS = process.env.LOGS ?? 'false';\nprocess.env.JWT_ACCESS_SECRET =\n  process.env.JWT_ACCESS_SECRET ?? 'test-access-secret';\nprocess.env.JWT_REFRESH_SECRET =\n  process.env.JWT_REFRESH_SECRET ?? 'test-refresh-secret';\nprocess.env.JWT_ISSUER = process.env.JWT_ISSUER ?? 'energy-bill-ai-parser-test';\n","backend/tests/unit/extraction-response.parser.spec.ts":"import { BadGatewayException } from '@nestjs/common';\nimport { parseInvoiceExtractionFromText } from '../../src/modules/llm/application/extraction-response.parser';\n\ndescribe('parseInvoiceExtractionFromText', () =\u003E {\n  it('deve parsear JSON v\u00e1lido dentro de markdown', () =\u003E {\n    const parsed = parseInvoiceExtractionFromText(`\n\\`\\`\\`json\n{\n  \"N\u00ba DO CLIENTE\": \"7204076116\",\n  \"M\u00eas de refer\u00eancia\": \"JAN/2024\",\n  \"Energia El\u00e9trica\": { \"Quantidade (kWh)\": 50, \"Valor (R$)\": 47.75 },\n  \"Energia SCEEE s/ICMS\": { \"Quantidade (kWh)\": 456, \"Valor (R$)\": 232.42 },\n  \"Energia compensada GD I\": { \"Quantidade (kWh)\": 456, \"Valor (R$)\": -222.22 },\n  \"Contrib Ilum Publica Municipal\": { \"Valor (R$)\": 49.43 }\n}\n\\`\\`\\`\n`);\n\n    expect(parsed['N\u00ba DO CLIENTE']).toBe('7204076116');\n    expect(parsed['M\u00eas de refer\u00eancia']).toBe('JAN/2024');\n    expect(parsed['Energia El\u00e9trica']['Quantidade (kWh)']).toBe(50);\n  });\n\n  it('deve lan\u00e7ar BadGatewayException para payload inv\u00e1lido', () =\u003E {\n    expect(() =\u003E parseInvoiceExtractionFromText('{\"invalid\":true}')).toThrow(\n      BadGatewayException,\n    );\n  });\n});\n","backend/tests/unit/invoice-extraction.contract.spec.ts":"import {\n  computeInvoiceMetrics,\n  DEFAULT_INVOICE_EXTRACTION_PROMPT,\n  DEFAULT_INVOICE_EXTRACTION_REFERENCE,\n  resolveInvoiceExtractionPrompt,\n  resolveInvoiceExtractionReference,\n} from '../../src/modules/invoices/domain/contracts/invoice-extraction.contract';\n\ndescribe('invoice-extraction.contract', () =\u003E {\n  it('deve calcular m\u00e9tricas corretamente', () =\u003E {\n    const metrics = computeInvoiceMetrics({\n      'N\u00ba DO CLIENTE': '7204076116',\n      'M\u00eas de refer\u00eancia': 'JAN/2024',\n      'Energia El\u00e9trica': { 'Quantidade (kWh)': 50, 'Valor (R$)': 47.75 },\n      'Energia SCEEE s/ICMS': { 'Quantidade (kWh)': 456, 'Valor (R$)': 232.42 },\n      'Energia compensada GD I': {\n        'Quantidade (kWh)': 456,\n        'Valor (R$)': -222.22,\n      },\n      'Contrib Ilum Publica Municipal': { 'Valor (R$)': 49.43 },\n    });\n\n    expect(metrics.consumoEnergiaEletricaKwh).toBe(506);\n    expect(metrics.energiaCompensadaKwh).toBe(456);\n    expect(metrics.valorTotalSemGdRs).toBeCloseTo(329.6, 6);\n    expect(metrics.economiaGdRs).toBe(-222.22);\n  });\n\n  it('deve usar refer\u00eancia default quando refer\u00eancia \u00e9 inv\u00e1lida', () =\u003E {\n    const resolved = resolveInvoiceExtractionReference('{invalid json');\n    expect(resolved).toEqual(DEFAULT_INVOICE_EXTRACTION_REFERENCE);\n  });\n\n  it('deve usar prompt default quando prompt vazio', () =\u003E {\n    expect(resolveInvoiceExtractionPrompt('   ')).toBe(\n      DEFAULT_INVOICE_EXTRACTION_PROMPT,\n    );\n   \"node_modules/yallist\": {\n      \"version\": \"3.1.1\",\n      \"resolved\": \"https://registry.npmjs.org/yallist/-/yallist-3.1.1.tgz\",\n      \"integrity\": \"sha512-a4UGQaWPH59mOXUYnAG2ewncQS4i4F43Tv3JoAM+s2VDAmS9NsK8GpDMLrCHPksFT7h3K6TOoUNn2pb7RoXx4g==\",\n      \"dev\": true,\n      \"license\": \"ISC\"\n    },\n    \"node_modules/yocto-queue\": {\n      \"version\": \"0.1.0\",\n      \"resolved\": \"https://registry.npmjs.org/yocto-queue/-/yocto-queue-0.1.0.tgz\",\n      \"integrity\": \"sha512-rVksvsnNCdJ/ohGc6xgPwyN8eheCxsiLM8mxuE/t/mOVqJewPuO1miLpTHQiRgTKCLexL4MeAFVagts7HmNZ2Q==\",\n      \"dev\": true,\n      \"license\": \"MIT\",\n      \"engines\": {\n        \"node\": \"\u003E=10\"\n      },\n      \"funding\": {\n        \"url\": \"https://github.com/sponsors/sindresorhus\"\n      }\n    },\n    \"node_modules/zod\": {\n      \"version\": \"4.3.6\",\n      \"resolved\": \"https://registry.npmjs.org/zod/-/zod-4.3.6.tgz\",\n      \"integrity\": \"sha512-rftlrkhHZOcjDwkGlnUtZZkvaPHCsDATp4pGpuOOMDaTdDDXF91wuVDJoWoPsKX/3YPQ5fHuF3STjcYyKr+Qhg==\",\n      \"license\": \"MIT\",\n      \"funding\": {\n        \"url\": \"https://github.com/sponsors/colinhacks\"\n      }\n    },\n    \"node_modules/zod-validation-error\": {\n      \"version\": \"4.0.2\",\n      \"resolved\": \"https://registry.npmjs.org/zod-validation-error/-/zod-validation-error-4.0.2.tgz\",\n      \"integrity\": \"sha512-Q6/nZLe6jxuU80qb/4uJ4t5v2VEZ44lzQjPDhYJNztRQ4wyWc6VF3D3Kb/fAuPetZQnhS3hnajCf9CsWesghLQ==\",\n      \"dev\": true,\n      \"license\": \"MIT\",\n      \"engines\": {\n        \"node\": \"\u003E=18.0.0\"\n      },\n      \"peerDependencies\": {\n        \"zod\": \"^3.25.0 || ^4.0.0\"\n      }\n    }\n  }\n}\n","frontend/package.json":"{\n  \"name\": \"frontend\",\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"scripts\": {\n    \"dev\": \"next dev\",\n    \"build\": \"next build\",\n    \"start\": \"next start\",\n    \"lint\": \"eslint\"\n  },\n  \"dependencies\": {\n    \"@reduxjs/toolkit\": \"^2.11.2\",\n    \"@tanstack/react-query\": \"^5.90.21\",\n    \"axios\": \"^1.13.6\",\n    \"next\": \"16.1.6\",\n    \"react\": \"19.2.3\",\n    \"react-dom\": \"19.2.3\",\n    \"react-redux\": \"^9.2.0\",\n    \"zod\": \"^4.3.6\"\n  },\n  \"devDependencies\": {\n    \"@tailwindcss/postcss\": \"^4\",\n    \"@types/node\": \"^20\",\n    \"@types/react\": \"^19\",\n    \"@types/react-dom\": \"^19\",\n    \"eslint\": \"^9\",\n    \"eslint-config-next\": \"16.1.6\",\n    \"tailwindcss\": \"^4\",\n    \"typescript\": \"^5\"\n  }\n}\n","frontend/postcss.config.mjs":"const config = {\n  plugins: {\n    \"@tailwindcss/postcss\": {},\n  },\n};\n\nexport default config;\n","frontend/README.md":"# Frontend - Energy Bill Platform\n\n\u003Cdetails open\u003E\n\u003Csummary\u003E\u003Cstrong\u003EPortugu\u00eas (PT-BR)\u003C/strong\u003E\u003C/summary\u003E\n\nFrontend Next.js com arquitetura FSD para opera\u00e7\u00e3o da plataforma completa integrada ao backend.\n\n## Stack\n\n- Next.js (App Router) + TypeScript\n- Tailwind CSS (tema verde claro/escuro)\n- Redux Toolkit (estado de sess\u00e3o/autentica\u00e7\u00e3o)\n- React Query (estado de servidor)\n- Axios (client API)\n\n## Arquitetura (FSD)\n\n- `src/app`: rotas, layout e API routes do Next.\n- `src/shared`: API clients, config, store global, UI base.\n- `src/entities`: contratos de dom\u00ednio no frontend (`auth`, `invoice`, `admin`).\n- `src/features`: fluxos reutiliz\u00e1veis (login, registro, sess\u00e3o).\n- `src/widgets`: composi\u00e7\u00e3o de layout e shell da aplica\u00e7\u00e3o.\n\n## Sess\u00e3o segura (HTTP-only cookie)\n\n- O frontend n\u00e3o exp\u00f5e tokens em `localStorage`.\n- Login/registro/refresh/logout usam `src/app/api/auth/*` e setam cookies HTTP-only.\n- Chamadas autenticadas passam por `src/app/api/proxy/[...path]`, que:\n  - injeta `Authorization` com access token;\n  - tenta refresh em `401`;\n  - atualiza cookies de sess\u00e3o automaticamente.\n\n## Funcionalidades\n\n- Auth: login, registro, perfil, logout e refresh transparente.\n- Invoices: upload/processamento, listagem e consulta de documentos.\n- Dashboards: energia (kWh) e financeiro (R$).\n- Admin: usu\u00e1rios, faturas, documentos e auditoria (com opera\u00e7\u00f5es administrativas).\n\n## Execu\u00e7\u00e3o local\n\n```bash\nnpm install\nnpm run dev\n```\n\n## Build e lint\n\n```bash\nnpm run lint\nnpm run build\n```\n\n## Docker\n\nEste frontend \u00e9 orquestrado no `docker-compose.yml` da raiz e sobe junto com backend/infra:\n\n```bash\ndocker compose up --build\n```\n\nAcesso padr\u00e3o:\n\n- Frontend: `http://localhost:3001`\n- Backend API: `http://localhost:3000`\n- Swagger (English): `http://localhost:3000/api/docs/en`\n- Swagger (Portugu\u00eas): `http://localhost:3000/api/docs/pt`\n\n\u003C/details\u003E\n\n\u003Cdetails\u003E\n\u003Csummary\u003E\u003Cstrong\u003EEnglish (EN)\u003C/strong\u003E\u003C/summary\u003E\n\nNext.js frontend with FSD architecture for full platform operation integrated with the backend.\n\n## Stack\n\n- Next.js (App Router) + TypeScript\n- Tailwind CSS (light/dark green theme)\n- Redux Toolkit (session/authentication state)\n- React Query (server state)\n- Axios (API client)\n\n## Architecture (FSD)\n\n- `src/app`: Next routes, layout, and API routes.\n- `src/shared`: API clients, config, global store, base UI.\n- `src/entities`: frontend domain contracts (`auth`, `invoice`, `admin`).\n- `src/features`: reusable flows (login, signup, session).\n- `src/widgets`: layout composition and application shell.\n\n## Secure session (HTTP-only cookie)\n\n- The frontend does not expose tokens in `localStorage`.\n- Login/signup/refresh/logout use `src/app/api/auth/*` and set HTTP-only cookies.\n- Authenticated requests go through `src/app/api/proxy/[...path]`, which:\n  - injects `Authorization` with the access token;\n  - attempts refresh on `401`;\n  - updates session cookies automatically.\n\n## Features\n\n- Auth: login, signup, profile, logout, and transparent refresh.\n- Invoices: upload/processing, listing, and document querying.\n- Dashboards: energy (kWh) and financial (BRL).\n- Admin: users, invoices, documents, and audit (with administrative operations).\n\n## Local run\n\n```bash\nnpm install\nnpm run dev\n```\n\n## Build and lint\n\n```bash\nnpm run lint\nnpm run build\n```\n\n## Docker\n\nThis frontend is orchestrated by the root `docker-compose.yml` and starts together with backend/infrastructure:\n\n```bash\ndocker compose up --build\n```\n\nDefault access:\n\n- Frontend: `http://localhost:3001`\n- Backend API: `http://localhost:3000`\n- Swagger (English): `http://localhost:3000/api/docs/en`\n- Swagger (Portugu\u00eas): `http://localhost:3000/api/docs/pt`\n\n\u003C/details\u003E\n","frontend/tsconfig.json":"{\n  \"compilerOptions\": {\n    \"target\": \"ES2017\",\n    \"lib\": [\"dom\", \"dom.iterable\", \"esnext\"],\n    \"allowJs\": true,\n    \"skipLibCheck\": true,\n    \"strict\": true,\n    \"noEmit\": true,\n    \"esModuleInterop\": true,\n    \"module\": \"esnext\",\n    \"moduleResolution\": \"bundler\",\n    \"resolveJsonModule\": true,\n    \"isolatedModules\": true,\n    \"jsx\": \"react-jsx\",\n    \"incremental\": true,\n    \"plugins\": [\n      {\n        \"name\": \"next\"\n      }\n    ],\n    \"paths\": {\n      \"@/*\": [\"./src/*\"]\n    }\n  },\n  \"include\": [\n    \"next-env.d.ts\",\n    \"**/*.ts\",\n    \"**/*.tsx\",\n    \".next/types/**/*.ts\",\n    \".next/dev/types/**/*.ts\",\n    \"**/*.mts\"\n  ],\n  \"exclude\": [\"node_modules\"]\n}\n","frontend/public/file.svg":"\u003Csvg fill=\"none\" viewBox=\"0 0 16 16\" xmlns=\"http://www.w3.org/2000/svg\"\u003E\u003Cpath d=\"M14.5 13.5V5.41a1 1 0 0 0-.3-.7L9.8.29A1 1 0 0 0 9.08 0H1.5v13.5A2.5 2.5 0 0 0 4 16h8a2.5 2.5 0 0 0 2.5-2.5m-1.5 0v-7H8v-5H3v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1M9.5 5V2.12L12.38 5zM5.13 5h-.62v1.25h2.12V5zm-.62 3h7.12v1.25H4.5zm.62 3h-.62v1.25h7.12V11z\" clip-rule=\"evenodd\" fill=\"#666\" ;\n  --danger-strong: #dc2626;\n}\n\n.theme-light {\n  --surface-0: #f2fbf6;\n  --surface-1: #ffffff;\n  --surface-2: #e7f5ee;\n  --border-color: #b7dec9;\n  --text-primary: #123324;\n  --text-secondary: #2d5845;\n  --accent: #21895f;\n  --accent-strong: #186d4b;\n  --accent-contrast: #f4fff9;\n  --danger: #dc2626;\n  --danger-strong: #b91c1c;\n}\n\n@theme inline {\n  --color-background: var(--surface-0);\n  --color-foreground: var(--text-primary);\n}\n\nbody {\n  background: var(--surface-0);\n  color: var(--text-primary);\n  transition: background-color 180ms ease, color 180ms ease;\n}\n\nhtml,\nbody {\n  max-width: 100%;\n  overflow-x: hidden;\n}\n\na {\n  color: var(--accent-strong);\n}\n\n::selection {\n  background: var(--accent-strong);\n  color: var(--accent-contrast);\n}\n","frontend/src/app/layout.tsx":"import type { Metadata } from 'next';\nimport { Inter } from 'next/font/google';\nimport './globals.css';\nimport { Providers } from './providers';\nimport { SessionInitializer } from '@/features/session/init-session';\n\nconst inter = Inter({ subsets: ['latin'] });\n\nexport const metadata: Metadata = {\n  title: 'Energy Bill Platform',\n  description: 'Frontend enterprise para o parser de faturas de energia',\n};\n\nexport default function RootLayout({\n  children,\n}: Readonly\u003C{\n  children: React.ReactNode;\n}\u003E) {\n  return (\n    \u003Chtml lang=\"pt-BR\" suppressHydrationWarning\u003E\n      \u003Chead\u003E\n        \u003Cscript\n          dangerouslySetInnerHTML={{\n            __html: `(function(){try{var stored=localStorage.getItem('ebill-theme');var prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;var theme=stored||(prefersDark?'dark':'light');var root=document.documentElement;root.classList.remove('theme-light','theme-dark');root.classList.add(theme==='dark'?'theme-dark':'theme-light');}catch(_e){}})();`,\n          }}\n        /\u003E\n      \u003C/head\u003E\n      \u003Cbody className={`${inter.className} antialiased`}\u003E\n        \u003CProviders\u003E\n          \u003CSessionInitializer /\u003E\n          {children}\n        \u003C/Providers\u003E\n      \u003C/body\u003E\n    \u003C/html\u003E\n  );\n}\n","frontend/src/app/not-found.tsx":"'use client';\n\nimport Link from 'next/link';\nimport { useRouter } from 'next/navigation';\nimport { Button } from '@/shared/ui/button';\nimport { useAppSelector } from '@/shared/store/hooks';\n\nexport default function NotFound() {\n  const router = useRouter();\n  const user = useAppSelector((state) =\u003E state.auth.user);\n  const targetPath = user ? '/dashboard' : '/';\n\n  return (\n    \u003Cmain className=\"flex min-h-screen items-center justify-center bg-[var(--surface-0)] px-4 py-8\"\u003E\n      \u003Csection className=\"w-full max-w-xl rounded-2xl border border-[var(--border-color)] bg-[var(--surface-1)] p-6 shadow-sm sm:p-8\"\u003E\n        \u003Cp className=\"text-sm font-semibold uppercase tracking-wide text-[var(--text-secondary)]\"\u003E\n          Erro 404\n        \u003C/p\u003E\n        \u003Ch1 className=\"mt-2 text-2xl font-semibold text-[var(--text-primary)] sm:text-3xl\"\u003E\n          Pagina nao encontrada\n        \u003C/h1\u003E\n        \u003Cp className=\"mt-3 text-sm leading-6 text-[var(--text-secondary)] sm:text-base\"\u003E\n          A rota que voce tentou acessar nao existe ou foi movida. Use uma das\n          opcoes abaixo para continuar navegando na plataforma.\n        \u003C/p\u003E\n\n        \u003Cdiv className=\"mt-6 grid gap-3 sm:grid-cols-2\"\u003E\n          \u003CLink href={targetPath} className=\"w-full\"\u003E\n            \u003CButton className=\"w-full\"\u003E\n              {user ? 'Ir para dashboard' : 'Ir para pagina principal'}\n            \u003C/Button\u003E\n          \u003C/Link\u003E\n          \u003CButton\n            type=\"button\"\n            variant=\"ghost\"\n            className=\"w-full\"\n            onClick={() =\u003E router.back()}\n          \u003E\n            Voltar uma guia\n          \u003C/Button\u003E\n        \u003C/div\u003E\n      \u003C/section\u003E\n    \u003C/main\u003E\n  );\n}\n","frontend/src/app/page.tsx":"import Link from 'next/link';\nimport { AppShell } from '@/widgets/app-shell/app-shell';\nimport { RequireAuth } from '@/features/session/require-auth';\nimport { Card } from '@/shared/ui/card';\n\nexport default function Home() {\n  return (\n    \u003CRequireAuth\u003E\n      \u003CAppShell\u003E\n        \u003Cdiv className=\"mx-auto w-full max-w-6xl\"\u003E\n          \u003Cdiv className=\"grid gap-4 md:grid-cols-2\"\u003E\n            \u003CCard title=\"Upload e processamento\"\u003E\n              \u003Cp className=\"mb-3 text-sm text-[var(--text-secondary)]\"\u003E\n                Envie e processe faturas PDF com extra\u00e7\u00e3o via IA.\n              \u003C/p\u003E\n              \u003CLink className=\"text-sm font-semibold text-[var(--accent)]\" href=\"/invoices\"\u003E\n                Acessar modulo de faturas\n              \u003C/Link\u003E\n            \u003C/Card\u003E\n            \u003CCard title=\"Dashboards e controle\"\u003E\n              \u003Cp className=\"mb-3 text-sm text-[var(--text-secondary)]\"\u003E\n                Consulte consolidado energ\u00e9tico e financeiro.\n              \u003C/p\u003E\n              \u003CLink className=\"text-sm font-semibold text-[var(--accent)]\" href=\"/dashboard\"\u003E\n                Ver dashboards\n              \u003C/Link\u003E\n            \u003C/Card\u003E\n          \u003C/div\u003E\n        \u003C/div\u003E\n      \u003C/AppShell\u003E\n    \u003C/RequireAuth\u003E\n  );\n}\n","frontend/src/app/providers.tsx":"'use client';\n\nimport { QueryClient, QueryClientProvider } from '@tanstack/react-query';\nimport { useState } from 'react';\nimport { Provider } from 'react-redux';\nimport { store } from '@/shared/store/store';\n\ntype ProvidersProps = {\n  children: React.ReactNode;\n};\n\nexport function Providers({ children }: ProvidersProps) {\n  const [queryClient] = useState(\n    () =\u003E\n      new QueryClient({\n        defaultOptions: {\n          queries: {\n            retry: 1,\n            staleTime: 30_000,\n            refetchOnWindowFocus: false,\n          },\n          mutations: {\n            retry: 0,\n          },\n        },\n      }),\n  );\n\n  return (\n    \u003CProvider store={store}\u003E\n      \u003CQueryClientProvider client={queryClient}\u003E{children}\u003C/QueryClientProvider\u003E\n    \u003C/Provider\u003E\n  );\n}\n","frontend/src/app/admin/page.tsx":"'use client';\n\nimport { useQuery } from '@tanstack/react-query';\nimport { useMutation, useQueryClient } from '@tanstack/react-query';\nimport { FormEvent, useState } from 'react';\nimport { AppShell } from '@/widgets/app-shell/app-shell';\nimport { RequireAuth } from '@/features/session/require-auth';\nimport { Card } from '@/shared/ui/card';\nimport { Button } from '@/shared/ui/button';\nimport { Input } from '@/shared/ui/input';\nimport { Modal } from '@/shared/ui/modal';\nimport {\n  createAdminUser,\n  deleteAdminDocument,\n  deleteAdminInvoice,\n  deleteAdminUser,\n  downloadAdminDocument,\n  listAdminAuditLogs,\n  listAdminDocuments,\n  listAdminInvoices,\n  listAdminUsers,\n  updateAdminInvoiceReferenceMonth,\n  updateAdminUser,\n} from '@/entities/admin/api/admin.client';\n\ntype RoleType = 'ADMIN' | 'USER';\n\ntype EditableUser = {\n  id: string;\n  username: string;\n  role: RoleType;\n  isActive: boolean;\n};\n\ntype EditableInvoice = {\n  id: string;\n  mesReferencia: string;\n};\n\ntype DeleteTarget = {\n  id: string;\n  kind: 'usuario' | 'fatura' | 'arquivo';\n  label: string;\n};\n\ntype InvoiceDetailsTarget = {\n  id: string;\n  fileName: string;\n  numeroCliente: string;\n  mesReferencia: string;\n  createdAt: string;\n  consumoEnergiaEletricaKwh: number;\n  energiaCompensadaKwh: number;\n  valorTotalSemGdRs: number;\n  economiaGdRs: number;\n};\n\nexport default function AdminPage() {\n  const auditPageSize = 10;\n  const queryClient = useQueryClient();\n  const [feedback, setFeedback] = useState('');\n  const [editingUser, setEditingUser] = useState\u003CEditableUser | null\u003E(null);\n  const [editingInvoice, setEditingInvoice] = useState\u003CEditableInvoice | null\u003E(null);\n  const [editUserUsername, setEditUserUsername] = useState('');\n  const [editUserRole, setEditUserRole] = useState\u003CRoleType\u003E('USER');\n  const [editUserActive, setEditUserActive] = useState(true);\n  const [editInvoiceMes, setEditInvoiceMes] = useState('');\n  const [deleteTarget, setDeleteTarget] = useState\u003CDeleteTarget | null\u003E(null);\n  const [invoiceDetails, setInvoiceDetails] = useState\u003CInvoiceDetailsTarget | null\u003E(null);\n  const [auditPage, setAuditPage] = useState(1);\n  const usersQuery = useQuery({\n    queryKey: ['admin', 'users'],\n    queryFn: listAdminUsers,\n  });\n  const invoicesQuery = useQuery({\n    queryKey: ['admin', 'invoices'],\n    queryFn: listAdminInvoices,\n  });\n  const documentsQuery = useQuery({\n    queryKey: ['admin', 'documents'],\n    queryFn: listAdminDocuments,\n  });\n  const auditsQuery = useQuery({\n    queryKey: ['admin', 'audit-logs', auditPage, auditPageSize],\n    queryFn: () =\u003E listAdminAuditLogs({ page: auditPage, pageSize: auditPageSize }),\n  });\n\n  const invalidateAll = async () =\u003E {\n    await Promise.all([\n      queryClient.invalidateQueries({ queryKey: ['admin', 'users'] }),\n      queryClient.invalidateQueries({ queryKey: ['admin', 'invoices'] }),\n      queryClient.invalidateQueries({ queryKey: ['admin', 'documents'] }),\n      queryClient.invalidateQueries({ queryKey: ['admin', 'audit-logs'] }),\n    ]);\n  };\n\n  const createUserMutation = useMutation({\n    mutationFn: createAdminUser,\n    onSuccess: async () =\u003E {\n      setFeedback('Usuario criado com sucesso.');\n      await invalidateAll();\n    },\n  });\n  const updateUserMutation = useMutation({\n    mutationFn: ({\n      userId,\n      username,\n      role,\n      isActive,\n    }: {\n      userId: string;\n      username?: string;\n      role?: 'ADMIN' | 'USER';\n      isActive?: boolean;\n    }) =\u003E updateAdminUser(userId, { username, role, isActive }),\n    onSuccess: async () =\u003E {\n      setFeedback('Usuario atualizado com sucesso.');\n      await invalidateAll();\n    },\n  });\n  const deleteUserMutation = useMutation({\n    mutationFn: deleteAdminUser,\n    onSuccess: async () =\u003E {\n      setFeedback('Usuario removido com sucesso.');\n      await invalidateAll();\n    },\n  });\n  const updateInvoiceMutation = useMutation({\n    mutationFn: ({\n      invoiceId,\n      mesReferencia,\n    }: {\n      invoiceId: string;\n      mesReferencia: string;\n    }) =\u003E updateAdminInvoiceReferenceMonth(invoiceId, mesReferencia),\n    onSuccess: async () =\u003E {\n      setFeedback('Fatura atualizada com sucesso.');\n      await invalidateAll();\n    },\n  });\n  const deleteInvoiceMutation = useMutation({\n    mutationFn: deleteAdminInvoice,\n    onSuccess: async () =\u003E {\n      setFeedback('Fatura removida com sucesso.');\n      await invalidateAll();\n    },\n  });\n  const deleteDocumentMutation = useMutation({\n    mutationFn: deleteAdminDocument,\n    onSuccess: async () =\u003E {\n      setFeedback('Documento removido com sucesso.');\n      await invalidateAll();\n    },\n  });\n\n  function handleCreateUser(event: FormEvent\u003CHTMLFormElement\u003E) {\n    event.preventDefault();\n    const formData = new FormData(event.currentTarget);\n    createUserMutation.mutate({\n      email: String(formData.get('email') ?? ''),\n      username: String(formData.get('username') ?? ''),\n      password: String(formData.get('password') ?? ''),\n      role: String(formData.get('role') ?? 'USER') as 'ADMIN' | 'USER',\n    });\n  }\n\n  async function handleDownload(documentId: string) {\n    const payload = await downloadAdminDocument(documentId);\n    const link = document.createElement('a');\n    link.href = `data:${payload.mimeType};base64,${payload.contentBase64}`;\n    link.download = payload.fileName;\n    link.click();\n  }\n\n  function resolveRole(value: unknown): RoleType {\n    return value === 'ADMIN' ? 'ADMIN' : 'USER';\n  }\n\n  function openUserModal(user: Record\u003Cstring, unknown\u003E) {\n    const id = String(user.id ?? '');\n    const username = String(user.username ?? '');\n    const role = resolveRole(user.role);\n    const isActive = Boolean(user.isActive ?? true);\n    setEditingUser({ id, username, role, isActive });\n    setEditUserUsername(username);\n    setEditUserRole(role);\n    setEditUserActive(isActive);\n  }\n\n  function openInvoiceModal(invoice: Record\u003Cstring, unknown\u003E) {\n    const id = String(invoice.id ?? '');\n    const mesReferencia = String(invoice.mesReferencia ?? '');\n    setEditingInvoice({ id, mesReferencia });\n    setEditInvoiceMes(mesReferencia);\n  }\n\n  function openInvoiceDetailsModal(invoice: Record\u003Cstring, unknown\u003E) {\n    const metrics = toRecord(invoice.metrics);\n    setInvoiceDetails({\n      id: String(invoice.id ?? ''),\n      fileName: String(invoice.fileName ?? '-'),\n      numeroCliente: String(invoice.numeroCliente ?? '-'),\n      mesReferencia: String(invoice.mesReferencia ?? '-'),\n      createdAt: String(invoice.createdAt ?? ''),\n      consumoEnergiaEletricaKwh: readNumericValue(\n        metrics,\n        'consumoEnergiaEletricaKwh',\n      ),\n      energiaCompensadaKwh: readNumericValue(metrics, 'energiaCompensadaKwh'),\n      valorTotalSemGdRs: readNumericValue(metrics, 'valorTotalSemGdRs'),\n      economiaGdRs: readNumericValue(metrics, 'economiaGdRs'),\n    });\n  }\n\n  function handleSaveUser() {\n    if (!editingUser) {\n      return;\n    }\n\n    updateUserMutation.mutate(\n      {\n        userId: editingUser.id,\n        username: editUserUsername || undefined,\n        role: editUserRole,\n        isActive: editUserActive,\n      },\n      {\n        onSuccess: () =\u003E {\n          setEditingUser(null);\n        },\n      },\n    );\n  }\n\n  function handleSaveInvoice() {\n    if (!editingInvoice) {\n      return;\n    }\n\n    updateInvoiceMutation.mutate(\n      {\n        invoiceId: editingInvoice.id,\n        mesReferencia: editInvoiceMes,\n      },\n      {\n        onSuccess: () =\u003E {\n          setEditingInvoice(null);\n        },\n      },\n    );\n  }\n\n  function openDeleteModal(target: DeleteTarget) {\n    setDeleteTarget(target);\n  }\n\n  function handleConfirmDelete() {\n    if (!deleteTarget) {\n      return;\n    }\n\n    if (deleteTarget.kind === 'usuario') {\n      deleteUserMutation.mutate(deleteTarget.id, {\n        onSuccess: () =\u003E setDeleteTarget(null),\n      });\n      return;\n    }\n    if (deleteTarget.kind === 'fatura') {\n      deleteInvoiceMutation.mutate(deleteTarget.id, {\n        onSuccess: () =\u003E setDeleteTarget(null),\n      });\n      return;\n    }\n    deleteDocumentMutation.mutate(deleteTarget.id, {\n      onSuccess: () =\u003E setDeleteTarget(null),\n    });\n  }\n\n  return (\n    \u003CRequireAuth role=\"ADMIN\"\u003E\n      \u003CAppShell\u003E\n        \u003Cdiv className=\"mx-auto grid w-full max-w-6xl min-w-0 gap-4\"\u003E\n          {feedback ? (\n            \u003Cp className=\"rounded-md border border-[var(--border-color)] bg-[var(--surface-2)] p-3 text-sm text-[var(--text-primary)]\"\u003E\n              {feedback}\n            \u003C/p\u003E\n          ) : null}\n          \u003CCard title=\"Usuarios (admin)\"\u003E\n            \u003Cform\n              onSubmit={handleCreateUser}\n              className=\"mb-4 grid gap-2 rounded border border-[var(--border-color)] p-3 sm:grid-cols-2 xl:grid-cols-4\"\n            \u003E\n              \u003CInput label=\"E-mail\" name=\"email\" required /\u003E\n              \u003CInput label=\"Usuario\" name=\"username\" required /\u003E\n              \u003CInput label=\"Senha\" name=\"password\" type=\"password\" required /\u003E\n              \u003Clabel className=\"flex flex-col gap-2 text-sm font-medium text-[var(--text-primary)]\"\u003E\n                \u003Cspan\u003EPapel\u003C/span\u003E\n                \u003Cselect\n                  className=\"rounded-lg border border-[var(--border-color)] bg-[var(--surface-1)] px-3 py-2 text-[var(--text-primary)]\"\n                  name=\"role\"\n                  defaultValue=\"USER\"\n                \u003E\n                  \u003Coption value=\"USER\"\u003EUSER\u003C/option\u003E\n                  \u003Coption value=\"ADMIN\"\u003EADMIN\u003C/option\u003E\n                \u003C/select\u003E\n              \u003C/label\u003E\n              \u003CButton type=\"submit\" className=\"md:col-span-4\"\u003E\n                Criar usuario\n              \u003C/Button\u003E\n            \u003C/form\u003E\n            \u003Cdiv className=\"hidden min-w-0 overflow-x-auto md:block\"\u003E\n              \u003Ctable className=\"min-w-full text-left text-sm\"\u003E\n                \u003Cthead className=\"bg-[var(--surface-2)] text-[var(--text-primary)]\"\u003E\n                  \u003Ctr\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003EID\u003C/th\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003EEmail\u003C/th\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003EUsername\u003C/th\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003ERole\u003C/th\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003EAcoes\u003C/th\u003E\n                  \u003C/tr\u003E\n                \u003C/thead\u003E\n                \u003Ctbody\u003E\n                  {(usersQuery.data ?? []).map((user) =\u003E (\n                    \u003Ctr\n                      key={String(user.id)}\n                      className=\"border-b border-[var(--border-color)] align-top\"\n                    \u003E\n                      \u003Ctd className=\"px-3 py-2 text-[var(--text-primary)] break-all\"\u003E{String(user.id)}\u003C/td\u003E\n                      \u003Ctd className=\"px-3 py-2 text-[var(--text-primary)] break-all\"\u003E{String(user.email)}\u003C/td\u003E\n                      \u003Ctd className=\"px-3 py-2 text-[var(--text-primary)] break-all\"\u003E{String(user.username)}\u003C/td\u003E\n                      \u003Ctd className=\"px-3 py-2 text-[var(--text-primary)]\"\u003E{String(user.role)}\u003C/td\u003E\n                      \u003Ctd className=\"px-3 py-2\"\u003E\n                        \u003Cdiv className=\"flex flex-col gap-2 sm:flex-row\"\u003E\n                          \u003CButton variant=\"ghost\" onClick={() =\u003E openUserModal(user)}\u003E\n                            Editar\n                          \u003C/Button\u003E\n                          \u003CButton\n                            variant=\"danger\"\n                            onClick={() =\u003E\n                              openDeleteModal({\n                                id: String(user.id),\n                                kind: 'usuario',\n                                label: String(user.username ?? user.email ?? user.id),\n                              })\n                            }\n                          \u003E\n                            Excluir\n                          \u003C/Button\u003E\n                        \u003C/div\u003E\n                      \u003C/td\u003E\n                    \u003C/tr\u003E\n                  ))}\n                \u003C/tbody\u003E\n              \u003C/table\u003E\n            \u003C/div\u003E\n            \u003Cdiv className=\"grid gap-3 md:hidden\"\u003E\n              {(usersQuery.data ?? []).map((user) =\u003E (\n                \u003Carticle\n                  key={`mobile-user-${String(user.id)}`}\n                  className=\"rounded-lg border border-[var(--border-color)] bg-[var(--surface-2)] p-3 text-sm text-[var(--text-primary)]\"\n                \u003E\n                  \u003Cp\u003E\u003Cstrong\u003EID:\u003C/strong\u003E {String(user.id)}\u003C/p\u003E\n                  \u003Cp\u003E\u003Cstrong\u003EEmail:\u003C/strong\u003E {String(user.email)}\u003C/p\u003E\n                  \u003Cp\u003E\u003Cstrong\u003EUsuario:\u003C/strong\u003E {String(user.username)}\u003C/p\u003E\n                  \u003Cp\u003E\u003Cstrong\u003ERole:\u003C/strong\u003E {String(user.role)}\u003C/p\u003E\n                  \u003Cdiv className=\"mt-3 flex flex-col gap-2\"\u003E\n                    \u003CButton variant=\"ghost\" onClick={() =\u003E openUserModal(user)}\u003E\n                      Editar\n                    \u003C/Button\u003E\n                    \u003CButton\n                      variant=\"danger\"\n                      onClick={() =\u003E\n                        openDeleteModal({\n                          id: String(user.id),\n                          kind: 'usuario',\n                          label: String(user.username ?? user.email ?? user.id),\n                        })\n                      }\n                    \u003E\n                      Excluir\n                    \u003C/Button\u003E\n                  \u003C/div\u003E\n                \u003C/article\u003E\n              ))}\n            \u003C/div\u003E\n          \u003C/Card\u003E\n          \u003CCard title=\"Faturas (admin)\"\u003E\n            \u003Cdiv className=\"hidden min-w-0 overflow-x-auto md:block\"\u003E\n              \u003Ctable className=\"min-w-full text-left text-sm\"\u003E\n                \u003Cthead className=\"bg-[var(--surface-2)] text-[var(--text-primary)]\"\u003E\n                  \u003Ctr\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003EID\u003C/th\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003EArquivo\u003C/th\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003EMes\u003C/th\u003E\n                    \u003Cth className=\"px-3 py-2\"\u003EAcoes\u003C/th\u003E\n                  \u003C/tr\u003E\n                \u003C/thead\u003E\n                \u003Ctbody\u003E\n                  {(invoicesQuery.data ?? []).map((invoice) =\u003E (\n                    \u003Ctr key={String(invoice.id)} className=\"border-b border-[var(--border-color)]\"\u003E\n                      \u003Ctd className=\"px-3 py-2 text-[var(--text-primary)] break-all\"\u003E{String(invoice.id)}\u003C/td\u003E\n                      \u003Ctd className=\"px-3 py-2 text-[var(--text-primary)] break-all\"\u003E{String(invoice.fileName)}\u003C/td\u003E\n                      \u003Ctd className=\"px-3 py-2 text-[var(--text-primary)]\"\u003E{String(invoice.mesReferencia)}\u003C/td\u003E\n                      \u003Ctd className=\"px-3 py-2\"\u003E\n                        \u003Cdiv className=\"flex flex-col gap-2 sm:flex-row\"\u003E\n                          \u003CButton\n                            variant=\"ghost\"\n                            onClick={() =\u003E openInvoiceDetailsModal(invoice)}\n                          \u003E\n                            Ver informacoes\n                          \u003C/Button\u003E\n                          \u003CButton variant=\"ghost\" onClick={() =\u003E openInvoiceModal(invoice)}\u003E\n                            Editar mes\n                          \u003C/Button\u003E\n                          \u003CButton\n                            variant=\"danger\"\n                            onClick={() =\u003E\n                              openDeleteModal({\n                                id: String(invoice.id),\n                                kind: 'fatura',\n                                label: String(invoice.fileName ?? invoice.id),\n                              })\n                            }\n                          \u003E\n                            Excluir\n                          \u003C/Button\u003E\n                        \u003C/div\u003E\n                      \u003C/td\u003E\n                    \u003C/tr\u003E\n                  ))}\n                \u003C/tbody\u003E\n              \u003C/table\u003E\n            \u003C/div\u003E\n            \u003Cdiv className=\"grid gap-3 md:hidden\"\u003E\n              {(invoicesQuery.data ?? []).map((invoice) =\u003E (\n                \u003Carticle\n                  key={`mobile-invoice-${String(invoice.id)}`}\n                  className=\"rounded-lg border border-[var(--border-color)] bg-[var(--surface-2)] p-3 text-sm text-[var(--text-primary)]\"\n                \u003E\n                  \u003Cp\u003E\u003Cstrong\u003EID:\u003C/strong\u003E {String(invoice.id)}\u003C/p\u003E\n                  \u003Cp\u003E\u003Cstrong\u003EArquivo:\u003C/strong\u003E {String(invoice.fileName)}\u003C/p\u003E\n                  \u003Cp\u003E\u003Cstrong\u003EMes:\u003C/strong\u003E {String(invoice.mesReferencia)}\u003C/p\u003E\n                  \u003Cdiv className=\"mt-3 flex flex-col gap-2\"\u003E\n                    \u003CButton\n                      variant=\"ghost\"\n                      onClick={() =\u003E openInvoiceDetailsModal(invoice)}\n                    \u003E\n                      Ver informacoes\n                    \u003C/Button\u003E\n                    \u003CButton variant=\"ghost\" onClick={() =\u003E openInvoiceModal(invoice)}\u003E\n                      Editar mes\n                    \u003C/Button\u003E\n                    \u003CButton\n                      variant=\"danger\"\n                      onClick={() =\u003E\n                        openDeleteModal({\n                          id: String(invoice.id),\n                          kind: 'fatura',\n                          label: String(invoice.fileName ?? invoice.id),\n                        })\n                      }\n                    \u003E\n                      Excluir\n                    \u003C/Button\u003E\n                  \u003C/div\u003E\n                \u003C/article\u003E\n              ))}\n            \u003C/div\u003E\n          \u0
