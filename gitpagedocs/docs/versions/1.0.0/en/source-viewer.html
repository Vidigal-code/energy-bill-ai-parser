ude: { user: true },\n    });\n    if (\n      !persistedToken ||\n      persistedToken.revokedAt ||\n      !persistedToken.user.isActive\n    ) {\n      throw new UnauthorizedException(PtBrMessages.auth.invalidRefreshToken);\n    }\n\n    const validTokenHash = await argon2.verify(\n      persistedToken.tokenHash,\n      input.refreshToken,\n    );\n    if (!validTokenHash) {\n      await this.revokeTokenFamily(payload.sub);\n      throw new UnauthorizedException(PtBrMessages.auth.invalidRefreshToken);\n    }\n\n    await this.prisma.refreshToken.update({\n      where: { id: persistedToken.id },\n      data: { revokedAt: new Date() },\n    });\n\n    return this.issueTokens(\n      persistedToken.user.id,\n      persistedToken.user.email,\n      persistedToken.user.username,\n      persistedToken.user.role,\n      context,\n    );\n  }\n\n  /**\n   *\n   * EN: Revokes current refresh token and closes active session.\n   *\n   * PT: Revoga o refresh token atual e encerra a sessao ativa.\n   *\n   * @params input Refresh token DTO payload.\n   * @params actorUserId Authenticated actor identifier.\n   * @returns Standardized logout success message.\n   */\n  async logout(input: RefreshTokenDto, actorUserId: string) {\n    ApiLogger.info({\n      context: 'AuthService',\n      message: PtBrMessages.logs.auth.loggingOutUser(actorUserId),\n    });\n    const payload = this.verifyRefreshToken(input.refreshToken);\n    if (payload.sub !== actorUserId) {\n      throw new UnauthorizedException(\n        PtBrMessages.auth.tokenDoesNotBelongToAuthenticatedUser,\n      );\n    }\n\n    await this.prisma.refreshToken.updateMany({\n      where: {\n        userId: actorUserId,\n        jti: payload.jti,\n        revokedAt: null,\n      },\n      data: { revokedAt: new Date() },\n    });\n\n    await this.prisma.auditLog.create({\n      data: {\n        actorUserId,\n        action: 'AUTH_LOGOUT',\n        resourceType: 'USER',\n        resourceId: actorUserId,\n        status: AuditStatus.SUCCESS,\n        message: PtBrMessages.auth.logoutSuccess,\n      },\n    });\n\n    return { message: PtBrMessages.auth.logoutSuccess };\n  }\n\n  /**\n   *\n   * EN: Returns authenticated user profile for self-management.\n   *\n   * PT: Retorna perfil do usuario autenticado para auto gerenciamento.\n   *\n   * @params userId Authenticated user identifier.\n   * @returns Basic profile fields.\n   */\n  async me(userId: string) {\n    ApiLogger.info({\n      context: 'AuthService',\n      message: PtBrMessages.logs.auth.loadingAuthenticatedUser(userId),\n    });\n    const user = await this.prisma.user.findUnique({\n      where: { id: userId },\n      select: {\n        id: true,\n        email: true,\n        username: true,\n        role: true,\n        createdAt: true,\n        updatedAt: true,\n      },\n    });\n    if (!user) {\n      throw new UnauthorizedException(PtBrMessages.auth.userNotFound);\n    }\n    return user;\n  }\n\n  /**\n   *\n   * EN: Updates authenticated user profile data.\n   *\n   * PT: Atualiza dados de perfil do usuario autenticado.\n   *\n   * @params userId Authenticated user identifier.\n   * @params input Update profile DTO payload.\n   * @returns Updated profile projection.\n   */\n  async updateProfile(userId: string, input: UpdateProfileDto) {\n    ApiLogger.info({\n      context: 'AuthService',\n      message: PtBrMessages.logs.auth.updatingAuthenticatedUserProfile(userId),\n    });\n    const updateData: { username?: string; passwordHash?: string } = {};\n\n    if (input.username) {\n      const existing = await this.prisma.user.findUnique({\n        where: { username: input.username },\n        select: { id: true },\n      });\n      if (existing \u0026\u0026 existing.id !== userId) {\n        throw new BadRequestException(PtBrMessages.auth.usernameAlreadyExists);\n      }\n      updateData.username = input.username;\n    }\n\n    if (input.password) {\n      updateData.passwordHash = await argon2.hash(input.password);\n    }\n\n    if (!Object.keys(updateData).length) {\n      throw new BadRequestException(PtBrMessages.auth.noDataForUpdate);\n    }\n\n    const updatedUser = await this.prisma.user.update({\n      where: { id: userId },\n      data: updateData,\n      select: {\n        id: true,\n        email: true,\n        username: true,\n        role: true,\n        createdAt: true,\n        updatedAt: true,\n      },\n    });\n\n    await this.prisma.auditLog.create({\n      data: {\n        actorUserId: userId,\n        action: 'USER_UPDATE_PROFILE',\n        resourceType: 'USER',\n        resourceId: userId,\n        status: AuditStatus.SUCCESS,\n        message: PtBrMessages.auth.profileUpdated,\n      },\n    });\n\n    return updatedUser;\n  }\n\n  private async ensureDefaultAdmin() {\n    const email = this.configService.get\u003Cstring\u003E('DEFAULT_ADMIN_EMAIL');\n    const username = this.configService.get\u003Cstring\u003E('DEFAULT_ADMIN_USERNAME');\n    const password = this.configService.get\u003Cstring\u003E('DEFAULT_ADMIN_PASSWORD');\n    if (!email || !username || !password) {\n      return;\n    }\n\n    const existingAdmin = await this.prisma.user.findFirst({\n      where: {\n        OR: [{ email: email.toLowerCase() }, { username }],\n      },\n      select: { id: true },\n    });\n\n    if (existingAdmin) {\n      return;\n    }\n\n    const passwordHash = await argon2.hash(password);\n    const admin = await this.prisma.user.create({\n      data: {\n        email: email.toLowerCase(),\n        username,\n        passwordHash,\n        role: 'ADMIN',\n      },\n    });\n\n    ApiLogger.warning({\n      context: 'Auth',\n      message: PtBrMessages.logs.auth.defaultAdminCreated(admin.email),\n    });\n  }\n\n  private async issueTokens(\n    userId: string,\n    email: string,\n    username: string,\n    role: AppRole,\n    context: SessionContext,\n  ) {\n    const accessExpiresIn =\n      this.configService.get\u003Cstring\u003E('JWT_ACCESS_EXPIRES_IN') ?? '15m';\n    const refreshExpiresIn =\n      this.configService.get\u003Cstring\u003E('JWT_REFRESH_EXPIRES_IN') ?? '7d';\n    const issuer =\n      this.configService.get\u003Cstring\u003E('JWT_ISSUER') ?? 'energy-bill-ai-parser';\n    const refreshJti = randomUUID();\n    const accessExpiresSeconds = durationToSeconds(accessExpiresIn);\n    const refreshExpiresSeconds = durationToSeconds(refreshExpiresIn);\n\n    const accessToken = await this.jwtService.signAsync(\n      { sub: userId, email, username, role },\n      {\n        secret: this.configService.get\u003Cstring\u003E('JWT_ACCESS_SECRET'),\n        expiresIn: accessExpiresSeconds,\n        issuer,\n      },\n    );\n\n    const refreshToken = await this.jwtService.signAsync(\n      { sub: userId, jti: refreshJti, type: 'refresh' },\n      {\n        secret: this.configService.get\u003Cstring\u003E('JWT_REFRESH_SECRET'),\n        expiresIn: refreshExpiresSeconds,\n        issuer,\n      },\n    );\n\n    const refreshTokenHash = await argon2.hash(refreshToken);\n    const expiresAt = new Date(Date.now() + refreshExpiresSeconds * 1000);\n\n    await this.prisma.refreshToken.create({\n      data: {\n        userId,\n        jti: refreshJti,\n        tokenHash: refreshTokenHash,\n        expiresAt,\n        userAgent: context.userAgent,\n        ip: context.ip,\n      },\n    });\n\n    return {\n      accessToken,\n      refreshToken,\n      accessTokenExpiresIn: accessExpiresIn,\n      refreshTokenExpiresIn: refreshExpiresIn,\n      user: { id: userId, email, username, role },\n    };\n  }\n\n  private verifyRefreshToken(refreshToken: string): {\n    sub: string;\n    jti: string;\n  } {\n    try {\n      const payload = this.jwtService.verify\u003C{ sub: string; jti: string }\u003E(\n        refreshToken,\n        {\n          secret: this.configService.get\u003Cstring\u003E('JWT_REFRESH_SECRET'),\n        },\n      );\n      return payload;\n    } catch {\n      throw new UnauthorizedException(PtBrMessages.auth.invalidRefreshToken);\n    }\n  }\n\n  private async revokeTokenFamily(userId: string) {\n    await this.prisma.refreshToken.updateMany({\n      where: { userId, revokedAt: null },\n      data: { revokedAt: new Date() },\n    });\n  }\n}\n","backend/src/modules/auth/domain/auth-user.type.ts":"import type { AppRole } from './role.type';\n\nexport type AuthUser = {\n  sub: string;\n  email: string;\n  username: string;\n  role: AppRole;\n};\n","backend/src/modules/auth/domain/role.type.ts":"export const APP_ROLE_ENUM = {\n  ADMIN: 'ADMIN',\n  USER: 'USER',\n} as const;\n\nexport type AppRole = (typeof APP_ROLE_ENUM)[keyof typeof APP_ROLE_ENUM];\n","backend/src/modules/auth/infrastructure/jwt.strategy.ts":"import { Injectable } from '@nestjs/common';\nimport { ConfigService } from '@nestjs/config';\nimport { PassportStrategy } from '@nestjs/passport';\nimport { ExtractJwt, Strategy } from 'passport-jwt';\nimport type { AuthUser } from '../domain/auth-user.type';\nimport type { AppRole } from '../domain/role.type';\n\ntype JwtPayload = {\n  sub: string;\n  email: string;\n  username: string;\n  role: AppRole;\n};\n\n@Injectable()\nexport class JwtStrategy extends PassportStrategy(Strategy) {\n  constructor(configService: ConfigService) {\n    const secret = configService.get\u003Cstring\u003E('JWT_ACCESS_SECRET');\n    super({\n      jwtFromRequest: ExtractJwt.fromAuthHeaderAsBearerToken(),\n      ignoreExpiration: false,\n      secretOrKey: secret ?? 'dev-access-secret',\n    });\n  }\n\n  validate(payload: JwtPayload): AuthUser {\n    return {\n      sub: payload.sub,\n      email: payload.email,\n      username: payload.username,\n      role: payload.role,\n    };\n  }\n}\n","backend/src/modules/auth/presentation/auth.controller.ts":"import {\n  Body,\n  Controller,\n  Get,\n  Ip,\n  Patch,\n  Post,\n  Req,\n  UseGuards,\n} from '@nestjs/common';\nimport { AuthService } from '../application/auth.service';\nimport type { AuthUser } from '../domain/auth-user.type';\nimport type { Request } from 'express';\nimport {\n  ApiBearerAuth,\n  ApiBody,\n  ApiOkResponse,\n  ApiOperation,\n  ApiTags,\n} from '@nestjs/swagger';\nimport { LoginDto } from './dto/login.dto';\nimport { RefreshTokenDto } from './dto/refresh-token.dto';\nimport { RegisterDto } from './dto/register.dto';\nimport { UpdateProfileDto } from './dto/update-profile.dto';\nimport { CurrentUser } from './decorators/current-user.decorator';\nimport { Public } from './decorators/public.decorator';\nimport { JwtAuthGuard } from './guards/jwt-auth.guard';\nimport { RolesGuard } from './guards/roles.guard';\n\n@UseGuards(JwtAuthGuard, RolesGuard)\n@ApiTags('Auth')\n@Controller('auth')\n/**\n *\n * EN: Authentication controller exposing register/login/refresh/logout and self-profile endpoints.\n *\n * PT: Controller de autenticacao com endpoints de registro/login/refresh/logout e auto perfil.\n *\n * @params Request decorators and auth DTO payloads from HTTP layer.\n * @returns Standardized API responses from auth application service.\n */\nexport class AuthController {\n  constructor(private readonly authService: AuthService) {}\n\n  /**\n   *\n   * EN: Public endpoint to register a new user and start authenticated session.\n   *\n   * PT: Endpoint publico para registrar novo usuario e iniciar sessao autenticada.\n   *\n   * @params body Registration payload.\n   * @params ip Request IP address.\n   * @params request Raw request metadata.\n   * @returns Session tokens and user data.\n   */\n  @Public()\n  @Post('register')\n  @ApiOperation({ summary: 'Registrar usu\u00e1rio' })\n  @ApiBody({ type: RegisterDto })\n  @ApiOkResponse({ description: 'Usu\u00e1rio registrado com sucesso' })\n  register(\n    @Body() body: RegisterDto,\n    @Ip() ip: string,\n    @Req() request: Request,\n  ) {\n    return this.authService.register(body, {\n      ip,\n      userAgent: this.normalizeUserAgent(request.headers['user-agent']),\n    });\n  }\n\n  /**\n   *\n   * EN: Public endpoint to authenticate user credentials.\n   *\n   * PT: Endpoint publico para autenticar credenciais do usuario.\n   *\n   * @params body Login payload.\n   * @params ip Request IP address.\n   * @params request Raw request metadata.\n   * @returns Session tokens and user data.\n   */\n  @Public()\n  @Post('login')\n  @ApiOperation({ summary: 'Autenticar usu\u00e1rio' })\n  @ApiBody({ type: LoginDto })\n  @ApiOkResponse({ description: 'Login realizado com sucesso' })\n  login(@Body() body: LoginDto, @Ip() ip: string, @Req() request: Request) {\n    return this.authService.login(body, {\n      ip,\n      userAgent: this.normalizeUserAgent(request.headers['user-agent']),\n    });\n  }\n\n  /**\n   *\n   * EN: Public endpoint to rotate refresh token and keep session active.\n   *\n   * PT: Endpoint publico para rotacionar refresh token e manter sessao ativa.\n   *\n   * @params body Refresh token payload.\n   * @params ip Request IP address.\n   * @params request Raw request metadata.\n   * @returns Renewed session token pair.\n   */\n  @Public()\n  @Post('refresh')\n  @ApiOperation({ summary: 'Gerar novo access token via refresh token' })\n  @ApiBody({ type: RefreshTokenDto })\n  @ApiOkResponse({ description: 'Token renovado com sucesso' })\n  refresh(\n    @Body() body: RefreshTokenDto,\n    @Ip() ip: string,\n    @Req() request: Request,\n  ) {\n    return this.authService.refresh(body, {\n      ip,\n      userAgent: this.normalizeUserAgent(request.headers['user-agent']),\n    });\n  }\n\n  @Post('logout')\n  @ApiBearerAuth()\n  @ApiOperation({ summary: 'Encerrar sess\u00e3o do usu\u00e1rio' })\n  @ApiBody({ type: RefreshTokenDto })\n  @ApiOkResponse({ description: 'Logout realizado com sucesso' })\n  logout(@Body() body: RefreshTokenDto, @CurrentUser() user: AuthUser) {\n    return this.authService.logout(body, user.sub);\n  }\n\n  @Get('me')\n  @ApiBearerAuth()\n  @ApiOperation({ summary: 'Obter perfil do usu\u00e1rio autenticado' })\n  @ApiOkResponse({ description: 'Perfil retornado com sucesso' })\n  me(@CurrentUser() user: AuthUser) {\n    return this.authService.me(user.sub);\n  }\n\n  @Patch('me')\n  @ApiBearerAuth()\n  @ApiOperation({ summary: 'Atualizar perfil do usu\u00e1rio autenticado' })\n  @ApiBody({ type: UpdateProfileDto })\n  @ApiOkResponse({ description: 'Perfil atualizado com sucesso' })\n  updateProfile(@CurrentUser() user: AuthUser, @Body() body: UpdateProfileDto) {\n    return this.authService.updateProfile(user.sub, body);\n  }\n\n  private normalizeUserAgent(userAgent: string | string[] | undefined) {\n    if (Array.isArray(userAgent)) {\n      return userAgent[0];\n    }\n\n    return userAgent;\n  }\n}\n","backend/src/modules/auth/presentation/decorators/current-user.decorator.ts":"import { createParamDecorator, ExecutionContext } from '@nestjs/common';\nimport { AuthUser } from '../../domain/auth-user.type';\n\nexport const CurrentUser = createParamDecorator(\n  (_data: unknown, ctx: ExecutionContext): AuthUser =\u003E {\n    const request = ctx.switchToHttp().getRequest\u003C{ user: AuthUser }\u003E();\n    return request.user;\n  },\n);\n","backend/src/modules/auth/presentation/decorators/public.decorator.ts":"import { SetMetadata } from '@nestjs/common';\n\nexport const IS_PUBLIC_KEY = 'isPublicRoute';\nexport const Public = () =\u003E SetMetadata(IS_PUBLIC_KEY, true);\n","backend/src/modules/auth/presentation/decorators/roles.decorator.ts":"import { SetMetadata } from '@nestjs/common';\nimport type { AppRole } from '../../domain/role.type';\n\nexport const ROLES_KEY = 'roles';\nexport const Roles = (...roles: AppRole[]) =\u003E SetMetadata(ROLES_KEY, roles);\n","backend/src/modules/auth/presentation/dto/login.dto.ts":"import { IsEmail, IsString, MaxLength, MinLength } from 'class-validator';\nimport { ApiProperty } from '@nestjs/swagger';\n\nexport class LoginDto {\n  @ApiProperty({ example: 'user@local.test' })\n  @IsEmail()\n  email!: string;\n\n  @ApiProperty({ example: 'Admin@123456', minLength: 8, maxLength: 100 })\n  @IsString()\n  @MinLength(8)\n  @MaxLength(100)\n  password!: string;\n}\n","backend/src/modules/auth/presentation/dto/refresh-token.dto.ts":"import { IsString, MinLength } from 'class-validator';\nimport { ApiProperty } from '@nestjs/swagger';\n\nexport class RefreshTokenDto {\n  @ApiProperty({\n    minLength: 10,\n    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...',\n  })\n  @IsString()\n  @MinLength(10)\n  refreshToken!: string;\n}\n","backend/src/modules/auth/presentation/dto/register.dto.ts":"import {\n  IsEmail,\n  IsString,\n  Matches,\n  MaxLength,\n  MinLength,\n} from 'class-validator';\nimport { ApiProperty } from '@nestjs/swagger';\nimport { PtBrMessages } from '../../../../shared/messages/pt-br.messages';\n\nexport class RegisterDto {\n  @ApiProperty({ example: 'user@local.test' })\n  @IsEmail()\n  email!: string;\n\n  @ApiProperty({ example: 'usuario_teste', minLength: 3, maxLength: 50 })\n  @IsString()\n  @MinLength(3)\n  @MaxLength(50)\n  username!: string;\n\n  @ApiProperty({ example: 'Admin@123456', minLength: 8, maxLength: 100 })\n  @IsString()\n  @MinLength(8)\n  @MaxLength(100)\n  @Matches(/[A-Z]/, {\n    message: PtBrMessages.auth.passwordMustContainUppercase,\n  })\n  @Matches(/[a-z]/, {\n    message: PtBrMessages.auth.passwordMustContainLowercase,\n  })\n  @Matches(/[0-9]/, {\n    message: PtBrMessages.auth.passwordMustContainNumber,\n  })\n  @Matches(/[^A-Za-z0-9]/, {\n    message: PtBrMessages.auth.passwordMustContainSpecialChar,\n  })\n  password!: string;\n}\n","backend/src/modules/auth/presentation/dto/update-profile.dto.ts":"import {\n  IsOptional,\n  IsString,\n  Matches,\n  MaxLength,\n  MinLength,\n} from 'class-validator';\nimport { ApiPropertyOptional } from '@nestjs/swagger';\nimport { PtBrMessages } from '../../../../shared/messages/pt-br.messages';\n\nexport class UpdateProfileDto {\n  @ApiPropertyOptional({ example: 'novo_usuario', minLength: 3, maxLength: 50 })\n  @IsOptional()\n  @IsString()\n  @MinLength(3)\n  @MaxLength(50)\n  username?: string;\n\n  @ApiPropertyOptional({\n    example: 'Admin@123456',\n    minLength: 8,\n    maxLength: 100,\n  })\n  @IsOptional()\n  @IsString()\n  @MinLength(8)\n  @MaxLength(100)\n  @Matches(/[A-Z]/, {\n    message: PtBrMessages.auth.passwordMustContainUppercase,\n  })\n  @Matches(/[a-z]/, {\n    message: PtBrMessages.auth.passwordMustContainLowercase,\n  })\n  @Matches(/[0-9]/, {\n    message: PtBrMessages.auth.passwordMustContainNumber,\n  })\n  @Matches(/[^A-Za-z0-9]/, {\n    message: PtBrMessages.auth.passwordMustContainSpecialChar,\n  })\n  password?: string;\n}\n","backend/src/modules/auth/presentation/guards/jwt-auth.guard.ts":"import {\n  ExecutionContext,\n  Injectable,\n  UnauthorizedException,\n} from '@nestjs/common';\nimport { Reflector } from '@nestjs/core';\nimport { AuthGuard } from '@nestjs/passport';\nimport { Observable } from 'rxjs';\nimport { AuthUser } from '../../domain/auth-user.type';\nimport { PtBrMessages } from '../../../../shared/messages/pt-br.messages';\nimport { IS_PUBLIC_KEY } from '../decorators/public.decorator';\n\n@Injectable()\nexport class JwtAuthGuard extends AuthGuard('jwt') {\n  constructor(private readonly reflector: Reflector) {\n    super();\n  }\n\n  canActivate(\n    context: ExecutionContext,\n  ): boolean | Promise\u003Cboolean\u003E | Observable\u003Cboolean\u003E {\n    const isPublic = this.reflector.getAllAndOverride\u003Cboolean\u003E(IS_PUBLIC_KEY, [\n      context.getHandler(),\n      context.getClass(),\n    ]);\n    if (isPublic) {\n      return true;\n    }\n\n    return super.canActivate(context);\n  }\n\n  handleRequest\u003CTUser = AuthUser\u003E(\n    err: unknown,\n    user: AuthUser | undefined,\n  ): TUser {\n    if (err || !user) {\n      throw new UnauthorizedException(PtBrMessages.auth.unauthenticated);\n    }\n    return user as TUser;\n  }\n}\n","backend/src/modules/auth/presentation/guards/roles.guard.ts":"import {\n  CanActivate,\n  ExecutionContext,\n  ForbiddenException,\n  Injectable,\n} from '@nestjs/common';\nimport { Reflector } from '@nestjs/core';\nimport { PtBrMessages } from '../../../../shared/messages/pt-br.messages';\nimport type { AuthUser } from '../../domain/auth-user.type';\nimport type { AppRole } from '../../domain/role.type';\nimport { ROLES_KEY } from '../decorators/roles.decorator';\n\n@Injectable()\nexport class RolesGuard implements CanActivate {\n  constructor(private readonly reflector: Reflector) {}\n\n  canActivate(context: ExecutionContext): boolean {\n    const requiredRoles = this.reflector.getAllAndOverride\u003CAppRole[]\u003E(\n      ROLES_KEY,\n      [context.getHandler(), context.getClass()],\n    );\n\n    if (!requiredRoles?.length) {\n      return true;\n    }\n\n    const request = context.switchToHttp().getRequest\u003C{ user?: AuthUser }\u003E();\n    const user = request.user;\n    if (!user || !requiredRoles.includes(user.role)) {\n      throw new ForbiddenException(PtBrMessages.auth.accessDenied403);\n    }\n\n    return true;\n  }\n}\n","backend/src/modules/health/health.controller.ts":"import { Controller, Get } from '@nestjs/common';\nimport { ApiOkResponse, ApiOperation, ApiTags } from '@nestjs/swagger';\nimport { Public } from '../auth/presentation/decorators/public.decorator';\n\n@ApiTags('Health')\n@Controller('health')\n/**\n *\n * EN: Health controller for liveness probing and container checks.\n *\n * PT: Controller de saude para verificacao de liveness e checagens de container.\n *\n * @params none\n * @returns Lightweight API status payload.\n */\nexport class HealthController {\n  /**\n   *\n   * EN: Returns API liveness metadata for monitoring and healthchecks.\n   *\n   * PT: Retorna metadados de disponibilidade da API para monitoramento e healthchecks.\n   *\n   * @params none\n   * @returns Service status payload with timestamp.\n   */\n  @Public()\n  @Get()\n  @ApiOperation({ summary: 'Verificar sa\u00fade da API' })\n  @ApiOkResponse({ description: 'API operacional' })\n  check() {\n    return {\n      status: 'ok',\n      service: 'energy-bill-ai-parser-backend',\n      timestamp: new Date().toISOString(),\n    };\n  }\n}\n","backend/src/modules/health/health.module.ts":"import { Module } from '@nestjs/common';\nimport { HealthController } from './health.controller';\n\n@Module({\n  controllers: [HealthController],\n})\nexport class HealthModule {}\n","backend/src/modules/invoices/invoices.module.ts":"import { Module } from '@nestjs/common';\nimport { ConfigService } from '@nestjs/config';\nimport { MulterModule } from '@nestjs/platform-express';\nimport { AuditModule } from '../audit/audit.module';\nimport { AuthModule } from '../auth/auth.module';\nimport { LlmModule } from '../llm/llm.module';\nimport { StorageModule } from '../storage/storage.module';\nimport { InvoicesQueryService } from './application/invoices-query.service';\nimport { ProcessInvoiceExtractionUseCase } from './application/process-invoice-extraction.use-case';\nimport { InvoicesController } from './presentation/invoices.controller';\nimport { resolvePdfMaxFileSizeBytes } from '../../shared/config/pdf-upload.config';\n\n@Module({\n  imports: [\n    AuthModule,\n    AuditModule,\n    LlmModule,\n    StorageModule,\n    MulterModule.registerAsync({\n      inject: [ConfigService],\n      useFactory: (configService: ConfigService) =\u003E ({\n        limits: {\n          fileSize: resolvePdfMaxFileSizeBytes(\n            configService.get\u003Cstring | number\u003E('PDF_MAX_FILE_SIZE_MB'),\n          ),\n        },\n      }),\n    }),\n  ],\n  controllers: [InvoicesController],\n  providers: [ProcessInvoiceExtractionUseCase, InvoicesQueryService],\n})\nexport class InvoicesModule {}\n","backend/src/modules/invoices/application/invoices-query.service.ts":"import { BadRequestException, Injectable } from '@nestjs/common';\nimport { ApiLogger } from '../../../shared/logging/api-logger';\nimport { PtBrMessages } from '../../../shared/messages/pt-br.messages';\nimport { PrismaService } from '../../../shared/prisma/prisma.service';\nimport type { AppRole } from '../../auth/domain/role.type';\nimport { toMonthKey } from './mes-referencia.util';\n\ntype ListInvoicesQuery = {\n  numeroCliente?: string;\n  mesReferencia?: string;\n  periodoInicio?: string;\n  periodoFim?: string;\n  page?: string;\n  pageSize?: string;\n  userId: string;\n  role: AppRole;\n};\n\n@Injectable()\n/**\n *\n * EN: Query-focused service for invoice listing and dashboard aggregation.\n *\n * PT: Servico focado em consultas de faturas e agregacao de dashboards.\n *\n * @params Query filters and authenticated user scope.\n * @returns Role-aware invoice and dashboard projections.\n */\nexport class InvoicesQueryService {\n  constructor(private readonly prisma: PrismaService) {}\n\n  /**\n   *\n   * EN: Returns paginated invoices respecting role-aware visibility rules.\n   *\n   * PT: Retorna faturas paginadas respeitando regras de visibilidade por papel.\n   *\n   * @params query Filters, pagination and authenticated user context.\n   * @returns Invoice list with metric relation included.\n   */\n  listInvoices(query: ListInvoicesQuery) {\n    ApiLogger.info({\n      context: 'InvoicesQueryService',\n      message: PtBrMessages.logs.invoicesQuery.listingInvoices,\n    });\n    const page = Math.max(1, Number.parseInt(query.page ?? '1', 10) || 1);\n    const pageSize = Math.min(\n      100,\n      Math.max(1, Number.parseInt(query.pageSize ?? '20', 10) || 20),\n    );\n    const periodoInicio = this.parsePeriodoInicio(query.periodoInicio);\n    const periodoFim = this.parsePeriodoFim(query.periodoFim);\n    this.ensurePeriodoRange(periodoInicio, periodoFim);\n    const shouldFilterByPeriod = periodoInicio !== null || periodoFim !== null;\n\n    if (!shouldFilterByPeriod) {\n      return this.prisma.invoice.findMany({\n        where: {\n          numeroCliente: query.numeroCliente,\n          mesReferencia: query.mesReferencia,\n          uploaderUserId: query.role === 'ADMIN' ? undefined : query.userId,\n        },\n        include: {\n          metrics: true,\n        },\n        orderBy: { createdAt: 'desc' },\n        skip: (page - 1) * pageSize,\n        take: pageSize,\n      });\n    }\n\n    return this.prisma.invoice\n      .findMany({\n        where: {\n          numeroCliente: query.numeroCliente,\n          mesReferencia: query.mesReferencia,\n          uploaderUserId: query.role === 'ADMIN' ? undefined : query.userId,\n        },\n        include: {\n          metrics: true,\n        },\n        orderBy: { createdAt: 'desc' },\n      })\n      .then((invoices) =\u003E\n        invoices\n          .filter((invoice) =\u003E\n            this.isInvoiceInsidePeriodo(\n              invoice.mesReferencia,\n              periodoInicio,\n              periodoFim,\n            ),\n          )\n          .slice((page - 1) * pageSize, page * pageSize),\n      );\n  }\n\n  async consolidatedDashboard(userId: string, role: AppRole) {\n    ApiLogger.info({\n      context: 'InvoicesQueryService',\n      message: PtBrMessages.logs.invoicesQuery.buildingConsolidatedDashboard,\n    });\n    const where =\n      role === 'ADMIN' ? {} : { invoice: { uploaderUserId: userId } };\n    const aggregate = await this.prisma.invoiceMetrics.aggregate({\n      where,\n      _sum: {\n        consumoEnergiaEletricaKwh: true,\n        energiaCompensadaKwh: true,\n        valorTotalSemGdRs: true,\n        economiaGdRs: true,\n      },\n    });\n\n    return {\n      consumoEnergiaEletricaKwh: Number(\n        aggregate._sum.consumoEnergiaEletricaKwh ?? 0,\n      ),\n      energiaCompensadaKwh: Number(aggregate._sum.energiaCompensadaKwh ?? 0),\n      valorTotalSemGdRs: Number(aggregate._sum.valorTotalSemGdRs ?? 0),\n      economiaGdRs: Number(aggregate._sum.economiaGdRs ?? 0),\n    };\n  }\n\n  /**\n   *\n   * EN: Aggregates energy dashboard values for current scope.\n   *\n   * PT: Agrega os valores do dashboard de energia no escopo atual.\n   *\n   * @params userId Authenticated user identifier.\n   * @params role Authenticated user role.\n   * @returns Consolidated energy indicators.\n   */\n  async energyDashboard(userId: string, role: AppRole) {\n    ApiLogger.info({\n      context: 'InvoicesQueryService',\n      message: PtBrMessages.logs.invoicesQuery.buildingEnergyDashboard,\n    });\n    const consolidated = await this.consolidatedDashboard(userId, role);\n\n    return {\n      consumoEnergiaEletricaKwh: consolidated.consumoEnergiaEletricaKwh,\n      energiaCompensadaKwh: consolidated.energiaCompensadaKwh,\n    };\n  }\n\n  /**\n   *\n   * EN: Aggregates financial dashboard values for current scope.\n   *\n   * PT: Agrega os valores do dashboard financeiro no escopo atual.\n   *\n   * @params userId Authenticated user identifier.\n   * @params role Authenticated user role.\n   * @returns Consolidated financial indicators.\n   */\n  async financialDashboard(userId: string, role: AppRole) {\n    ApiLogger.info({\n      context: 'InvoicesQueryService',\n      message: PtBrMessages.logs.invoicesQuery.buildingFinancialDashboard,\n    });\n    const consolidated = await this.consolidatedDashboard(userId, role);\n\n    return {\n      valorTotalSemGdRs: consolidated.valorTotalSemGdRs,\n      economiaGdRs: consolidated.economiaGdRs,\n    };\n  }\n\n  /**\n   *\n   * EN: Lists documents uploaded by the authenticated user.\n   *\n   * PT: Lista documentos enviados pelo usuario autenticado.\n   *\n   * @params userId Authenticated user identifier.\n   * @returns Document metadata collection.\n   */\n  listMyDocuments(userId: string) {\n    ApiLogger.info({\n      context: 'InvoicesQueryService',\n      message: PtBrMessages.logs.invoicesQuery.listingMyDocuments,\n    });\n    return this.prisma.storedDocument.findMany({\n      where: { uploaderUserId: userId },\n      orderBy: { createdAt: 'desc' },\n      select: {\n        id: true,\n        invoiceId: true,\n        fileName: true,\n        mimeType: true,\n        sizeBytes: true,\n        checksum: true,\n        createdAt: true,\n      },\n    });\n  }\n\n  private parsePeriodoInicio(value: string | undefined) {\n    if (!value) {\n      return null;\n    }\n    const parsed = toMonthKey(value);\n    if (parsed === null) {\n      throw new BadRequestException(PtBrMessages.invoices.invalidPeriodoInicio);\n    }\n    return parsed;\n  }\n\n  private parsePeriodoFim(value: string | undefined) {\n    if (!value) {\n      return null;\n    }\n    const parsed = toMonthKey(value);\n    if (parsed === null) {\n      throw new BadRequestException(PtBrMessages.invoices.invalidPeriodoFim);\n    }\n    return parsed;\n  }\n\n  private ensurePeriodoRange(\n    periodoInicio: number | null,\n    periodoFim: number | null,\n  ) {\n    if (\n      periodoInicio !== null \u0026\u0026\n      periodoFim !== null \u0026\u0026\n      periodoInicio \u003E periodoFim\n    ) {\n      throw new BadRequestException(PtBrMessages.invoices.invalidPeriodoRange);\n    }\n  }\n\n  private isInvoiceInsidePeriodo(\n    mesReferencia: string,\n    periodoInicio: number | null,\n    periodoFim: number | null,\n  ) {\n    const mesKey = toMonthKey(mesReferencia);\n    if (mesKey === null) {\n      return false;\n    }\n    if (periodoInicio !== null \u0026\u0026 mesKey \u003C periodoInicio) {\n      return false;\n    }\n    if (periodoFim !== null \u0026\u0026 mesKey \u003E periodoFim) {\n      return false;\n    }\n    return true;\n  }\n}\n","backend/src/modules/invoices/application/mes-referencia.util.ts":"const monthByAlias: Record\u003Cstring, number\u003E = {\n  jan: 1,\n  fev: 2,\n  mar: 3,\n  abr: 4,\n  mai: 5,\n  jun: 6,\n  jul: 7,\n  ago: 8,\n  set: 9,\n  out: 10,\n  nov: 11,\n  dez: 12,\n};\n\nfunction parseMonthToken(rawMonth: string): number | null {\n  const cleaned = rawMonth.trim().toLowerCase();\n\n  if (!cleaned) {\n    return null;\n  }\n\n  const numericMonth = Number.parseInt(cleaned, 10);\n  if (\n    Number.isInteger(numericMonth) \u0026\u0026\n    numericMonth \u003E= 1 \u0026\u0026\n    numericMonth \u003C= 12\n  ) {\n    return numericMonth;\n  }\n\n  return monthByAlias[cleaned.slice(0, 3)] ?? null;\n}\n\n/**\n * Parses month references from common invoice formats:\n * - MMM/YYYY (JAN/2024, set/2024)\n * - MM/YYYY (01/2024)\n * - YYYY-MM (2024-01)\n */\nexport function toMonthKey(value: string | undefined): number | null {\n  if (!value) {\n    return null;\n  }\n\n  const normalized = value.trim();\n  if (!normalized) {\n    return null;\n  }\n\n  const yearMonthFormat = /^(\\d{4})-(\\d{1,2})$/;\n  const slashFormat = /^([a-zA-Z]{3,}|\\d{1,2})\\/(\\d{4})$/;\n\n  const yearMonthMatch = normalized.match(yearMonthFormat);\n  if (yearMonthMatch) {\n    const year = Number.parseInt(yearMonthMatch[1], 10);\n    const month = Number.parseInt(yearMonthMatch[2], 10);\n    if (year \u003E= 1900 \u0026\u0026 month \u003E= 1 \u0026\u0026 month \u003C= 12) {\n      return year * 100 + month;\n    }\n    return null;\n  }\n\n  const slashMatch = normalized.match(slashFormat);\n  if (!slashMatch) {\n    return null;\n  }\n\n  const month = parseMonthToken(slashMatch[1]);\n  const year = Number.parseInt(slashMatch[2], 10);\n\n  if (!month || !Number.isInteger(year) || year \u003C 1900) {\n    return null;\n  }\n\n  return year * 100 + month;\n}\n","backend/src/modules/invoices/application/process-invoice-extraction.use-case.ts":"import {\n  Inject,\n  Injectable,\n  PayloadTooLargeException,\n  UnsupportedMediaTypeException,\n} from '@nestjs/common';\nimport { ConfigService } from '@nestjs/config';\nimport { randomUUID } from 'crypto';\nimport { AuditStatus, InvoiceStatus } from '@prisma/client';\nimport { computeInvoiceMetrics } from '../domain/contracts/invoice-extraction.contract';\nimport { LLM_EXTRACTOR_TOKEN } from '../../llm/llm-extractor.interface';\nimport type {\n  ExtractInvoiceInput,\n  ILlmExtractor,\n} from '../../llm/llm-extractor.interface';\nimport { ApiLogger } from '../../../shared/logging/api-logger';\nimport {\n  resolvePdfMaxFileSizeBytes,\n  resolvePdfMaxFileSizeMb,\n} from '../../../shared/config/pdf-upload.config';\nimport { PtBrMessages } from '../../../shared/messages/pt-br.messages';\nimport { PrismaService } from '../../../shared/prisma/prisma.service';\nimport { DOCUMENT_STORAGE_TOKEN } from '../../storage/domain/document-storage.port';\nimport { FileCryptoService } from '../../storage/application/file-crypto.service';\nimport { AuditService } from '../../audit/application/audit.service';\nimport type { DocumentStoragePort } from '../../storage/domain/document-storage.port';\n\ntype ProcessInvoiceExtractionInput = {\n  actorUserId: string;\n  fileName: string;\n  mimeType: string;\n  buffer: Buffer;\n  ip?: string;\n  userAgent?: string;\n};\n\n@Injectable()\n/**\n *\n * EN: Core invoice processing use-case orchestrating extraction, storage, persistence and auditing.\n *\n * PT: Caso de uso principal de processamento de fatura, orquestrando extracao, armazenamento, persistencia e auditoria.\n *\n * @params Extraction input with file payload and actor context.\n * @returns Persisted invoice response with computed metrics.\n */\nexport class ProcessInvoiceExtractionUseCase {\n  constructor(\n    @Inject(LLM_EXTRACTOR_TOKEN)\n    private readonly llmExtractor: ILlmExtractor,\n    private readonly configService: ConfigService,\n    private readonly prisma: PrismaService,\n    @Inject(DOCUMENT_STORAGE_TOKEN)\n    private readonly documentStorage: DocumentStoragePort,\n    private readonly fileCryptoService: FileCryptoService,\n    private readonly auditService: AuditService,\n  ) {}\n\n  /**\n   *\n   * EN: Processes a PDF invoice, extracts data with LLM, persists transactionally and writes audit.\n   *\n   * PT: Processa uma fatura PDF, extrai dados com LLM, persiste em transacao e registra auditoria.\n   *\n   * @params input Request data with actor, file metadata and binary payload.\n   * @returns Persisted identifiers, raw extraction payload and computed metrics.\n   */\n  async execute(input: ProcessInvoiceExtractionInput) {\n    const maxFileSizeRaw = this.configService.get\u003Cstring | number\u003E(\n      'PDF_MAX_FILE_SIZE_MB',\n    );\n    const maxFileSizeMb = resolvePdfMaxFileSizeMb(maxFileSizeRaw);\n    const maxFileSizeBytes = resolvePdfMaxFileSizeBytes(maxFileSizeRaw);\n\n    if (input.mimeType !== 'application/pdf') {\n      const message = PtBrMessages.invoices.unsupportedFileType(input.mimeType);\n      ApiLogger.logError({\n        path: 'invoice-extraction',\n        method: 'POST',\n        statusCode: 415,\n        message,\n      });\n      throw new UnsupportedMediaTypeException(\n        PtBrMessages.invoices.onlyPdfSupported,\n      );\n    }\n\n    if (input.buffer.length \u003E maxFileSizeBytes) {\n      const message = PtBrMessages.invoices.fileExceededMaxLimit(maxFileSizeMb);\n      ApiLogger.logError({\n        path: 'invoice-extraction',\n        method: 'POST',\n        statusCode: 413,\n        message,\n      });\n      throw new PayloadTooLargeException(message);\n    }\n\n    ApiLogger.info({\n      context: 'InvoiceExtraction',\n      message: PtBrMessages.logs.invoices.processingFile(input.fileName),\n    });\n\n    const encryptedContent = await this.fileCryptoService.encrypt(input.buffer);\n    const checksum = this.fileCryptoService.checksum(input.buffer);\n    const objectKey = `${input.actorUserId}/${Date.now()}-${randomUUID()}.jwe`;\n    let hasUploadedDocument = false;\n\n    await this.documentStorage.upload({\n      objectKey,\n      content: encryptedContent,\n      mimeType: 'application/jose',\n    });\n    hasUploadedDocument = true;\n\n    const extractorInput: ExtractInvoiceInput = {\n      fileName: input.fileName,\n      mimeType: 'application/pdf',\n      pdfBuffer: input.buffer,\n    };\n\n    try {\n      const extraction =\n        await this.llmExtractor.extractInvoiceData(extractorInput);\n      const metrics = computeInvoiceMetrics(extraction);\n      const provider = this.resolveProvider();\n\n      const persisted = await this.prisma.$transaction(async (tx) =\u003E {\n        const invoice = await tx.invoice.create({\n          data: {\n            uploaderUserId: input.actorUserId,\n            fileName: input.fileName,\n            status: InvoiceStatus.SUCCESS,\n            numeroCliente: extraction['N\u00ba DO CLIENTE'],\n            mesReferencia: extraction['M\u00eas de refer\u00eancia'],\n            energiaEletricaQuantidadeKwh:\n              extraction['Energia El\u00e9trica']['Quantidade (kWh)'],\n            energiaEletricaValorRs:\n              extraction['Energia El\u00e9trica']['Valor (R$)'],\n            energiaSceeSemIcmsQuantidadeKwh:\n              extraction['Energia SCEEE s/ICMS']['Quantidade (kWh)'],\n            energiaSceeSemIcmsValorRs:\n              extraction['Energia SCEEE s/ICMS']['Valor (R$)'],\n            energiaCompensadaGdiQuantidadeKwh:\n              extraction['Energia compensada GD I']['Quantidade (kWh)'],\n            energiaCompensadaGdiValorRs:\n              extraction['Energia compensada GD I']['Valor (R$)'],\n            contribIlumPublicaMunicipalValorRs:\n              extraction['Contrib Ilum Publica Municipal']['Valor (R$)'],\n            extractionProvider: provider,\n            rawExtractionJson: extraction,\n          },\n        });\n\n        await tx.invoiceMetrics.create({\n          data: {\n            invoiceId: invoice.id,\n            consumoEnergiaEletricaKwh: metrics.consumoEnergiaEletricaKwh,\n            energiaCompensadaKwh: metrics.energiaCompensadaKwh,\n            valorTotalSemGdRs: metrics.valorTotalSemGdRs,\n            economiaGdRs: metrics.economiaGdRs,\n          },\n        });\n\n        const storedDocument = await tx.storedDocument.create({\n          data: {\n            invoiceId: invoice.id,\n            uploaderUserId: input.actorUserId,\n            bucket:\n              this.configService.get\u003Cstring\u003E('S3_BUCKET') ?? 'energy-bills',\n            objectKey,\n            fileName: input.fileName,\n            mimeType: input.mimeType,\n            sizeBytes: input.buffer.length,\n            checksum,\n          },\n        });\n\n        return { invoice, storedDocument };\n      });\n\n      await this.auditService.write({\n        actorUserId: input.actorUserId,\n        action: 'INVOICE_UPLOAD_PROCESS',\n        resourceType: 'INVOICE',\n        resourceId: persisted.invoice.id,\n        status: AuditStatus.SUCCESS,\n        message: PtBrMessages.invoices.invoiceProcessed,\n        meta: {\n          fileName: input.fileName,\n          provider,\n          documentId: persisted.storedDocument.id,\n        },\n        ip: input.ip,\n        userAgent: input.userAgent,\n      });\n\n      return {\n        invoiceId: persisted.invoice.id,\n        documentId: persisted.storedDocument.id,\n        extraction,\n        metrics,\n      };\n    } catch (error) {\n      if (hasUploadedDocument) {\n        try {\n          await this.documentStorage.remove(objectKey);\n        } catch {\n          ApiLogger.warning({\n            context: 'InvoiceExtraction',\n            message: PtBrMessages.invoices.failedRollbackFileRemoval,\n          });\n        }\n      }\n\n      await this.auditService.write({\n        actorUserId: input.actorUserId,\n        action: 'INVOICE_UPLOAD_PROCESS',\n        resourceType: 'INVOICE',\n        status: AuditStatus.ERROR,\n        message: PtBrMessages.invoices.failedToProcessInvoice,\n        meta: {\n          fileName: input.fileName,\n          error:\n            error instanceof Error\n              ? error.message\n              : PtBrMessages.common.unknownError,\n        },\n        ip: input.ip,\n        userAgent: input.userAgent,\n      });\n\n      ApiLogger.logError({\n        path: 'invoice-extraction',\n        method: 'POST',\n        statusCode: 500,\n        message: PtBrMessages.invoices.failedToProcessInvoice,\n        error: error,\n      });\n\n      throw error;\n    }\n  }\n\n  /**\n   *\n   * EN: Resolves extraction provider based on environment strategy.\n   *\n   * PT: Resolve o provider de extracao com base na estrategia de ambiente.\n   *\n   * @params none\n   * @returns Provider key used to identify extraction origin.\n   */\n  private resolveProvider() {\n    const openSourceIa =\n      this.configService.get\u003Cstring\u003E('OPEN_SOURCE_IA')?.toLowerCase() ===\n      'true';\n    if (openSourceIa) {\n      return 'ollama';\n    }\n\n    return this.configService.get\u003Cstring\u003E('LLM_PROVIDER') ?? 'openai';\n  }\n}\n","backend/src/modules/invoices/domain/contracts/invoice-extraction.contract.ts":"import { z } from 'zod';\n\nconst numericField = z.number().finite();\n\nexport const invoiceExtractionSchema = z.object({\n  'N\u00ba DO CLIENTE': z.string().min(1),\n  'M\u00eas de refer\u00eancia': z.string().min(1),\n  'Energia El\u00e9trica': z.object({\n    'Quantidade (kWh)': numericField,\n    'Valor (R$)': numericField,\n  }),\n  'Energia SCEEE s/ICMS': z.object({\n    'Quantidade (kWh)': numericField,\n    'Valor (R$)': numericField,\n  }),\n  'Energia compensada GD I': z.object({\n    'Quantidade (kWh)': numericField,\n    'Valor (R$)': numericField,\n  }),\n  'Contrib Ilum Publica Municipal': z.object({\n    'Valor (R$)': numericField,\n  }),\n});\n\nexport type InvoiceExtraction = z.infer\u003Ctypeof invoiceExtractionSchema\u003E;\n\nexport type InvoiceComputedMetrics = {\n  consumoEnergiaEletricaKwh: number;\n  energiaCompensadaKwh: number;\n  valorTotalSemGdRs: number;\n  economiaGdRs: number;\n};\n\nexport const invoiceExtractionReferenceSchema = z.object({\n  requiredFields: z.array(z.string().min(1)).min(1),\n  businessRules: z.object({\n    consumoEnergiaEletricaKwh: z.string().min(1),\n    energiaCompensadaKwh: z.string().min(1),\n    valorTotalSemGdRs: z.string().min(1),\n    economiaGdRs: z.string().min(1),\n  }),\n});\n\nexport type InvoiceExtractionReference = z.infer\u003C\n  typeof invoiceExtractionReferenceSchema\n\u003E;\n\nexport const DEFAULT_INVOICE_EXTRACTION_REFERENCE: InvoiceExtractionReference =\n  {\n    requiredFields: [\n      '\"N\u00ba DO CLIENTE\" (Ex: 7202210726)',\n      '\"M\u00eas de refer\u00eancia\" (Ex: SET/2024)',\n      \"'Energia El\u00e9trica' - Quantidade (kWh) e Valor (R$)\",\n      \"'Energia SCEEE s/ICMS' - Quantidade (kWh) e Valor (R$)\",\n      \"'Energia compensada GD I' - Quantidade (kWh) e Valor (R$)\",\n      \"'Contrib Ilum Publica Municipal' - Valor (R$)\",\n    ],\n    businessRules: {\n      consumoEnergiaEletricaKwh:\n        \"'Energia El\u00e9trica' Quantidade (kWh) + 'Energia SCEEE s/ICMS' Quantidade (kWh)\",\n      energiaCompensadaKwh: \"'Energia compensada GD I' Quantidade (kWh)\",\n      valorTotalSemGdRs:\n        \"'Energia El\u00e9trica' Valor (R$) + 'Energia SCEEE s/ICMS' Valor (R$) + 'Contrib Ilum Publica Municipal' Valor (R$)\",\n      economiaGdRs: \"'Energia compensada GD I' Valor (R$)\",\n    },\n  };\n\nexport const DEFAULT_INVOICE_EXTRACTION_PROMPT = `\nVoc\u00ea \u00e9 um extrator de dados de fatura de energia el\u00e9trica. Seu objetivo \u00e9 realizar a an\u00e1lise multimodal do documento PDF fornecido e extrair os dados estruturados.\nRetorne um objeto JSON estrito (JSON Mode/Structured Output) contendo EXATAMENTE as informa\u00e7\u00f5es abaixo (respeite as chaves textualmente):\n\n- \"N\u00ba DO CLIENTE\"\n- \"M\u00eas de refer\u00eancia\"\n- \"Energia El\u00e9trica\": com os campos \"Quantidade (kWh)\" e \"Valor (R$)\"\n- \"Energia SCEEE s/ICMS\": com os campos \"Quantidade (kWh)\" e \"Valor (R$)\"\n- \"Energia compensada GD I\": com os campos \"Quantidade (kWh)\" e \"Valor (R$)\"\n- \"Contrib Ilum Publica Municipal\": com o campo \"Valor (R$)\"\n\nN\u00e3o invente valores. Se um campo n\u00e3o existir no documento, retorne 0 para campos num\u00e9ricos e string vazia para texto.\nO JSON retornado deve ter esta exata estrutura e nomenclaturas.\n`.trim();\n\nexport const DEFAULT_INVOICE_EXTRACTION_CONTEXT =\n  'Analise o arquivo PDF \"{{fileName}}\" anexado e retorne SOMENTE um JSON v\u00e1lido.';\n\nexport function resolveInvoiceExtractionReference(\n  rawReference?: string,\n): InvoiceExtractionReference {\n  if (!rawReference) {\n    return DEFAULT_INVOICE_EXTRACTION_REFERENCE;\n  }\n\n  try {\n    const parsedReference = JSON.parse(rawReference) as unknown;\n    return invoiceExtractionReferenceSchema.parse(parsedReference);\n  } catch {\n    return DEFAULT_INVOICE_EXTRACTION_REFERENCE;\n  }\n}\n\nexport function resolveInvoiceExtractionPrompt(rawPrompt?: string): string {\n  const prompt = rawPrompt?.trim();\n  if (!prompt) {\n    return DEFAULT_INVOICE_EXTRACTION_PROMPT;\n  }\n\n  return prompt;\n}\n\nexport function resolveInvoiceExtractionContext(rawContext?: string): string {\n  const context = rawContext?.trim();\n  if (!context) {\n    return DEFAULT_INVOICE_EXTRACTION_CONTEXT;\n  }\n\n  return context;\n}\n\nexport function computeInvoiceMetrics(\n  extraction: InvoiceExtraction,\n): InvoiceComputedMetrics {\n  const consumoEnergiaEletricaKwh =\n    extraction['Energia El\u00e9trica']['Quantidade (kWh)'] +\n    extraction['Energia SCEEE s/ICMS']['Quantidade (kWh)'];\n\n  const energiaCompensadaKwh =\n    extraction['Energia compensada GD I']['Quantidade (kWh)'];\n\n  const valorTotalSemGdRs =\n    extraction['Energia El\u00e9trica']['Valor (R$)'] +\n    extraction['Energia SCEEE s/ICMS']['Valor (R$)'] +\n    extraction['Contrib Ilum Publica Municipal']['Valor (R$)'];\n\n  const economiaGdRs = extraction['Energia compensada GD I']['Valor (R$)'];\n\n  return {\n    consumoEnergiaEletricaKwh,\n    energiaCompensadaKwh,\n    valorTotalSemGdRs,\n    economiaGdRs,\n  };\n}\n","backend/src/modules/invoices/presentation/invoices.controller.ts":"import {\n  BadRequestException,\n  Controller,\n  Get,\n  Ip,\n  Post,\n  Query,\n  Req,\n  UploadedFile,\n  UseInterceptors,\n  UseGuards,\n} from '@nestjs/common';\nimport { FileInterceptor } from '@nestjs/platform-express';\nimport { ProcessInvoiceExtractionUseCase } from '../application/process-invoice-extraction.use-case';\nimport { ApiLogger } from '../../../shared/logging/api-logger';\nimport { JwtAuthGuard } from '../../auth/presentation/guards/jwt-auth.guard';\nimport { RolesGuard } from '../../auth/presentation/guards/roles.guard';\nimport { CurrentUser } from '../../auth/presentation/decorators/current-user.decorator';\nimport type { AuthUser } from '../../auth/domain/auth-user.type';\nimport type { Request } from 'express';\nimport { InvoicesQueryService } from '../application/invoices-query.service';\nimport { PtBrMessages } from '../../../shared/messages/pt-br.messages';\nimport {\n  ApiBearerAuth,\n  ApiBody,\n  ApiConsumes,\n  ApiOkResponse,\n  ApiOperation,\n  ApiQuery,\n  ApiTags,\n} from '@nestjs/swagger';\n\ntype UploadedPdfFile = {\n  originalname: string;\n  mimetype: string;\n  buffer: Buffer;\n};\n\n@UseGuards(JwtAuthGuard, RolesGuard)\n@ApiTags('Invoices')\n@ApiBearerAuth()\n@Controller('invoices')\n/**\n *\n * EN: Invoices controller for upload, query and dashboard endpoints.\n *\n * PT: Controller de faturas para endpoints de upload, consulta e dashboards.\n *\n * @params Request decorators and DTO/query payloads from HTTP layer.\n * @returns Standardized API responses from invoice application services.\n */\nexport class InvoicesController {\n  constructor(\n    private readonly processInvoiceExtractionUseCase: ProcessInvoiceExtractionUseCase,\n    private readonly invoicesQueryService: InvoicesQueryService,\n  ) {}\n\n  /**\n   *\n   * EN: Receives invoice PDF upload and starts extraction workflow.\n   *\n   * PT: Recebe upload de fatura PDF e inicia o fluxo de extracao.\n   *\n   * @params file Uploaded file descriptor from multipart request.\n   * @params user Authenticated user context.\n   * @params ip Request IP address.\n   * @params request Raw request metadata.\n   * @returns Extraction output and persisted identifiers.\n   */\n  @Post('extract')\n  @UseInterceptors(FileInterceptor('file'))\n  @ApiOperation({ summary: 'Enviar PDF e processar extra\u00e7\u00e3o da fatura' })\n  @ApiConsumes('multipart/form-data')\n  @ApiBody({\n    schema: {\n      type: 'object',\n      required: ['file'],\n      properties: {\n        file: { type: 'string', format: 'binary' },\n      },\n    },\n  })\n  @ApiOkResponse({ description: 'Fatura processada com sucesso' })\n  async extractInvoice(\n    @UploadedFile() file: UploadedPdfFile | undefined,\n    @CurrentUser() user: AuthUser,\n    @Ip() ip: string,\n    @Req() request: Request,\n  ) {\n    if (!file) {\n      const message = PtBrMessages.invoices.uploadFileRequired;\n      ApiLogger.logError({\n        path: '/api/invoices/extract',\n        method: 'POST',\n        statusCode: 400,\n        message,\n      });\n      throw new BadRequestException(message);\n    }\n\n    return this.processInvoiceExtractionUseCase.execute({\n      actorUserId: user.sub,\n      fileName: file.originalname,\n      mimeType: file.mimetype,\n      buffer: file.buffer,\n      ip,\n      userAgent: this.normalizeUserAgent(request.headers['user-agent']),\n    });\n  }\n\n  @Get()\n  @ApiOperation({ summary: 'Listar faturas com filtros' })\n  @ApiQuery({ name: 'numeroCliente', required: false })\n  @ApiQuery({ name: 'mesReferencia', required: false })\n  @ApiQuery({ name: 'periodoInicio', required: false })\n  @ApiQuery({ name: 'periodoFim', required: false })\n  @ApiQuery({ name: 'page', required: false })\n  @ApiQuery({ name: 'pageSize', required: false })\n  @ApiOkResponse({ description: 'Lista de faturas retornada com sucesso' })\n  listInvoices(\n    @CurrentUser() user: AuthUser,\n    @Query('numeroCliente') numeroCliente?: string,\n    @Query('mesReferencia') mesReferencia?: string,\n    @Query('periodoInicio') periodoInicio?: string,\n    @Query('periodoFim') periodoFim?: string,\n    @Query('page') page?: string,\n    @Query('pageSize') pageSize?: string,\n  ) {\n    return this.invoicesQueryService.listInvoices({\n      numeroCliente,\n      mesReferencia,\n      periodoInicio,\n      periodoFim,\n      page,\n      pageSize,\n      userId: user.sub,\n      role: user.role,\n    });\n  }\n\n  @Get('dashboard/consolidated')\n  @ApiOperation({\n    summary: 'Consultar dashboard consolidado (energia + financeiro)',\n  })\n  @ApiOkResponse({ description: 'Dashboard consolidado retornado com sucesso' })\n  consolidatedDashboard(@CurrentUser() user: AuthUser) {\n    return this.invoicesQueryService.consolidatedDashboard(user.sub, user.role);\n  }\n\n  @Get('dashboard/energy')\n  @ApiOperation({ summary: 'Consultar dashboard de energia (kWh)' })\n  @ApiOkResponse({ description: 'Dashboard de energia retornado com sucesso' })\n  energyDashboard(@CurrentUser() user: AuthUser) {\n    return this.invoicesQueryService.energyDashboard(user.sub, user.role);\n  }\n\n  @Get('dashboard/financial')\n  @ApiOperation({ summary: 'Consultar dashboard financeiro (R$)' })\n  @ApiOkResponse({\n    description: 'Dashboard financeiro retornado com sucesso',\n  })\n  financialDashboard(@CurrentUser() user: AuthUser) {\n    return this.invoicesQueryService.financialDashboard(user.sub, user.role);\n  }\n\n  @Get('my-documents')\n  @ApiOperation({ summary: 'Listar documentos do usu\u00e1rio autenticado' })\n  @ApiOkResponse({ description: 'Documentos retornados com sucesso' })\n  myDocuments(@CurrentUser() user: AuthUser) {\n    return this.invoicesQueryService.listMyDocuments(user.sub);\n  }\n\n  private normalizeUserAgent(userAgent: string | string[] | undefined) {\n    if (Array.isArray(userAgent)) {\n      return userAgent[0];\n    }\n\n    return userAgent;\n  }\n}\n","backend/src/modules/llm/llm-extractor.interface.ts":"import { InvoiceExtraction } from '../invoices/domain/contracts/invoice-extraction.contract';\n\nexport type LlmProvider = 'ollama' | 'openai' | 'gemini' | 'google' | 'claude';\n\nexport type ExtractInvoiceInput = {\n  pdfBuffer: Buffer;\n  mimeType: 'application/pdf';\n  fileName: string;\n};\n\nexport interface ILlmExtractor {\n  extractInvoiceData(input: ExtractInvoiceInput): Promise\u003CInvoiceExtraction\u003E;\n}\n\nexport const LLM_EXTRACTOR_TOKEN = Symbol('LLM_EXTRACTOR_TOKEN');\n","backend/src/modules/llm/llm.module.ts":"import { Module, ServiceUnavailableException } from '@nestjs/common';\nimport { ConfigService } from '@nestjs/config';\nimport {\n  ILlmExtractor,\n  LLM_EXTRACTOR_TOKEN,\n  LlmProvider,\n} from './llm-extractor.interface';\nimport {\n  resolveInvoiceExtractionContext,\n  resolveInvoiceExtractionPrompt,\n  resolveInvoiceExtractionReference,\n} from '../invoices/domain/contracts/invoice-extraction.contract';\nimport { ApiLogger } from '../../shared/logging/api-logger';\nimport { PtBrMessages } from '../../shared/messages/pt-br.messages';\nimport { ClaudeExtractor } from './infrastructure/providers/claude-extractor';\nimport { GeminiExtractor } from './infrastructure/providers/gemini-extractor';\nimport { OllamaExtractor } from './infrastructure/providers/ollama-extractor';\nimport { OpenAiExtractor } from './infrastructure/providers/openai-extractor';\n\nfunction getRequiredConfigValue(\n  configService: ConfigService,\n  key: string,\n  provider: LlmProvider,\n): string {\n  const value = configService.get\u003Cstring\u003E(key);\n  if (!value) {\n    const message = PtBrMessages.llm.missingConfiguration(key, provider);\n    ApiLogger.logError({\n      path: 'llm-module',\n      method: 'SYSTEM',\n      statusCode: 503,\n      message,\n    });\n    throw new ServiceUnavailableException(message);\n  }\n\n  return value;\n}\n\n@Module({\n  providers: [\n    {\n      provide: LLM_EXTRACTOR_TOKEN,\n      inject: [ConfigService],\n      useFactory: (configService: ConfigService): ILlmExtractor =\u003E {\n        const openSourceIa =\n          configService.get\u003Cstring\u003E('OPEN_SOURCE_IA')?.toLowerCase() === 'true';\n        const provider = openSourceIa\n          ? 'ollama'\n          : (configService.get\u003CLlmProvider\u003E('LLM_PROVIDER') ?? 'openai');\n        const rollbackOnInvoiceFailure =\n          configService.get\u003Cstring\u003E('ROLLBACK_ON_INVOICE_FAILURE') !== 'false';\n        const extractionReference = resolveInvoiceExtractionReference(\n          configService.get\u003Cstring\u003E('INVOICE_EXTRACTION_REFERENCE'),\n        );\n        const extractionPrompt = resolveInvoiceExtractionPrompt(\n          configService.get\u003Cstring\u003E('INVOICE_EXTRACTION_PROMPT'),\n        );\n        const extractionContext = resolveInvoiceExtractionContext(\n          configService.get\u003Cstring\u003E('INVOICE_EXTRACTION_CONTEXT'),\n        );\n\n        ApiLogger.info({\n          context: 'LLM',\n          message: PtBrMessages.logs.llm.providerSelected(\n            provider,\n            rollbackOnInvoiceFailure,\n          ),\n        });\n\n        if (provider === 'ollama') {\n          return new OllamaExtractor({\n            baseUrl:\n              configService.get\u003Cstring\u003E('OLLAMA_BASE_URL') ??\n              'http://localhost:11434',\n            model:\n              configService.get\u003Cstring\u003E('OLLAMA_MODEL') ?? 'llama3.2-vision',\n            extractionReference,\n            extractionPrompt,\n            extractionContext,\n          });\n        }\n\n        if (provider === 'openai') {\n          return new OpenAiExtractor({\n            apiKey: getRequiredConfigValue(\n              configService,\n              'OPENAI_API_KEY',\n              provider,\n            ),\n            model: configService.get\u003Cstring\u003E('OPENAI_MODEL') ?? 'gpt-4.1-mini',\n            baseUrl:\n              configService.get\u003Cstring\u003E('OPENAI_BASE_URL') ??\n              'https://api.openai.com/v1',\n            extractionReference,\n            extractionPrompt,\n            extractionContext,\n          });\n        }\n\n        if (provider === 'gemini' || provider === 'google') {\n          return new GeminiExtractor({\n            apiKey: getRequiredConfigValue(\n              configService,\n              'GEMINI_API_KEY',\n              provider,\n            ),\n            model:\n              configService.get\u003Cstring\u003E('GEMINI_MODEL') ?? 'gemini-1.5-flash',\n            baseUrl:\n              configService.get\u003Cstring\u003E('GEMINI_BASE_URL') ??\n              'https://generativelanguage.googleapis.com/v1beta',\n            extractionReference,\n            extractionPrompt,\n            extractionContext,\n          });\n        }\n\n        if (provider === 'claude') {\n          return new ClaudeExtractor({\n            apiKey: getRequiredConfigValue(\n              configService,\n              'ANTHROPIC_API_KEY',\n              provider,\n            ),\n            model:\n              configService.get\u003Cstring\u003E('ANTHROPIC_MODEL') ??\n              'claude-3-5-sonnet-latest',\n            baseUrl:\n              configService.get\u003Cstring\u003E('ANTHROPIC_BASE_URL') ??\n              'https://api.anthropic.com/v1',\n            extractionReference,\n            extractionPrompt,\n            extractionContext,\n          });\n        }\n\n        ApiLogger.logError({\n          path: 'llm-module',\n          method: 'SYSTEM',\n          statusCode: 503,\n          message: PtBrMessages.llm.unsupportedProvider,\n        });\n        throw new ServiceUnavailableException(\n          PtBrMessages.llm.unsupportedProvider,\n        );\n      },\n    },\n  ],\n  exports: [LLM_EXTRACTOR_TOKEN],\n})\nexport class LlmModule {}\n","backend/src/modules/llm/application/extraction-instructions.ts":"import { InvoiceExtractionReference } from '../../invoices/domain/contracts/invoice-extraction.contract';\n\ntype BuildExtractionInstructionsInput = {\n  extractionPrompt: string;\n  extractionReference: InvoiceExtractionReference;\n};\n\ntype BuildExtractionContextInput = {\n  extractionContext: string;\n  fileName: string;\n  includeBase64Data?: boolean;\n  pdfBase64?: string;\n};\n\nexport function buildExtractionInstructions(\n  input: BuildExtractionInstructionsInput,\n): string {\n  const referenceJson = JSON.stringify(input.extractionReference, null, 2);\n  return `\n${input.extractionPrompt}\n\nUse esta refer\u00eancia de campos e regras:\n${referenceJson}\n\nRegras obrigat\u00f3rias de sa\u00edda:\n- Retorne apenas JSON puro (sem markdown e sem coment\u00e1rios).\n- Respeite exatamente os nomes dos campos.\n- Use n\u00fameros para kWh e valores monet\u00e1rios.\n`.trim();\n}\n\nexport function buildExtractionContext(\n  input: BuildExtractionContextInput,\n): string {\n  const template = input.extractionContext.replaceAll(\n    '{{fileName}}',\n    input.fileName,\n  );\n  if (!input.includeBase64Data) {\n    return template;\n  }\n\n  const encodedPdf = input.pdfBase64 ?? '';\n  return `${template}\\n\\nPDF_BASE64:\\n${encodedPdf}`.trim();\n}\n","backend/src/modules/llm/application/extraction-response.parser.ts":"import { BadGatewayException } from '@nestjs/common';\nimport {\n  InvoiceExtraction,\n  invoiceExtractionSchema,\n} from '../../invoices/domain/contracts/invoice-extraction.contract';\nimport { ApiLogger } from '../../../shared/logging/api-logger';\nimport { PtBrMessages } from '../../../shared/messages/pt-br.messages';\n\nfunction extractJsonFromMarkdown(raw: string): string {\n  const fencedJsonMatch = raw.match(/```json\\s*([\\s\\S]*?)\\s*```/i);\n  if (fencedJsonMatch?.[1]) {\n    return fencedJsonMatch[1].trim();\n  }\n\n  const fencedMatch = raw.match(/```\\s*([\\s\\S]*?)\\s*```/i);\n  if (fencedMatch?.[1]) {\n    return fencedMatch[1].trim();\n  }\n\n  return raw.trim();\n}\n\nfunction extractJsonByBraces(raw: string): string {\n  const start = raw.indexOf('{');\n  const end = raw.lastIndexOf('}');\n  if (start \u003C 0 || end \u003C= start) {\n    return raw;\n  }\n  return raw.slice(start, end + 1);\n}\n\nexport function parseInvoiceExtractionFromText(\n  rawText: string,\n): InvoiceExtraction {\n  const sanitized = extractJsonFromMarkdown(rawText);\n  const jsonCandidate = extractJsonByBraces(sanitized);\n\n  try {\n    const parsed = JSON.parse(jsonCandidate) as unknown;\n    return invoiceExtractionSchema.parse(parsed);\n  } catch (error) {\n    const message =\n      error instanceof Error ? error.message : PtBrMessages.common.unknownError;\n    ApiLogger.logError({\n      path: 'llm-parser',\n      method: 'SYSTEM',\n      statusCode: 502,\n      message,\n    });\n    throw new BadGatewayException(PtBrMessages.llm.invalidExtractionPayload);\n  }\n}\n","backend/src/modules/llm/application/pdf-to-image.ts":"import { fromBuffer } from 'pdf2pic';\n\nexport async function convertPdfToImageBase64(\n  pdfBuffer: Buffer,\n): Promise\u003Cstring\u003E {\n  const options = {\n    density: 300,\n    saveFilename: 'page',\n    savePath: '/tmp',\n    format: 'png',\n    width: 2480, // A4 width at 300 DPI\n    height: 3508, // A4 height at 300 DPI\n  };\n\n  const convert = fromBuffer(pdfBuffer, options);\n  const result = await convert(1, { responseType: 'base64' });\n\n  if (!result || !result.base64) {\n    throw new Error('Falha ao converter PDF para imagem Base64.');\n  }\n\n  return result.base64;\n}\n","backend/src/modules/llm/infrastructure/providers/claude-extractor.ts":"import { BadGatewayException } from '@nestjs/common';\nimport {\n  InvoiceExtraction,\n  InvoiceExtractionReference,\n} from '../../../invoices/domain/contracts/invoice-extraction.contract';\nimport { ApiLogger } from '../../../../shared/logging/api-logger';\nimport { PtBrMessages } from '../../../../shared/messages/pt-br.messages';\nimport {\n  buildExtractionContext,\n  buildExtractionInstructions,\n} from '../../application/extraction-instructions';\nimport { parseInvoiceExtractionFromText } from '../../application/extraction-response.parser';\nimport {\n  ExtractInvoiceInput,\n  ILlmExtractor,\n} from '../../llm-extractor.interface';\n\ntype ClaudeExtractorConfig = {\n  apiKey: string;\n  model: string;\n  baseUrl: string;\n  extractionReference: InvoiceExtractionReference;\n  extractionPrompt: string;\n  extractionContext: string;\n};\n\nexport class ClaudeExtractor implements ILlmExtractor {\n  constructor(private readonly config: ClaudeExtractorConfig) {}\n\n  async extractInvoiceData(\n    input: ExtractInvoiceInput,\n  ): Promise\u003CInvoiceExtraction\u003E {\n    const prompt = buildExtractionInstructions({\n      extractionPrompt: this.config.extractionPrompt,\n      extractionReference: this.config.extractionReference,\n    });\n    const userContext = buildExtractionContext({\n      extractionContext: this.config.extractionContext,\n      fileName: input.fileName,\n    });\n\n    const response = await fetch(`${this.config.baseUrl}/messages`, {\n      method: 'POST',\n      headers: {\n        'Content-Type': 'application/json',\n        'x-api-key': this.config.apiKey,\n        'anthropic-version': '2023-06-01',\n      },\n      body: JSON.stringify({\n        model: this.config.model,\n        max_tokens: 2048,\n        system: prompt,\n        messages: [\n          {\n            role: 'user',\n            content: [\n              {\n                type: 'document',\n                source: {\n                  type: 'base64',\n                  media_type: input.mimeType,\n                  data: input.pdfBuffer.toString('base64'),\n                },\n              },\n              {\n                type: 'text',\n                text: userContext,\n              },\n            ],\n          },\n        ],\n      }),\n    });\n\n    if (!response.ok) {\n      const body = await response.text();\n      const requestFailedMessage = PtBrMessages.llm.requestFailed('claude');\n      ApiLogger.logError({\n        path: 'claude',\n        method: 'POST',\n        statusCode: response.status,\n        message: body || requestFailedMessage,\n      });\n      throw new BadGatewayException(requestFailedMessage);\n    }\n\n    const payload = (await response.json()) as {\n      content?: Array\u003C{ type?: string; text?: string }\u003E;\n    };\n    const textContent = payload.content?.find(\n      (part) =\u003E part.type === 'text',\n    )?.text;\n    if (!textContent) {\n      const emptyResponseMessage = PtBrMessages.llm.emptyResponse('claude');\n      ApiLogger.logError({\n        path: 'claude',\n        method: 'POST',\n        statusCode: 502,\n        message: emptyResponseMessage,\n      });\n      throw new BadGatewayException(emptyResponseMessage);\n    }\n\n    return parseInvoiceExtractionFromText(textContent);\n  }\n}\n","backend/src/modules/llm/infrastructure/providers/gemini-extractor.ts":"import { BadGatewayException } from '@nestjs/common';\nimport {\n  InvoiceExtraction,\n  InvoiceExtractionReference,\n} from '../../../invoices/domain/contracts/invoice-extraction.contract';\nimport { ApiLogger } from '../../../../shared/logging/api-logger';\nimport { PtBrMessages } from '../../../../shared/messages/pt-br.messages';\nimport {\n  buildExtractionContext,\n  buildExtractionInstructions,\n} from '../../application/extraction-instructions';\nimport { parseInvoiceExtractionFromText } from '../../application/extraction-response.parser';\nimport {\n  ExtractInvoiceInput,\n  ILlmExtractor,\n} from '../../llm-extractor.interface';\n\ntype GeminiExtractorConfig = {\n  apiKey: string;\n  model: string;\n  baseUrl: string;\n  extractionReference: InvoiceExtractionReference;\n  extractionPrompt: string;\n  extractionContext: string;\n};\n\nexport class GeminiExtractor implements ILlmExtractor {\n  private readonly fallbackModels = [\n    'gemini-2.5-flash',\n    'gemini-flash-latest',\n    'gemini-2.0-flash',\n    'gemini-2.0-flash-001',\n    'gemini-2.0-flash-lite',\n    'gemini-2.0-flash-lite-001',\n    'gemini-1.5-flash-latest',\n    'gemini-1.5-flash',\n    'gemini-1.5-pro-latest',\n  ];\n\n  constructor(private readonly config: GeminiExtractorConfig) {}\n\n  async extractInvoiceData(\n    input: ExtractInvoiceInput,\n  ): Promise\u003CInvoiceExtraction\u003E {\n    const prompt = buildExtractionInstructions({\n      extractionPrompt: this.config.extractionPrompt,\n      extractionReference: this.config.extractionReference,\n    });\n    const userContext = buildExtractionContext({\n      extractionContext: this.config.extractionContext,\n      fileName: input.fileName,\n    });\n\n    let lastErrorBody = '';\n    let lastStatusCode = 502;\n\n    for (const model of this.resolveModelAttempts()) {\n      const response = await fetch(\n        `${this.config.baseUrl}/models/${model}:generateContent?key=${this.config.apiKey}`,\n        {\n          method: 'POST',\n          headers: {\n            'Content-Type': 'application/json',\n          },\n          body: JSON.stringify({\n            generationConfig: {\n              responseMimeType: 'application/json',\n            },\n            contents: [\n              {\n                role: 'user',\n                parts: [\n                  { text: `${prompt}\\n\\n${userContext}` },\n                  {\n                    inlineData: {\n                      mimeType: input.mimeType,\n                      data: input.pdfBuffer.toString('base64'),\n                    },\n                  },\n                ],\n              },\n            ],\n          }),\n        },\n      );\n\n      if (!response.ok) {\n        lastStatusCode = response.status;\n        lastErrorBody = await response.text();\n\n        if (response.status === 404) {\n          ApiLogger.warning({\n            context: 'gemini',\n            message: `Modelo ${model} indisponivel para generateContent. Tentando fallback.`,\n          });\n          continue;\n        }\n\n        const requestFailedMessage = PtBrMessages.llm.requestFailed('gemini');\n        ApiLogger.logError({\n          path: 'gemini',\n          method: 'POST',\n          statusCode: response.status,\n          message: lastErrorBody || requestFailedMessage,\n        });\n        throw new BadGatewayException(requestFailedMessage);\n      }\n\n      const payload = (await response.json()) as {\n        candidates?: Array\u003C{\n          content?: {\n            parts?: Array\u003C{ text?: string }\u003E;\n          };\n        }\u003E;\n      };\n\n      const content = payload.candidates?.[0]?.content?.parts?.[0]?.text;\n      if (!content) {\n        const emptyResponseMessage = PtBrMessages.llm.emptyResponse('gemini');\n        ApiLogger.logError({\n          path: 'gemini',\n          method: 'POST',\n          statusCode: 502,\n          message: emptyResponseMessage,\n        });\n        throw new BadGatewayException(emptyResponseMessage);\n      }\n\n      return parseInvoiceExtractionFromText(content);\n    }\n\n    const requestFailedMessage = PtBrMessages.llm.requestFailed('gemini');\n    ApiLogger.logError({\n      path: 'gemini',\n      method: 'POST',\n      statusCode: lastStatusCode,\n      message: lastErrorBody || requestFailedMessage,\n    });\n    throw new BadGatewayException(requestFailedMessage);\n  }\n\n  private resolveModelAttempts(): string[] {\n    const configured = this.normalizeModel(this.config.model);\n    const attempts = [configured, ...this.fallbackModels];\n    return [...new Set(attempts)];\n  }\n\n  private normalizeModel(model: string): string {\n    if (model.startsWith('models/')) {\n      return model.replace(/^models\\//, '');\n    }\n    return model;\n  }\n}\n","backend/src/modules/llm/infrastructure/providers/ollama-extractor.ts":"import { BadGatewayException } from '@nestjs/common';\nimport {\n  InvoiceExtraction,\n  InvoiceExtractionReference,\n} from '../../../invoices/domain/contracts/invoice-extraction.contract';\nimport { ApiLogger } from '../../../../shared/logging/api-logger';\nimport { PtBrMessages } from '../../../../shared/messages/pt-br.messages';\nimport {\n  buildExtractionContext,\n  buildExtractionInstructions,\n} from '../../application/extraction-instructions';\nimport { parseInvoiceExtractionFromText } from '../../application/extraction-response.parser';\nimport {\n  ExtractInvoiceInput,\n  ILlmExtractor,\n} from '../../llm-extractor.interface';\nimport { convertPdfToImageBase64 } from '../../application/pdf-to-image';\n\ntype OllamaExtractorConfig = {\n  baseUrl: string;\n  model: string;\n  extractionReference: InvoiceExtractionReference;\n  extractionPrompt: string;\n  extractionContext: string;\n};\n\nexport class OllamaExtractor implements ILlmExtractor {\n  constructor(private readonly config: OllamaExtractorConfig) {}\n\n  async extractInvoiceData(\n    input: ExtractInvoiceInput,\n  ): Promise\u003CInvoiceExtraction\u003E {\n    const prompt = buildExtractionInstructions({\n      extractionPrompt: this.config.extractionPrompt,\n      extractionReference: this.config.extractionReference,\n    });\n\n    const userPrompt = buildExtractionContext({\n      extractionContext: this.config.extractionContext,\n      fileName: input.fileName,\n      includeBase64Data: false,\n    });\n\n    const base64Image = await convertPdfToImageBase64(input.pdfBuffer);\n\n    const response = await fetch(`${this.config.baseUrl}/api/chat`, {\n      method: 'POST',\n      headers: {\n        'Content-Type': 'application/json',\n      },\n      body: JSON.stringify({\n        model: this.config.model,\n        stream: false,\n        format: 'json',\n        messages: [\n          { role: 'system', content: prompt },\n          { role: 'user', content: userPrompt, images: [base64Image] },\n        ],\n      }),\n    });\n\n    if (!response.ok) {\n      const body = await response.text();\n      const requestFailedMessage = PtBrMessages.llm.requestFailed('ollama');\n      ApiLogger.logError({\n        path: 'ollama',\n        method: 'POST',\n        statusCode: response.status,\n        message: body || requestFailedMessage,\n      });\n      throw new BadGatewayException(requestFailedMessage);\n    }\n\n    const payload = (await response.json()) as {\n      message?: { content?: string };\n    };\n    const content = payload.message?.content;\n    if (!content) {\n      const emptyResponseMessage = PtBrMessages.llm.emptyResponse('ollama');\n      ApiLogger.logError({\n        path: 'ollama',\n        method: 'POST',\n        statusCode: 502,\n        message: emptyResponseMessage,\n      });\n      throw new BadGatewayException(emptyResponseMessage);\n    }\n\n    return parseInvoiceExtractionFromText(content);\n  }\n}\n","backend/src/modules/llm/infrastructure/providers/openai-extractor.ts":"import { BadGatewayException } from '@nestjs/common';\nimport {\n  InvoiceExtraction,\n  InvoiceExtractionReference,\n} from '../../../invoices/domain/contracts/invoice-extraction.contract';\nimport { ApiLogger } from '../../../../shared/logging/api-logger';\nimport { PtBrMessages } from '../../../../shared/messages/pt-br.messages';\nimport {\n  buildExtractionContext,\n  buildExtractionInstructions,\n} from '../../application/extraction-instructions';\nimport { parseInvoiceExtractionFromText } from '../../application/extraction-response.parser';\nimport {\n  ExtractInvoiceInput,\n  ILlmExtractor,\n} from '../../llm-extractor.interface';\n\ntype OpenAiExtractorConfig = {\n  apiKey: string;\n  model: string;\n  baseUrl: string;\n  extractionReference: InvoiceExtractionReference;\n  extractionPrompt: string;\n  extractionContext: string;\n};\n\nexport class OpenAiExtractor implements ILlmExtractor {\n  constructor(private readonly config: OpenAiExtractorConfig) {}\n\n  async extractInvoiceData(\n    input: ExtractInvoiceInput,\n  ): Promise\u003CInvoiceExtraction\u003E {\n    ApiLogger.warning({\n      context: 'OpenAiExtractor',\n      message:\n        'Provider OpenAI esta operando em modo de contexto textual com PDF em base64. Para requisito estrito de PDF nativo, utilize Gemini ou Claude.',\n    });\n    const prompt = buildExtractionInstructions({\n      extractionPrompt: this.config.extractionPrompt,\n      extractionReference: this.config.extractionReference,\n    });\n    const userContext = buildExtractionContext({\n      extractionContext: this.config.extractionContext,\n      fileName: input.fileName,\n      includeBase64Data: true,\n      pdfBase64: input.pdfBuffer.toString('base64'),\n    });\n\n    const response = await fetch(`${this.config.baseUrl}/chat/completions`, {\n      method: 'POST',\n      headers: {\n        Authorization: `Bearer ${this.config.apiKey}`,\n        'Content-Type': 'application/json',\n      },\n      body: JSON.stringify({\n        model: this.config.model,\n        response_format: { type: 'json_object' },\n        messages: [\n          { role: 'system', content: prompt },\n          {\n            role: 'user',\n            content: userContext,\n          },\n        ],\n      }),\n    });\n\n    if (!response.ok) {\n      const body = await response.text();\n      const requestFailedMessage = PtBrMessages.llm.requestFailed('openai');\n      ApiLogger.logError({\n        path: 'openai',\n        method: 'POST',\n        statusCode: response.status,\n        message: body || requestFailedMessage,\n      });\n      throw new BadGatewayException(requestFailedMessage);\n    }\n\n    const payload = (await response.json()) as {\n      choices?: Array\u003C{ message?: { content?: string } }\u003E;\n    };\n    const content = payload.choices?.[0]?.message?.content;\n    if (!content) {\n      const emptyResponseMessage = PtBrMessages.llm.emptyResponse('openai');\n      ApiLogger.logError({\n        path: 'openai',\n        method: 'POST',\n        statusCode: 502,\n        message: emptyResponseMessage,\n      });\n      throw new BadGatewayException(emptyResponseMessage);\n    }\n\n    return parseInvoiceExtractionFromText(content);\n  }\n}\n","backend/src/modules/storage/storage.module.ts":"import { Module } from '@nestjs/common';\nimport { ConfigService } from '@nestjs/config';\nimport { FileCryptoService } from './application/file-crypto.service';\nimport {\n  DOCUMENT_STORAGE_TOKEN,\n  DocumentStoragePort,\n} from './domain/document-storage.port';\nimport { S3DocumentStorageAdapter } from './infrastructure/s3-document-storage.adapter';\n\n@Module({\n  providers: [\n    FileCryptoService,\n    S3DocumentStorageAdapter,\n    {\n      provide: DOCUMENT_STORAGE_TOKEN,\n      inject: [ConfigService, S3DocumentStorageAdapter],\n      useFactory: (\n        _configService: ConfigService,\n        adapter: S3DocumentStorageAdapter,\n      ): DocumentStoragePort =\u003E adapter,\n    },\n  ],\n  exports: [DOCUMENT_STORAGE_TOKEN, FileCryptoService],\n})\nexport class StorageModule {}\n","backend/src/modules/storage/application/file-crypto.service.ts":"import { Injectable } from '@nestjs/common';\nimport { ConfigService } from '@nestjs/config';\nimport { compactDecrypt, CompactEncrypt } from 'jose';\nimport { createHash } from 'crypto';\nimport { ApiLogger } from '../../../shared/logging/api-logger';\nimport { PtBrMessages } from '../../../shared/messages/pt-br.messages';\n\n@Injectable()\n/**\n *\n * EN: File cryptography service handling JWE encryption and checksum operations.\n *\n * PT: Servico de criptografia de arquivos para operacoes de JWE e checksum.\n *\n * @params Binary file payloads and crypto configuration.\n * @returns Encrypted/decrypted binary content and deterministic hash.\n */\nexport class FileCryptoService {\n  constructor(private readonly configService: ConfigService) {}\n\n  /**\n   *\n   * EN: Encrypts binary content using JWE compact serialization.\n   *\n   * PT: Criptografa conteudo binario usando serializacao compacta JWE.\n   *\n   * @params content Raw file buffer.\n   * @returns Encrypted buffer ready for storage.\n   */\n  async encrypt(content: Buffer): Promise\u003CBuffer\u003E {\n    ApiLogger.info({\n      co
