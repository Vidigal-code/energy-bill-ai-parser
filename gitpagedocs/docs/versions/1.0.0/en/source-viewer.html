*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;display:flex;flex-direction:column}

.rh{background:var(--bg2);border-bottom:1px solid var(--bd);padding:0 16px;height:48px;display:flex;align-items:center;gap:10px;flex-shrink:0}

.outer{display:flex;flex:1;overflow:hidden}

.sb-search-icon{position:absolute;left:8px;color:var(--fg2);pointer-events:none;display:flex}
.sb-input{width:100%;padding:5px 8px 5px 30px;font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;color:var(--fg);outline:none;transition:border-color .1s,box-shadow .1s}

.sb-input::placeholder{color:var(--fg2)}
.sb-actions{display:flex;gap:4px;margin-top:6px}
.sb-btn{flex:1;padding:4px 6px;font-size:11px;background:var(--bg3);border:1px solid var(--bd);border-radius:5px;color:var(--fg2);cursor:pointer;transition:color .1s,background .1s}

.sb-tree::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}

.ti-chev.open{transform:rotate(90deg)}
.ti-chev.blank{visibility:hidden}
.ti-icon{width:16px;flex-shrink:0;display:flex;align-items:center}
.ti-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti-name.dir{color:var(--fg)}
.ti-name.file{color:var(--fg2)}
.ti-children.closed{display:none}

.rsz{width:4px;background:transparent;cursor:col-resize;flex-shrink:0;transition:background .15s;position:relative;z-index:10}

.md-view h1,.md-view h2{border-bottom:1px solid var(--bd);padding-bottom:.35em;margin:1.25em 0 .6em}
.md-view h3,.md-view h4{margin:1.1em 0 .5em}

.md-view pre{background:var(--bg3);border:1px solid var(--bd);border-radius:6px;padding:16px;overflow-x:auto;margin-bottom:1em}
.md-view pre code{background:none;padding:0;color:var(--fg);font-size:12px}
.md-view table{border-collapse:collapse;width:100%;margin-bottom:1em}
.md-view th,.md-view td{border:1px solid var(--bd);padding:8px 12px}
.md-view th{background:var(--bg3);font-weight:600}
.md-view a{color:var(--acc)}
.md-view blockquote{border-left:4px solid var(--bd);padding-left:16px;color:var(--fg2);margin:0 0 1em}
.md-view hr{border:none;border-top:1px solid var(--bd);margin:1.5em 0}
.md-view img{max-width:100%;border-radius:6px}

.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;color:var(--fg2);gap:14px;padding:48px 32px;text-align:center}
.welcome svg{opacity:.22}
.welcome h2{font-size:18px;font-weight:500;color:var(--fg)}
.welcome p{font-size:13px;max-width:340px;line-height:1.6}

.trunc-note{padding:10px 16px;background:rgba(210,153,34,.1);border-top:1px solid rgba(210,153,34,.25);color:var(--ora);font-size:12px;text-align:center}

@media(max-width:767px){

  DATABASE_URL: postgresql://energy:energy@postgres:5432/energy_bill?schema=public\n      LOGS: 'false'\n    command: sh -c \"npm run test:unit \u0026\u0026 npm run test:integration\"\n    profiles:\n      - test\n    depends_on:\n      postgres:\n        condition: service_healthy\n\nvolumes:\n  postgres_data:\n#  ollama_data:\n  localstack_data:\n","envexample.txt":"NODE_ENV=development\nPORT=3000\nFRONTEND_PORT=3001\nHELMET_ENABLED=true\nRATE_LIMIT_TTL_MS=60000\nRATE_LIMIT_LIMIT=100\nSWAGGER_ENABLED=true\nSWAGGER_PATH=api/docs\n\nDATABASE_URL=postgresql://energy:energy@localhost:5432/energy_bill?schema=public\n\nJWT_ACCESS_SECRET=dev-access-secret\nJWT_REFRESH_SECRET=dev-refresh-secret\nJWT_ACCESS_EXPIRES_IN=15m\nJWT_REFRESH_EXPIRES_IN=7d\nJWT_ISSUER=energy-bill-ai-parser\nJWE_SECRET=dev-jwe-secret-with-at-least-32-chars\nDEFAULT_ADMIN_EMAIL=admin@local.test\nDEFAULT_ADMIN_USERNAME=admin\nDEFAULT_ADMIN_PASSWORD=Admin@123456\nSTORAGE_DRIVER=localstack\nS3_REGION=us-east-1\nS3_BUCKET=energy-bills\nS3_ENDPOINT=http://localhost:4566\nS3_ACCESS_KEY_ID=test\nS3_SECRET_ACCESS_KEY=test\nS3_FORCE_PATH_STYLE=true\n\nOPEN_SOURCE_IA=false\nLLM_PROVIDER=gemini\n\nOLLAMA_BASE_URL=http://localhost:11434\n# Modelo usado na API e no servi\u00e7o docker `ollama-init`\nOLLAMA_MODEL=llama3.2-vision\nOPENAI_BASE_URL=https://api.openai.com/v1\nOPENAI_MODEL=gpt-4o-mini\nGEMINI_BASE_URL=https://generativelanguage.googleapis.com/v1beta\nGEMINI_MODEL=gemini-2.5-flash\nANTHROPIC_BASE_URL=https://api.anthropic.com/v1\nANTHROPIC_MODEL=claude-3-5-sonnet-latest\nPDF_MAX_FILE_SIZE_MB=50\nROLLBACK_ON_INVOICE_FAILURE=true\nLOGS=true\n\n# Optional cloud providers (when OPEN_SOURCE_IA=false)\nOPENAI_API_KEY=\nGEMINI_API_KEY=\nANTHROPIC_API_KEY=\n\n# Frontend (Next.js)\nBACKEND_API_URL=http://localhost:3000\nNEXT_PUBLIC_BACKEND_API_URL=http://localhost:3000\n","README.md":"# Energy Bill AI Parser\n\nPlataforma full-stack para processamento de faturas de energia com IA, autentica\u00e7\u00e3o segura, RBAC, auditoria e armazenamento criptografado.\n\n\u003Cdetails\u003E\n\u003Csummary\u003E\u003Cstrong\u003E\ud83c\udde7\ud83c\uddf7 Descri\u00e7\u00e3o em Portugu\u00eas\u003C/strong\u003E\u003C/summary\u003E\n\n## Objetivo atual\n\nO reposit\u00f3rio entrega backend + frontend para:\n\n- upload de PDF;\n- extra\u00e7\u00e3o estruturada com m\u00faltiplos provedores de IA;\n- c\u00e1lculo de m\u00e9tricas de neg\u00f3cio;\n- persist\u00eancia com Prisma/PostgreSQL;\n- controle de acesso com JWT + RBAC (`ADMIN` e `USER`);\n- trilha de auditoria e gest\u00e3o administrativa completa;\n- experi\u00eancia web em Next.js integrada ao backend.\n\n## Stack\n\n- Node.js, NestJS, TypeScript\n- Next.js, React, Redux Toolkit, React Query, Axios, Tailwind CSS\n- Prisma ORM, PostgreSQL\n- LLMs: Ollama, OpenAI, Gemini/Google, Claude/Anthropic\n- AWS S3 (LocalStack no ambiente local)\n- Docker Compose\n\n## Arquitetura atual (resumo)\n\n- `backend/src/modules/auth`: registro, login, refresh token, logout, perfil e guards.\n- `backend/src/modules/admin`: CRUD administrativo de usu\u00e1rios, documentos, faturas e auditoria.\n- `backend/src/modules/invoices`: upload, extra\u00e7\u00e3o, dashboards e listagem por papel.\n- `backend/src/modules/llm`: sele\u00e7\u00e3o din\u00e2mica de provider e adapters por provedor.\n- `backend/src/modules/storage`: criptografia JWE e armazenamento S3.\n- `backend/src/modules/audit`: persist\u00eancia de logs de auditoria.\n- `backend/src/shared`: config/env, logger, resposta HTTP padr\u00e3o, filtros e mensagens centralizadas.\n- `frontend/src`: arquitetura FSD (`app`, `shared`, `entities`, `features`, `widgets`) com sess\u00e3o HTTP-only cookie via rotas internas.\n\n## Extra\u00e7\u00e3o configur\u00e1vel\n\nContrato central de extra\u00e7\u00e3o:\n\n- `backend/src/modules/invoices/domain/contracts/invoice-extraction.contract.ts`\n\nConfigura\u00e7\u00e3o principal via vari\u00e1veis de ambiente:\n\n- `INVOICE_EXTRACTION_REFERENCE`\n- `INVOICE_EXTRACTION_PROMPT`\n- `INVOICE_EXTRACTION_CONTEXT`\n\n## Decis\u00f5es Arquiteturais e Tecnologias\n\n- **Framework Backend (NestJS)**: Escolhido pela arquitetura modular, inje\u00e7\u00e3o de depend\u00eancias e suporte nativo ao TypeScript, garantindo escalabilidade e testabilidade.\n- **ORM (Prisma)**: Facilita a modelagem relacional dos dados estruturados extra\u00eddos, com tipagem fortemente vinculada ao banco PostgreSQL.\n- **LLM Escolhido (Gemini)**: Conforme o requisito estrito do desafio, era obrigat\u00f3rio o envio direto do **pr\u00f3prio arquivo PDF** para an\u00e1lise vis\u00e3o/documento do LLM (sem usar bibliotecas de extra\u00e7\u00e3o de texto estruturado). Modelos Open-Source como `llama3.2-vision` (Ollama) n\u00e3o suportam o recebimento de PDFs de forma nativa atrav\u00e9s da API (aceitando apenas imagens bin\u00e1rias individuais no array de `images`). \n  \n  Por esse motivo, **Gemini foi eleito como padr\u00e3o** na aplica\u00e7\u00e3o e no Docker, pois sua API aceita o mimeType `application/pdf` diretamente na camada multimodal, aderindo 100% aos requisitos de n\u00e3o manipular o documento antes do envio.\n- **Suporte Open-Source (Ollama)**: O projeto **D\u00c1 SUPORTE COMPLETO** a IA Local e Open-Source. Caso deseje utilizar o Ollama, altere no `.env` a flag `OPEN_SOURCE_IA=true` e `LLM_PROVIDER=ollama`. Ao detectar esse provider configurado, o adaptador interno `OllamaExtractor` far\u00e1 automaticamente o fallback convertendo a primeira p\u00e1gina do PDF para uma imagem (usando `pdf2pic` / `ghostscript` inclu\u00eddos no Docker) para viabilizar o envio visual ao LLM local, mantendo a n\u00e3o depend\u00eancia de extra\u00e7\u00e3o de *textos*, focando estritamente em imagem/vis\u00e3o.\n\n## Seguran\u00e7a e padr\u00f5es\n\n- Rotas protegidas por autentica\u00e7\u00e3o global (exceto rotas p\u00fablicas de auth/health).\n- RBAC com `ADMIN` e `USER`.\n- Helmet com pol\u00edticas globais de cabe\u00e7alho HTTP.\n- Rate limit global com `@nestjs/throttler`.\n- Respostas centralizadas em formato padr\u00e3o (`success/error`).\n- Mensagens e logs centralizados em `backend/src/shared/messages/pt-br.messages.ts`.\n- Logger sem `console`, com n\u00edveis (`LOG`, `INFO`, `WARNING`, `SUCCESS`, `ERROR`).\n\n## \ud83d\udee0 Ambiente\n\nPara rodar o projeto, configure as vari\u00e1veis de ambiente abaixo.\n\nSe quiser utilizar **an\u00e1lise de vis\u00e3o de PDF (100%)**, insira sua chave da API do Gemini:\n\n```\nGEMINI_API_KEY=sua_chave_aqui\n```\n\n### \ud83d\udcc4 Arquivos importantes\n\n* `.env` \u2192 Arquivo final com suas vari\u00e1veis configuradas\n* `envexample.txt` \u2192 Arquivo de exemplo para basear sua configura\u00e7\u00e3o\n\n\u003E \ud83d\udca1 Dica: renomeie `envexample.txt` para `.env` e preencha com suas informa\u00e7\u00f5es.\n\n---\n\n## \ud83d\udc33 Execu\u00e7\u00e3o com Docker\n\nNa raiz do projeto, certifique-se de que o arquivo esteja nomeado como `.env`.\n\nDepois, execute:\n\n```bash\ndocker compose up --build\n```\n\nIsso ir\u00e1:\n\n* Construir a imagem\n* Criar os containers\n* Iniciar a aplica\u00e7\u00e3o\n\nExecutar su\u00edte de testes em container (profile dedicado):\n\n```bash\ndocker compose --profile test up backend-tests --build\n```\n\nServi\u00e7os principais:\n\n- Frontend: `http://localhost:3001`\n- API: `http://localhost:3000`\n- Swagger (Portugu\u00eas): `http://localhost:3000/api/docs/pt`\n- Swagger (English): `http://localhost:3000/api/docs/en`\n- Health: `http://localhost:3000/api/health`\n- PostgreSQL: `localhost:5432`\n- LocalStack (S3): `http://localhost:4566`\n\n\u003E **Ollama**: Os servi\u00e7os locais do Ollama (`ollama` e `ollama-init`) v\u00eam **comentados por padr\u00e3o** no `docker-compose.yml` para economizar recursos da m\u00e1quina, j\u00e1 que a aplica\u00e7\u00e3o est\u00e1 configurada para usar a API ultra r\u00e1pida e com suporte nativo a PDF do **Gemini** para o desafio. Se desejar rodar a IA 100% local, basta descomentar esses blocos no docker-compose e ajustar o `.env` (`OPEN_SOURCE_IA=true`).\n\n## Checklist de valida\u00e7\u00e3o (escopo backend)\n\n- `npm run lint` em `backend`;\n- `npm run test` em `backend` (unit\u00e1rio + integra\u00e7\u00e3o);\n- `npm run build` em `backend`;\n- `npm run lint` em `frontend`;\n- `npm run build` em `frontend`;\n- `docker compose up --build` para infraestrutura + API + frontend;\n- `docker compose --profile test up backend-tests --build` para testes em container.\n\n## Roteiro de valida\u00e7\u00e3o pr\u00e1tica (fatura)\n\nCom um PDF real do desafio, validar campo a campo:\n\n- `numeroCliente`;\n- `mesReferencia`;\n- `itensFatura.energiaEletrica.{quantidadeKwh,valorRs}`;\n- `itensFatura.energiaSceeSemIcms.{quantidadeKwh,valorRs}`;\n- `itensFatura.energiaCompensadaGdi.{quantidadeKwh,valorRs}`;\n- `itensFatura.contribIlumPublicaMunicipal.valorRs`.\n\nE validar m\u00e9tricas calculadas:\n\n- `consumoEnergiaEletricaKwh`;\n- `energiaCompensadaKwh`;\n- `valorTotalSemGdRs`;\n- `economiaGdRs`.\n\nEvid\u00eancia de refer\u00eancia (fatura exemplo JAN/2024):\n\n- `numeroCliente`: `7204076116`\n- `mesReferencia`: `JAN/2024`\n- `energiaEletrica`: `50 kWh` / `R$ 47,75`\n- `energiaSceeSemIcms`: `456 kWh` / `R$ 232,42`\n- `energiaCompensadaGdi`: `456 kWh` / `R$ -222,22`\n- `contribIlumPublicaMunicipal`: `R$ 49,43`\n- `consumoEnergiaEletricaKwh`: `506`\n- `energiaCompensadaKwh`: `456`\n- `valorTotalSemGdRs`: `329,60`\n- `economiaGdRs`: `-222,22`\n\n\u003C/details\u003E\n\n\u003Cdetails\u003E\n\u003Csummary\u003E\u003Cstrong\u003E\ud83c\uddec\ud83c\udde7 English Description\u003C/strong\u003E\u003C/summary\u003E\n\n## Current Goal\n\nThe repository currently delivers backend + frontend to provide:\n\n- PDF upload;\n- structured extraction with multiple AI providers;\n- business metrics computation;\n- Prisma/PostgreSQL persistence;\n- secure auth and RBAC (`ADMIN` and `USER`);\n- audit trail and full admin management;\n- full web experience in Next.js integrated to backend services.\n\n## Stack\n\n- Node.js, NestJS, TypeScript\n- Next.js, React, Redux Toolkit, React Query, Axios, Tailwind CSS\n- Prisma ORM, PostgreSQL\n- LLMs: Ollama, OpenAI, Gemini/Google, Claude/Anthropic\n- AWS S3 (LocalStack for local development)\n- Docker Compose\n\n## Current Architecture (overview)\n\n- `backend/src/modules/auth`: register, login, refresh, logout, profile, guards.\n- `backend/src/modules/admin`: admin CRUD for users, documents, invoices, audit data.\n- `backend/src/modules/invoices`: upload, extraction, dashboards, role-aware listing.\n- `backend/src/modules/llm`: dynamic provider selection and provider adapters.\n- `backend/src/modules/storage`: JWE file encryption and S3 persistence.\n- `backend/src/modules/audit`: audit log persistence.\n- `backend/src/shared`: env/config, logger, HTTP response contract, filters, centralized messages.\n- `frontend/src`: FSD architecture (`app`, `shared`, `entities`, `features`, `widgets`) with HTTP-only cookie session using Next route handlers.\n\n## Configurable Extraction\n\nCentral extraction contract:\n\n- `backend/src/modules/invoices/domain/contracts/invoice-extraction.contract.ts`\n\nMain environment-driven extraction settings:\n\n- `INVOICE_EXTRACTION_REFERENCE`\n- `INVOICE_EXTRACTION_PROMPT`\n- `INVOICE_EXTRACTION_CONTEXT`\n\n## Security and Standards\n\n- Global authentication on app routes (except public auth/health endpoints).\n- RBAC with `ADMIN` and `USER`.\n- Helmet global HTTP header policies.\n- Global rate limiting via `@nestjs/throttler`.\n- Centralized API response format (`success/error`).\n- Centralized messages and logs in `backend/src/shared/messages/pt-br.messages.ts`.\n- Logger levels (`LOG`, `INFO`, `WARNING`, `SUCCESS`, `ERROR`) without `console`.\n\n## Environment Convention\n\nUse root environment files only:\n\n- `/.env`\n- `/.env.example`\n\n## Run with Docker\n\nFrom repository root:\n\n```bash\ndocker compose up --build\n```\n\nRun containerized test suite (dedicated profile):\n\n```bash\ndocker compose --profile test up backend-tests --build\n```\n\nMain services:\n\n- Frontend: `http://localhost:3001`\n- API: `http://localhost:3000`\n- Swagger (Portugu\u00eas): `http://localhost:3000/api/docs/pt`\n- Swagger (English): `http://localhost:3000/api/docs/en`\n- Health: `http://localhost:3000/api/health`\n- PostgreSQL: `localhost:5432`\n- LocalStack (S3): `http://localhost:4566`\n\n\u003E **Ollama**: Local Ollama services (`ollama` and `ollama-init`) are **commented out by default** in `docker-compose.yml` to save machine resources, since the application is configured to use the ultra-fast **Gemini** API (native PDF support) for the challenge. If you wish to run a 100% local AI, simply uncomment these blocks in `docker-compose.yml` and adjust the `.env` file (`OPEN_SOURCE_IA=true`).\n\n## Validation Checklist (backend scope)\n\n- `npm run lint` in `backend`;\n- `npm run test` in `backend` (unit + integration);\n- `npm run build` in `backend`;\n- `npm run lint` in `frontend`;\n- `npm run build` in `frontend`;\n- `docker compose up --build` for infrastructure + API + frontend;\n- `docker compose --profile test up backend-tests --build` for containerized tests.\n\n## Practical Invoice Validation Script\n\nUsing a real challenge PDF, validate field by field:\n\n- `numeroCliente`;\n- `mesReferencia`;\n- `itensFatura.energiaEletrica.{quantidadeKwh,valorRs}`;\n- `itensFatura.energiaSceeSemIcms.{quantidadeKwh,valorRs}`;\n- `itensFatura.energiaCompensadaGdi.{quantidadeKwh,valorRs}`;\n- `itensFatura.contribIlumPublicaMunicipal.valorRs`.\n\nThen validate computed metrics:\n\n- `consumoEnergiaEletricaKwh`;\n- `energiaCompensadaKwh`;\n- `valorTotalSemGdRs`;\n- `economiaGdRs`.\n\nReference evidence (sample invoice JAN/2024):\n\n- `numeroCliente`: `7204076116`\n- `mesReferencia`: `JAN/2024`\n- `energiaEletrica`: `50 kWh` / `R$ 47,75`\n- `energiaSceeSemIcms`: `456 kWh` / `R$ 232,42`\n- `energiaCompensadaGdi`: `456 kWh` / `R$ -222,22`\n- `contribIlumPublicaMunicipal`: `R$ 49,43`\n- `consumoEnergiaEletricaKwh`: `506`\n- `energiaCompensadaKwh`: `456`\n- `valorTotalSemGdRs`: `329,60`\n- `economiaGdRs`: `-222,22`\n\n\u003C/details\u003E\n",".github/workflows/gitpagedocs-pages.yml":"name: Deploy GitPageDocs\n\non:\n  push:\n    branches: [\"main\"]\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: \"pages\"\n  cancel-in-progress: true\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout target repository\n        uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: \"20\"\n\n      - name: Setup Pages\n        uses: actions/configure-pages@v5\n\n      - name: Prepare runtime source\n        run: |\n          git clone --depth 1 https://github.com/Vidigal-code/git-page-docs.git .gitpagedocs-runtime\n          cp .gitpagedocs-runtime/gitpagedocs/icon.svg /tmp/default-icon.svg 2\u003E/dev/null || true\n          if [ -d gitpagedocs ]; then\n            rm -rf .gitpagedocs-runtime/gitpagedocs\n            cp -R gitpagedocs .gitpagedocs-runtime/gitpagedocs\n          fi\n          mkdir -p .gitpagedocs-runtime/public\n          if [ -f icon.svg ]; then\n            cp icon.svg .gitpagedocs-runtime/public/icon.svg\n          elif [ -f gitpagedocs/icon.svg ]; then\n            cp gitpagedocs/icon.svg .gitpagedocs-runtime/public/icon.svg\n          elif [ -f /tmp/default-icon.svg ]; then\n            cp /tmp/default-icon.svg .gitpagedocs-runtime/public/icon.svg\n          fi\n\n      - name: Install runtime dependencies\n        run: npm ci\n        working-directory: .gitpagedocs-runtime\n\n      - name: Build static site with target repository path\n        run: npx next build\n        working-directory: .gitpagedocs-runtime\n        env:\n          GITHUB_ACTIONS: \"true\"\n          GITHUB_REPOSITORY: ${{ github.repository }}\n\n      - name: Force root URL to docs entrypoint\n        env:\n          GITHUB_REPOSITORY: ${{ github.repository }}\n        run: |\n          node \u003C\u003C'NODE'\n          const fs = require('fs');\n          const path = require('path');\n          const pathSegment = \"\";\n          const repoName = (process.env.GITHUB_REPOSITORY || '').split('/')[1] || '';\n          const rootRedirectBase = pathSegment;\n          const cfgPath = path.join('.gitpagedocs-runtime', 'gitpagedocs', 'config.json');\n          if (!fs.existsSync(cfgPath)) process.exit(0);\n          const cfg = JSON.parse(fs.readFileSync(cfgPath, 'utf8'));\n          const defaultVersion = cfg?.site?.docsVersion || cfg?.VersionControl?.versions?.[0]?.id || '1.1.0';\n          const defaultLang = cfg?.site?.defaultLanguage || 'en';\n          const redirectTargetRoot = rootRedirectBase\n            ? './' + rootRedirectBase + '/v/' + defaultVersion + '/?lang=' + defaultLang\n            : './v/' + defaultVersion + '/?lang=' + defaultLang;\n          const redirectTargetProject = './v/' + defaultVersion + '/?lang=' + defaultLang;\n          const rootHtml = '\u003C!doctype html\u003E\u003Chtml\u003E\u003Chead\u003E\u003Cmeta charset=\"utf-8\"\u003E\u003Cmeta http-equiv=\"refresh\" content=\"0;url=' + redirectTargetRoot + '\"/\u003E\u003Cscript\u003Ewindow.location.replace(\"' + redirectTargetRoot + '\" + (window.location.search || \"\"));\u003C/script\u003E\u003C/head\u003E\u003Cbody\u003ERedirecting...\u003C/body\u003E\u003C/html\u003E';\n          fs.writeFileSync(path.join('.gitpagedocs-runtime', 'out', 'index.html'), rootHtml);\n          const projectPathSegments = [];\n          if (repoName) projectPathSegments.push(repoName);\n          if (pathSegment) projectPathSegments.push(pathSegment);\n          if (projectPathSegments.length \u003E 0) {\n            const projectIndexPath = path.join('.gitpagedocs-runtime', 'out', ...projectPathSegments, 'index.html');\n            if (fs.existsSync(path.dirname(projectIndexPath))) {\n              const projectHtml = '\u003C!doctype html\u003E\u003Chtml\u003E\u003Chead\u003E\u003Cmeta charset=\"utf-8\"\u003E\u003Cmeta http-equiv=\"refresh\" content=\"0;url=' + redirectTargetProject + '\"/\u003E\u003Cscript\u003Ewindow.location.replace(\"' + redirectTargetProject + '\" + (window.location.search || \"\"));\u003C/script\u003E\u003C/head\u003E\u003Cbody\u003ERedirecting...\u003C/body\u003E\u003C/html\u003E';\n              fs.writeFileSync(projectIndexPath, projectHtml);\n            }\n          }\n          NODE\n\n      - name: Add .nojekyll\n        run: touch .gitpagedocs-runtime/out/.nojekyll 2\u003E/dev/null || mkdir -p .gitpagedocs-runtime/out \u0026\u0026 touch .gitpagedocs-runtime/out/.nojekyll\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: ./.gitpagedocs-runtime/out\n\n  deploy:\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    runs-on: ubuntu-latest\n    needs: build\n    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n","backend/.dockerignore":"node_modules\nnpm-debug.log\ndist\ncoverage\n.git\n.env\n.env.*\n","backend/.gitignore":"node_modules\n# Keep environment variables out of version control\n.env\n\n/generated/prisma\n","backend/.prettierrc":"{\n  \"singleQuote\": true,\n  \"trailingComma\": \"all\"\n}\n","backend/Dockerfile":"FROM node:22-alpine AS deps\nWORKDIR /app\nRUN apk add --no-cache ghostscript graphicsmagick\nCOPY package*.json ./\nRUN npm install --legacy-peer-deps\n\nFROM node:22-alpine AS builder\nWORKDIR /app\nCOPY --from=deps /app/node_modules ./node_modules\nCOPY . .\nRUN npx prisma generate\nRUN npm run build\n\nFROM node:22-alpine AS runner\nWORKDIR /app\nRUN apk add --no-cache ghostscript graphicsmagick\nENV NODE_ENV=production\nCOPY package*.json ./\nCOPY --from=builder /app/node_modules ./node_modules\nCOPY --from=builder /app/dist ./dist\nCOPY --from=builder /app/prisma ./prisma\nEXPOSE 3000\nCMD [\"node\", \"dist/src/main.js\"]\n","backend/eslint.config.mjs":"// @ts-check\nimport eslint from '@eslint/js';\nimport eslintPluginPrettierRecommended from 'eslint-plugin-prettier/recommended';\nimport globals from 'globals';\nimport tseslint from 'typescript-eslint';\n\nexport default tseslint.config(\n  {\n    ignores: ['eslint.config.mjs'],\n  },\n  eslint.configs.recommended,\n  ...tseslint.configs.recommendedTypeChecked,\n  eslintPluginPrettierRecommended,\n  {\n    languageOptions: {\n      globals: {\n        ...globals.node,\n        ...globals.jest,\n      },\n      sourceType: 'commonjs',\n      parserOptions: {\n        projectService: true,\n        tsconfigRootDir: import.meta.dirname,\n      },\n    },\n  },\n  {\n    rules: {\n      '@typescript-eslint/no-explicit-any': 'off',\n      '@typescript-eslint/no-floating-promises': 'warn',\n      '@typescript-eslint/no-unsafe-argument': 'warn',\n      \"prettier/prettier\": [\"error\", { endOfLine: \"auto\" }],\n    },\n  },\n);\n","backend/nest-cli.json":"{\n  \"$schema\": \"https://json.schemastore.org/nest-cli\",\n  \"collection\": \"@nestjs/schematics\",\n  \"sourceRoot\": \"src\",\n  \"compilerOptions\": {\n    \"deleteOutDir\": true\n  }\n}\n","backend/package.json":"{\n  \"name\": \"backend\",\n  \"version\": \"0.0.1\",\n  \"description\": \"\",\n  \"author\": \"\",\n  \"private\": true,\n  \"license\": \"UNLICENSED\",\n  \"scripts\": {\n    \"build\": \"nest build\",\n    \"format\": \"prettier --write \\\"src/**/*.ts\\\" \\\"tests/**/*.ts\\\"\",\n    \"start\": \"nest start\",\n    \"start:dev\": \"nest start --watch\",\n    \"start:debug\": \"nest start --debug --watch\",\n    \"start:prod\": \"node dist/main\",\n    \"lint\": \"eslint \\\"{src,apps,libs,tests}/**/*.ts\\\" --fix\",\n    \"test\": \"npm run test:unit \u0026\u0026 npm run test:integration\",\n    \"test:unit\": \"jest --config ./tests/jest.unit.json --runInBand\",\n    \"test:integration\": \"jest --config ./tests/jest.integration.json --runInBand\",\n    \"test:docker\": \"npm run test\",\n    \"test:watch\": \"jest --watch\",\n    \"test:cov\": \"jest --coverage\",\n    \"test:debug\": \"node --inspect-brk -r tsconfig-paths/register -r ts-node/register node_modules/.bin/jest --runInBand\",\n    \"test:e2e\": \"jest --config ./tests/jest.integration.json --runInBand\"\n  },\n  \"dependencies\": {\n    \"@aws-sdk/client-s3\": \"^3.1000.0\",\n    \"@nestjs/common\": \"^11.0.1\",\n    \"@nestjs/config\": \"^4.0.3\",\n    \"@nestjs/core\": \"^11.0.1\",\n    \"@nestjs/jwt\": \"^11.0.2\",\n    \"@nestjs/passport\": \"^11.0.5\",\n    \"@nestjs/platform-express\": \"^11.0.1\",\n    \"@nestjs/swagger\": \"^11.2.6\",\n    \"@nestjs/throttler\": \"^6.5.0\",\n    \"@prisma/client\": \"^6.4.1\",\n    \"argon2\": \"^0.44.0\",\n    \"class-transformer\": \"^0.5.1\",\n    \"class-validator\": \"^0.15.1\",\n    \"helmet\": \"^8.1.0\",\n    \"jose\": \"^6.1.3\",\n    \"passport\": \"^0.7.0\",\n    \"passport-jwt\": \"^4.0.1\",\n    \"reflect-metadata\": \"^0.2.2\",\n    \"rxjs\": \"^7.8.1\",\n    \"swagger-ui-express\": \"^5.0.1\",\n    \"pdf2pic\": \"^3.1.3\",\n    \"zod\": \"^4.3.6\"\n  },\n  \"devDependencies\": {\n    \"@eslint/eslintrc\": \"^3.2.0\",\n    \"@eslint/js\": \"^9.18.0\",\n    \"@nestjs/cli\": \"^11.0.0\",\n    \"@nestjs/schematics\": \"^11.0.0\",\n    \"@nestjs/testing\": \"^11.0.1\",\n    \"@types/express\": \"^5.0.0\",\n    \"@types/jest\": \"^30.0.0\",\n    \"@types/node\": \"^22.10.7\",\n    \"@types/passport-jwt\": \"^4.0.1\",\n    \"@types/supertest\": \"^6.0.2\",\n    \"eslint\": \"^9.18.0\",\n    \"eslint-config-prettier\": \"^10.0.1\",\n    \"eslint-plugin-prettier\": \"^5.2.2\",\n    \"globals\": \"^16.0.0\",\n    \"jest\": \"^30.0.0\",\n    \"prettier\": \"^3.4.2\",\n    \"prisma\": \"^6.4.1\",\n    \"source-map-support\": \"^0.5.21\",\n    \"supertest\": \"^7.0.0\",\n    \"ts-jest\": \"^29.2.5\",\n    \"ts-loader\": \"^9.5.2\",\n    \"ts-node\": \"^10.9.2\",\n    \"tsconfig-paths\": \"^4.2.0\",\n    \"typescript\": \"^5.7.3\",\n    \"typescript-eslint\": \"^8.20.0\"\n  },\n  \"jest\": {\n    \"moduleFileExtensions\": [\n      \"js\",\n      \"json\",\n      \"ts\"\n    ],\n    \"rootDir\": \"src\",\n    \"testRegex\": \".*\\\\.spec\\\\.ts$\",\n    \"transform\": {\n      \"^.+\\\\.(t|j)s$\": \"ts-jest\"\n    },\n    \"collectCoverageFrom\": [\n      \"**/*.(t|j)s\"\n    ],\n    \"coverageDirectory\": \"../coverage\",\n    \"testEnvironment\": \"node\"\n  }\n}","backend/README.md":"# Backend - Energy Bill AI Parser\n\n\u003Cdetails\u003E\n\u003Csummary\u003E\u003Cstrong\u003E\ud83c\udde7\ud83c\uddf7 Portugu\u00eas\u003C/strong\u003E\u003C/summary\u003E\n\n## Vis\u00e3o geral\n\nBackend NestJS com arquitetura modular para extra\u00e7\u00e3o de dados de faturas em PDF, autentica\u00e7\u00e3o enterprise, RBAC, auditoria e armazenamento criptografado.\n\nEste backend est\u00e1 integrado ao frontend Next.js do reposit\u00f3rio via sess\u00e3o segura com cookies HTTP-only e proxy autenticado.\n\n## M\u00f3dulos atuais (`src/modules`)\n\n- `auth`\n  - registro, login, refresh token, logout, perfil;\n  - `JwtAuthGuard` e `RolesGuard`;\n  - decorators `@Public`, `@Roles`, `@CurrentUser`.\n- `admin`\n  - CRUD administrativo de usu\u00e1rios;\n  - listagem e gest\u00e3o de documentos, faturas e logs de auditoria;\n  - download de documento com descriptografia.\n- `invoices`\n  - upload e processamento de fatura;\n  - consulta de faturas e dashboards;\n  - restri\u00e7\u00e3o por papel (`ADMIN` v\u00ea tudo, `USER` v\u00ea apenas os pr\u00f3prios dados).\n- `llm`\n  - sele\u00e7\u00e3o din\u00e2mica de provider;\n  - adapters para Ollama, OpenAI, Gemini/Google e Claude.\n- `storage`\n  - criptografia/descriptografia JWE (`FileCryptoService`);\n  - adapter S3 (`S3DocumentStorageAdapter`) com LocalStack em ambiente local.\n- `audit`\n  - persist\u00eancia de trilha de auditoria.\n- `health`\n  - endpoint de sa\u00fade da API.\n\n## Shared (`src/shared`)\n\n- `config`\n  - valida\u00e7\u00e3o de env com Zod;\n  - utilit\u00e1rios de dura\u00e7\u00e3o JWT;\n  - configura\u00e7\u00e3o de limite m\u00e1ximo de PDF.\n- `http`\n  - resposta padr\u00e3o centralizada (`ApiResponsePresenter`);\n  - interceptor global de sucesso;\n  - filtro global de exce\u00e7\u00f5es.\n- `logging`\n  - `ApiLogger` com n\u00edveis e cores ANSI.\n- `messages`\n  - `pt-br.messages.ts` como fonte \u00fanica de mensagens de neg\u00f3cio, erro e log.\n- `prisma`\n  - `PrismaService` e `PrismaModule`.\n\n## Fluxo de processamento de fatura\n\n1. Upload via `POST /api/invoices/extract`.\n2. Valida\u00e7\u00e3o de tipo e tamanho do PDF (`PDF_MAX_FILE_SIZE_MB`).\n3. Criptografia JWE do arquivo.\n4. Upload em storage S3.\n5. Extra\u00e7\u00e3o via provider LLM configurado.\n   \u003E **Nota sobre I.A Open-Source (Ollama)**: Se configurado para usar o Ollama, o backend converte automaticamente a primeira p\u00e1gina do PDF para uma imagem PNG em base64 (usando `pdf2pic` e `ghostscript`) antes de enviar para a API. Isso ocorre pois a API nativa do Ollama (vision) n\u00e3o aceita arquivos `.pdf` de forma nativa como o Gemini ou Claude, requerendo dados de imagem no array `images`. Para cumprir o requisito estrito do desafio de \"enviar o pr\u00f3prio arquivo PDF\" para o LLM, o Gemini \u00e9 o provedor configurado como padr\u00e3o, pois aceita o documento nativamente sem pr\u00e9-processamento.\n6. C\u00e1lculo de m\u00e9tricas de neg\u00f3cio.\n7. Persist\u00eancia transacional (fatura, m\u00e9tricas, documento).\n8. Registro de auditoria e rollback de arquivo em caso de falha.\n\n## Contrato de extra\u00e7\u00e3o\n\nArquivo central:\n\n- `src/modules/invoices/domain/contracts/invoice-extraction.contract.ts`\n\nConfigura\u00e7\u00e3o por ambiente:\n\n- `INVOICE_EXTRACTION_REFERENCE`\n- `INVOICE_EXTRACTION_PROMPT`\n- `INVOICE_EXTRACTION_CONTEXT`\n\n## Resposta HTTP padr\u00e3o\n\n- Sucesso: `{ success, path, timestamp, data }`\n- Erro: `{ success, path, timestamp, error: { statusCode, message, details } }`\n\n## Seguran\u00e7a\n\n- Autentica\u00e7\u00e3o JWT aplicada globalmente.\n- RBAC completo por papel (`ADMIN`, `USER`).\n- Refresh token com rota\u00e7\u00e3o e persist\u00eancia.\n- Criptografia de arquivos com JWE.\n- Auditoria de a\u00e7\u00f5es sens\u00edveis.\n- Pol\u00edticas de cabe\u00e7alho HTTP com Helmet.\n- Rate limit global com `@nestjs/throttler`.\n\n## Principais vari\u00e1veis de ambiente\n\n- Core: `NODE_ENV`, `PORT`, `DATABASE_URL`, `LOGS`\n- API security: `HELMET_ENABLED`, `RATE_LIMIT_TTL_MS`, `RATE_LIMIT_LIMIT`\n- Auth: `JWT_ACCESS_SECRET`, `JWT_REFRESH_SECRET`, `JWT_ACCESS_EXPIRES_IN`, `JWT_REFRESH_EXPIRES_IN`, `JWT_ISSUER`\n- RBAC/admin inicial: `DEFAULT_ADMIN_EMAIL`, `DEFAULT_ADMIN_USERNAME`, `DEFAULT_ADMIN_PASSWORD`\n- LLM: `OPEN_SOURCE_IA`, `LLM_PROVIDER`, `OLLAMA_*`, `OPENAI_*`, `GEMINI_*`, `ANTHROPIC_*`\n- Extraction: `INVOICE_EXTRACTION_REFERENCE`, `INVOICE_EXTRACTION_PROMPT`, `INVOICE_EXTRACTION_CONTEXT`\n- Upload: `PDF_MAX_FILE_SIZE_MB`\n- Storage: `STORAGE_DRIVER`, `S3_REGION`, `S3_BUCKET`, `S3_ENDPOINT`, `S3_ACCESS_KEY_ID`, `S3_SECRET_ACCESS_KEY`, `S3_FORCE_PATH_STYLE`, `JWE_SECRET`\n\nDefaults recomendados do desafio (sem alterar `.env`):\n\n- `OPEN_SOURCE_IA=false`\n- `LLM_PROVIDER=gemini`\n- `GEMINI_MODEL=gemini-2.5-flash`\n- `OPENAI` permanece como provider alternativo, mas no momento usa contexto textual com PDF em base64 (nao envio nativo de `application/pdf`).\n\n## Execu\u00e7\u00e3o local\n\n```bash\nnpm install\nnpm run lint\nnpm run build\nnpm run start:dev\n```\n\n## TDD (unit\u00e1rio + integra\u00e7\u00e3o)\n\n```bash\nnpm run test:unit\nnpm run test:integration\nnpm run test\n```\n\nTeste de persist\u00eancia real no banco (Postgres) quando `DATABASE_URL` estiver configurada:\n\n```bash\nnpm run test:integration\n```\n\n## Swagger (OpenAPI)\n\n- URL Portugu\u00eas: `http://localhost:3000/api/docs/pt`\n- URL English: `http://localhost:3000/api/docs/en`\n- Configura\u00e7\u00e3o por env:\n  - `SWAGGER_ENABLED=true|false`\n\nEndpoints \u00fateis:\n\n- `GET /api/health`\n- `POST /api/auth/register`\n- `POST /api/auth/login`\n- `POST /api/auth/refresh`\n- `POST /api/invoices/extract`\n- `GET /api/invoices`\n- `GET /api/invoices/dashboard/energy`\n- `GET /api/invoices/dashboard/financial`\n- `GET /api/admin/*` (somente ADMIN)\n\n## Checklist de aceite t\u00e9cnico\n\n- `npm run lint`\n- `npm run test`\n- `docker compose up --build`\n\n## Roteiro de valida\u00e7\u00e3o pr\u00e1tica da extra\u00e7\u00e3o\n\n1. Subir stack completa e autenticar usu\u00e1rio.\n2. Enviar PDF real em `POST /api/invoices/extract`.\n3. Validar retorno da extra\u00e7\u00e3o com os campos:\n   - `numeroCliente`\n   - `mesReferencia`\n   - `itensFatura.energiaEletrica.{quantidadeKwh,valorRs}`\n   - `itensFatura.energiaSceeSemIcms.{quantidadeKwh,valorRs}`\n   - `itensFatura.energiaCompensadaGdi.{quantidadeKwh,valorRs}`\n   - `itensFatura.contribIlumPublicaMunicipal.valorRs`\n4. Confirmar m\u00e9tricas agregadas:\n   - `consumoEnergiaEletricaKwh`\n   - `energiaCompensadaKwh`\n   - `valorTotalSemGdRs`\n   - `economiaGdRs`\n5. Validar persist\u00eancia:\n   - fatura e m\u00e9tricas no banco;\n   - documento criptografado no storage;\n   - trilha de auditoria com ator, status e meta.\n\n### Evid\u00eancia de refer\u00eancia (fatura exemplo JAN/2024)\n\n- `numeroCliente`: `7204076116`\n- `mesReferencia`: `JAN/2024`\n- `energiaEletrica`: `50 kWh` / `R$ 47,75`\n- `energiaSceeSemIcms`: `456 kWh` / `R$ 232,42`\n- `energiaCompensadaGdi`: `456 kWh` / `R$ -222,22`\n- `contribIlumPublicaMunicipal`: `R$ 49,43`\n- `consumoEnergiaEletricaKwh`: `506`\n- `energiaCompensadaKwh`: `456`\n- `valorTotalSemGdRs`: `329,60`\n- `economiaGdRs`: `-222,22`\n\n\u003C/details\u003E\n\n\u003Cdetails\u003E\n\u003Csummary\u003E\u003Cstrong\u003E\ud83c\uddec\ud83c\udde7 English\u003C/strong\u003E\u003C/summary\u003E\n\n## Overview\n\nNestJS backend with modular architecture for PDF bill extraction, enterprise auth, RBAC, auditing, and encrypted storage.\n\n## Current Modules (`src/modules`)\n\n- `auth`\n  - register, login, refresh token, logout, profile;\n  - `JwtAuthGuard` and `RolesGuard`;\n  - decorators `@Public`, `@Roles`, `@CurrentUser`.\n- `admin`\n  - admin CRUD for users;\n  - list/manage documents, invoices, and audit logs;\n  - download document with decryption.\n- `invoices`\n  - bill upload and processing;\n  - invoice listing and dashboards;\n  - role-aware access (`ADMIN` sees all, `USER` sees only own data).\n- `llm`\n  - dynamic provider selection;\n  - adapters for Ollama, OpenAI, Gemini/Google, and Claude.\n- `storage`\n  - JWE encryption/decryption (`FileCryptoService`);\n  - S3 adapter (`S3DocumentStorageAdapter`) with LocalStack locally.\n- `audit`\n  - audit trail persistence.\n- `health`\n  - API health endpoint.\n\n## Shared (`src/shared`)\n\n- `config`\n  - env validation with Zod;\n  - JWT duration utils;\n  - max PDF size config.\n- `http`\n  - centralized response contract (`ApiResponsePresenter`);\n  - global success interceptor;\n  - global exception filter.\n- `logging`\n  - `ApiLogger` with levels and ANSI colors.\n- `messages`\n  - `pt-br.messages.ts` as single source for business/error/log messages.\n- `prisma`\n  - `PrismaService` and `PrismaModule`.\n\n## Invoice Processing Flow\n\n1. Upload via `POST /api/invoices/extract`.\n2. Validate PDF type and size (`PDF_MAX_FILE_SIZE_MB`).\n3. Encrypt file using JWE.\n4. Upload encrypted content to S3 storage.\n5. Extract data through configured LLM provider.\n6. Compute business metrics.\n7. Persist invoice/metrics/document in a transaction.\n8. Write audit log and rollback uploaded file on failure.\n\n## Extraction Contract\n\nCentral file:\n\n- `src/modules/invoices/domain/contracts/invoice-extraction.contract.ts`\n\nEnvironment-driven settings:\n\n- `INVOICE_EXTRACTION_REFERENCE`\n- `INVOICE_EXTRACTION_PROMPT`\n- `INVOICE_EXTRACTION_CONTEXT`\n\n## Standard HTTP Response\n\n- Success: `{ success, path, timestamp, data }`\n- Error: `{ success, path, timestamp, error: { statusCode, message, details } }`\n\n## Security\n\n- Global JWT authentication.\n- Full RBAC by role (`ADMIN`, `USER`).\n- Refresh token rotation with persistence.\n- JWE encrypted file storage.\n- Sensitive action auditing.\n- HTTP header policies with Helmet.\n- Global rate limiting with `@nestjs/throttler`.\n\n## Main Environment Variables\n\n- Core: `NODE_ENV`, `PORT`, `DATABASE_URL`, `LOGS`\n- API security: `HELMET_ENABLED`, `RATE_LIMIT_TTL_MS`, `RATE_LIMIT_LIMIT`\n- Auth: `JWT_ACCESS_SECRET`, `JWT_REFRESH_SECRET`, `JWT_ACCESS_EXPIRES_IN`, `JWT_REFRESH_EXPIRES_IN`, `JWT_ISSUER`\n- Default admin: `DEFAULT_ADMIN_EMAIL`, `DEFAULT_ADMIN_USERNAME`, `DEFAULT_ADMIN_PASSWORD`\n- LLM: `OPEN_SOURCE_IA`, `LLM_PROVIDER`, `OLLAMA_*`, `OPENAI_*`, `GEMINI_*`, `ANTHROPIC_*`\n- Extraction: `INVOICE_EXTRACTION_REFERENCE`, `INVOICE_EXTRACTION_PROMPT`, `INVOICE_EXTRACTION_CONTEXT`\n- Upload: `PDF_MAX_FILE_SIZE_MB`\n- Storage: `STORAGE_DRIVER`, `S3_REGION`, `S3_BUCKET`, `S3_ENDPOINT`, `S3_ACCESS_KEY_ID`, `S3_SECRET_ACCESS_KEY`, `S3_FORCE_PATH_STYLE`, `JWE_SECRET`\n\nRecommended default challenge profile (without overriding `.env`):\n\n- `OPEN_SOURCE_IA=false`\n- `LLM_PROVIDER=gemini`\n- `GEMINI_MODEL=gemini-2.5-flash`\n- `OPENAI` remains an alternative provider, but currently runs in text-context mode with PDF base64 (not native `application/pdf` upload).\n\n## Local Run\n\n```bash\nnpm install\nnpm run lint\nnpm run build\nnpm run start:dev\n```\n\nReal database integration check (Postgres) when `DATABASE_URL` is configured:\n\n```bash\nnpm run test:integration\n```\n\nUseful endpoints:\n\n- `GET /api/health`\n- `POST /api/auth/register`\n- `POST /api/auth/login`\n- `POST /api/auth/refresh`\n- `POST /api/invoices/extract`\n- `GET /api/invoices`\n- `GET /api/invoices/dashboard/energy`\n- `GET /api/invoices/dashboard/financial`\n- `GET /api/admin/*` (ADMIN only)\n\n## Docker (API + infrastructure + Ollama model)\n\nFrom repository root:\n\n```bash\ndocker compose up --build\n```\n\nOrchestration flow:\n\n- `postgres` and `localstack` start first;\n- `backend` starts and runs `prisma db push` on startup.\n- `frontend` (Next.js) pode subir no mesmo `docker compose` consumindo a API internamente por hostname de servi\u00e7o.\n\n\u003E **Ollama**: Os servi\u00e7os locais do Ollama (`ollama` e `ollama-init`) v\u00eam **comentados por padr\u00e3o** no `docker-compose.yml` para economizar recursos da m\u00e1quina, j\u00e1 que a aplica\u00e7\u00e3o est\u00e1 configurada para usar a API ultra r\u00e1pida e com suporte nativo a PDF do **Gemini** para o desafio. Se desejar rodar a IA 100% local, basta descomentar esses blocos no docker-compose e ajustar o `.env` (`OPEN_SOURCE_IA=true`).\n\n## Technical Acceptance Checklist\n\n- `npm run lint`\n- `npm run test`\n- `docker compose up --build`\n\n## Practical Extraction Validation Script\n\n1. Start the full stack and authenticate.\n2. Upload a real PDF to `POST /api/invoices/extract`.\n3. Validate extraction response fields:\n   - `numeroCliente`\n   - `mesReferencia`\n   - `itensFatura.energiaEletrica.{quantidadeKwh,valorRs}`\n   - `itensFatura.energiaSceeSemIcms.{quantidadeKwh,valorRs}`\n   - `itensFatura.energiaCompensadaGdi.{quantidadeKwh,valorRs}`\n   - `itensFatura.contribIlumPublicaMunicipal.valorRs`\n4. Confirm computed metrics:\n   - `consumoEnergiaEletricaKwh`\n   - `energiaCompensadaKwh`\n   - `valorTotalSemGdRs`\n   - `economiaGdRs`\n5. Validate persistence:\n   - invoice and metrics in database;\n   - encrypted document in storage;\n   - audit trail with actor, status, and metadata.\n\n\u003C/details\u003E\n","backend/test-debug.ts":"import { ApiLogger } from './src/shared/logging/api-logger';\n\ntry {\n    throw new Error(\"DUMMY_ERROR_FOR_TESTS\");\n} catch (e) {\n    ApiLogger.logError({ path: \"/test\", statusCode: 500, message: \"Erro\", error: e });\n}\n","backend/tsconfig.build.json":"{\n  \"extends\": \"./tsconfig.json\",\n  \"exclude\": [\n    \"node_modules\",\n    \"tests\",\n    \"dist\",\n    \"**/*spec.ts\",\n    \"prisma.config.ts\"\n  ]\n}","backend/tsconfig.json":"{\n  \"compilerOptions\": {\n    \"module\": \"nodenext\",\n    \"moduleResolution\": \"nodenext\",\n    \"resolvePackageJsonExports\": true,\n    \"esModuleInterop\": true,\n    \"isolatedModules\": true,\n    \"declaration\": true,\n    \"removeComments\": true,\n    \"emitDecoratorMetadata\": true,\n    \"experimentalDecorators\": true,\n    \"allowSyntheticDefaultImports\": true,\n    \"target\": \"ES2023\",\n    \"sourceMap\": true,\n    \"outDir\": \"./dist\",\n    \"baseUrl\": \"./\",\n    \"incremental\": true,\n    \"skipLibCheck\": true,\n    \"strictNullChecks\": true,\n    \"forceConsistentCasingInFileNames\": true,\n    \"noImplicitAny\": false,\n    \"strictBindCallApply\": false,\n    \"noFallthroughCasesInSwitch\": false\n  }\n}\n","backend/prisma/schema.prisma":"// This is your Prisma schema file,\n// learn more about it in the docs: https://pris.ly/d/prisma-schema\n\n// Looking for ways to speed up your queries, or scale easily with your serverless or edge functions?\n// Try Prisma Accelerate: https://pris.ly/cli/accelerate-init\n\ngenerator client {\n  provider = \"prisma-client-js\"\n}\n\ndatasource db {\n  provider = \"postgresql\"\n  url      = env(\"DATABASE_URL\")\n}\n\nenum Role {\n  ADMIN\n  USER\n}\n\nenum InvoiceStatus {\n  PROCESSING\n  SUCCESS\n  ERROR\n}\n\nenum AuditStatus {\n  SUCCESS\n  ERROR\n}\n\nmodel User {\n  id             String          @id @default(cuid())\n  email          String          @unique\n  username       String          @unique\n  passwordHash   String\n  role           Role            @default(USER)\n  isActive       Boolean         @default(true)\n  createdAt      DateTime        @default(now())\n  updatedAt      DateTime        @updatedAt\n  refreshTokens  RefreshToken[]\n  invoices       Invoice[]\n  auditLogs      AuditLog[]\n  storedDocuments StoredDocument[] @relation(\"UploaderDocuments\")\n}\n\nmodel RefreshToken {\n  id               String   @id @default(cuid())\n  userId           String\n  tokenHash        String\n  jti              String   @unique\n  expiresAt        DateTime\n  revokedAt        DateTime?\n  replacedByTokenId String?\n  userAgent        String?\n  ip               String?\n  createdAt        DateTime @default(now())\n  user             User     @relation(fields: [userId], references: [id], onDelete: Cascade)\n\n  @@index([userId])\n}\n\nmodel Invoice {\n  id                                 String         @id @default(cuid())\n  uploaderUserId                     String\n  fileName                           String\n  status                             InvoiceStatus  @default(PROCESSING)\n  errorMessage                       String?\n  numeroCliente                      String\n  mesReferencia                      String\n  energiaEletricaQuantidadeKwh       Decimal        @db.Decimal(14, 3)\n  energiaEletricaValorRs             Decimal        @db.Decimal(14, 2)\n  energiaSceeSemIcmsQuantidadeKwh    Decimal        @db.Decimal(14, 3)\n  energiaSceeSemIcmsValorRs          Decimal        @db.Decimal(14, 2)\n  energiaCompensadaGdiQuantidadeKwh  Decimal        @db.Decimal(14, 3)\n  energiaCompensadaGdiValorRs        Decimal        @db.Decimal(14, 2)\n  contribIlumPublicaMunicipalValorRs Decimal        @db.Decimal(14, 2)\n  extractionProvider                 String\n  rawExtractionJson                  Json\n  createdAt                          DateTime       @default(now())\n  updatedAt                          DateTime       @updatedAt\n  metrics                            InvoiceMetrics?\n  uploader                           User           @relation(fields: [uploaderUserId], references: [id], onDelete: Restrict)\n  documents                          StoredDocument[]\n\n  @@index([uploaderUserId])\n  @@index([numeroCliente])\n  @@index([mesReferencia])\n  @@index([status])\n}\n\nmodel InvoiceMetrics {\n  id                         String   @id @default(cuid())\n  invoiceId                  String   @unique\n  consumoEnergiaEletricaKwh  Decimal  @db.Decimal(14, 3)\n  energiaCompensadaKwh       Decimal  @db.Decimal(14, 3)\n  valorTotalSemGdRs          Decimal  @db.Decimal(14, 2)\n  economiaGdRs               Decimal  @db.Decimal(14, 2)\n  createdAt                  DateTime @default(now())\n  updatedAt                  DateTime @updatedAt\n  invoice                    Invoice  @relation(fields: [invoiceId], references: [id], onDelete: Cascade)\n}\n\nmodel StoredDocument {\n  id             String   @id @default(cuid())\n  invoiceId      String?\n  uploaderUserId String\n  bucket         String\n  objectKey      String   @unique\n  fileName       String\n  mimeType       String\n  sizeBytes      Int\n  checksum       String\n  createdAt      DateTime @default(now())\n  updatedAt      DateTime @updatedAt\n  invoice        Invoice? @relation(fields: [invoiceId], references: [id], onDelete: SetNull)\n  uploader       User     @relation(\"UploaderDocuments\", fields: [uploaderUserId], references: [id], onDelete: Restrict)\n\n  @@index([uploaderUserId])\n  @@index([invoiceId])\n  @@index([createdAt])\n}\n\nmodel AuditLog {\n  id          String      @id @default(cuid())\n  actorUserId String?\n  action      String\n  resourceType String\n  resourceId  String?\n  status      AuditStatus @default(SUCCESS)\n  message     String\n  meta        Json?\n  ip          String?\n  userAgent   String?\n  createdAt   DateTime    @default(now())\n  actor       User?       @relation(fields: [actorUserId], references: [id], onDelete: SetNull)\n\n  @@index([actorUserId])\n  @@index([action])\n  @@index([resourceType])\n  @@index([createdAt])\n}\n","backend/src/app.module.ts":"import { Module } from '@nestjs/common';\nimport { ConfigModule, ConfigService } from '@nestjs/config';\nimport { APP_GUARD } from '@nestjs/core';\nimport { ThrottlerGuard, ThrottlerModule } from '@nestjs/throttler';\nimport { AdminModule } from './modules/admin/admin.module';\nimport { AuthModule } from './modules/auth/auth.module';\nimport { HealthModule } from './modules/health/health.module';\nimport { InvoicesModule } from './modules/invoices/invoices.module';\nimport { envSchema } from './shared/config/env.schema';\nimport { PrismaModule } from './shared/prisma/prisma.module';\n\n@Module({\n  imports: [\n    ConfigModule.forRoot({\n      isGlobal: true,\n      envFilePath: ['../.env', '.env'],\n      validate: (config) =\u003E envSchema.parse(config),\n    }),\n    ThrottlerModule.forRootAsync({\n      inject: [ConfigService],\n      useFactory: (configService: ConfigService) =\u003E [\n        {\n          name: 'default',\n          ttl:\n            Number(configService.get\u003Cnumber\u003E('RATE_LIMIT_TTL_MS') ?? 60000) ||\n            60000,\n          limit:\n            Number(configService.get\u003Cnumber\u003E('RATE_LIMIT_LIMIT') ?? 100) || 100,\n        },\n      ],\n    }),\n    PrismaModule,\n    AuthModule,\n    HealthModule,\n    InvoicesModule,\n    AdminModule,\n  ],\n  providers: [\n    {\n      provide: APP_GUARD,\n      useClass: ThrottlerGuard,\n    },\n  ],\n})\nexport class AppModule {}\n","backend/src/main.ts":"import { ValidationPipe } from '@nestjs/common';\nimport { NestFactory } from '@nestjs/core';\nimport { AppModule } from './app.module';\nimport { JwtAuthGuard } from './modules/auth/presentation/guards/jwt-auth.guard';\nimport { RolesGuard } from './modules/auth/presentation/guards/roles.guard';\nimport { HttpExceptionFilter } from './shared/http/filters/http-exception.filter';\nimport { SuccessResponseInterceptor } from './shared/http/interceptors/success-response.interceptor';\nimport { setupHelmet } from './shared/http/security/setup-helmet';\nimport { setupSwagger } from './shared/http/swagger/setup-swagger';\nimport { ApiLogger } from './shared/logging/api-logger';\nimport { PtBrMessages } from './shared/messages/pt-br.messages';\n\nasync function bootstrap() {\n  process.on('unhandledRejection', (r) =\u003E {\n    ApiLogger.logError({\n      path: 'unhandledRejection',\n      statusCode: 500,\n      message: 'Unhandled Promise Rejection',\n      error: r,\n    });\n  });\n  process.on('uncaughtException', (e) =\u003E {\n    ApiLogger.logError({\n      path: 'uncaughtException',\n      statusCode: 500,\n      message: 'Uncaught Exception',\n      error: e,\n    });\n  });\n  ApiLogger.log({\n    context: 'Bootstrap',\n    message: PtBrMessages.system.bootstrapStarting,\n  });\n  const app = await NestFactory.create(AppModule);\n  const helmetEnabled =\n    (process.env.HELMET_ENABLED ?? 'true').toLowerCase() === 'true';\n  setupHelmet({ app, enabled: helmetEnabled });\n\n  app.setGlobalPrefix('api');\n  app.enableCors({\n    origin: true,\n    credentials: true,\n  });\n  app.useGlobalPipes(\n    new ValidationPipe({\n      whitelist: true,\n      transform: true,\n      forbidNonWhitelisted: true,\n    }),\n  );\n  app.useGlobalGuards(app.get(JwtAuthGuard), app.get(RolesGuard));\n  app.useGlobalFilters(new HttpExceptionFilter());\n  app.useGlobalInterceptors(new SuccessResponseInterceptor());\n\n  const swaggerEnabled =\n    (process.env.SWAGGER_ENABLED ?? 'true').toLowerCase() === 'true';\n  const swaggerPath = process.env.SWAGGER_PATH ?? 'api/docs';\n  setupSwagger({ app, enabled: swaggerEnabled, path: swaggerPath });\n\n  const port = Number(process.env.PORT ?? 3000);\n  await app.listen(port);\n  ApiLogger.info({\n    context: 'Bootstrap',\n    message: PtBrMessages.system.bootstrapStarted(port),\n  });\n}\nvoid bootstrap().catch((error: unknown) =\u003E {\n  const message =\n    error instanceof Error ? error.message : PtBrMessages.common.unknownError;\n  ApiLogger.logError({\n    path: 'bootstrap',\n    method: 'SYSTEM',\n    statusCode: 500,\n    message,\n  });\n  process.exit(1);\n});\n","backend/src/modules/admin/admin.module.ts":"import { Module } from '@nestjs/common';\nimport { AuthModule } from '../auth/auth.module';\nimport { StorageModule } from '../storage/storage.module';\nimport { AdminService } from './application/admin.service';\nimport { AdminController } from './presentation/admin.controller';\n\n@Module({\n  imports: [AuthModule, StorageModule],\n  controllers: [AdminController],\n  providers: [AdminService],\n})\nexport class AdminModule {}\n","backend/src/modules/admin/application/admin.service.ts":"import { Injectable, NotFoundException } from '@nestjs/common';\nimport * as argon2 from 'argon2';\nimport { ApiLogger } from '../../../shared/logging/api-logger';\nimport { PtBrMessages } from '../../../shared/messages/pt-br.messages';\nimport { PrismaService } from '../../../shared/prisma/prisma.service';\nimport { FileCryptoService } from '../../storage/application/file-crypto.service';\nimport { DOCUMENT_STORAGE_TOKEN } from '../../storage/domain/document-storage.port';\nimport { Inject } from '@nestjs/common';\nimport type { DocumentStoragePort } from '../../storage/domain/document-storage.port';\nimport type { AppRole } from '../../auth/domain/role.type';\nimport {\n  AdminCreateUserDto,\n  AdminUpdateUserDto,\n} from '../presentation/dto/admin-upsert-user.dto';\n\ntype ListQuery = {\n  fromDate?: string;\n  toDate?: string;\n  username?: string;\n  page?: string;\n  pageSize?: string;\n};\n\n@Injectable()\n/**\n *\n * EN: Administrative application service for enterprise governance operations.\n *\n * PT: Servico de aplicacao administrativo para operacoes de governanca enterprise.\n *\n * @params Administrative DTOs and filtering query payloads.\n * @returns Aggregated management data and mutation outcomes.\n */\nexport class AdminService {\n  constructor(\n    private readonly prisma: PrismaService,\n    @Inject(DOCUMENT_STORAGE_TOKEN)\n    private readonly documentStorage: DocumentStoragePort,\n    private readonly fileCryptoService: FileCryptoService,\n  ) {}\n\n  /**\n   *\n   * EN: Lists all users for administrative governance.\n   *\n   * PT: Lista todos os usuarios para governanca administrativa.\n   *\n   * @params none\n   * @returns Users collection with role and status.\n   */\n  listUsers() {\n    ApiLogger.info({\n      context: 'AdminService',\n      message: PtBrMessages.logs.admin.listingUsers,\n    });\n    return this.prisma.user.findMany({\n      orderBy: { createdAt: 'desc' },\n      select: {\n        id: true,\n        email: true,\n        username: true,\n        role: true,\n        isActive: true,\n        createdAt: true,\n        updatedAt: true,\n      },\n    });\n  }\n\n  /**\n   *\n   * EN: Creates a user account from admin context.\n   *\n   * PT: Cria uma conta de usuario no contexto administrativo.\n   *\n   * @params input Admin DTO with user base data.\n   * @returns Created user projection.\n   */\n  async createUser(input: AdminCreateUserDto) {\n    ApiLogger.info({\n      context: 'AdminService',\n      message: PtBrMessages.logs.admin.creatingUser,\n    });\n    const passwordHash = await argon2.hash(input.password);\n\n    return this.prisma.user.create({\n      data: {\n        email: input.email.toLowerCase(),\n        username: input.username,\n        passwordHash,\n        role: input.role ?? 'USER',\n      },\n      select: {\n        id: true,\n        email: true,\n        username: true,\n        role: true,\n        isActive: true,\n        createdAt: true,\n        updatedAt: true,\n      },\n    });\n  }\n\n  /**\n   *\n   * EN: Applies administrative changes to a user account.\n   *\n   * PT: Aplica alteracoes administrativas em uma conta de usuario.\n   *\n   * @params userId Target user identifier.\n   * @params input Admin DTO with editable fields.\n   * @returns Updated user projection.\n   */\n  async updateUser(userId: string, input: AdminUpdateUserDto) {\n    ApiLogger.info({\n      context: 'AdminService',\n      message: PtBrMessages.logs.admin.updatingUser(userId),\n    });\n    const data: {\n      username?: string;\n      passwordHash?: string;\n      role?: AppRole;\n      isActive?: boolean;\n    } = {};\n\n    if (input.username) {\n      data.username = input.username;\n    }\n    if (input.role) {\n      data.role = input.role;\n    }\n    if (typeof input.isActive === 'boolean') {\n      data.isActive = input.isActive;\n    }\n    if (input.password) {\n      data.passwordHash = await argon2.hash(input.password);\n    }\n\n    return this.prisma.user.update({\n      where: { id: userId },\n      data,\n      select: {\n        id: true,\n        email: true,\n        username: true,\n        role: true,\n        isActive: true,\n        createdAt: true,\n        updatedAt: true,\n      },\n    });\n  }\n\n  /**\n   *\n   * EN: Permanently removes a user from system scope.\n   *\n   * PT: Remove permanentemente um usuario do escopo do sistema.\n   *\n   * @params userId Target user identifier.\n   * @returns Standardized deletion message.\n   */\n  async deleteUser(userId: string) {\n    ApiLogger.warning({\n      context: 'AdminService',\n      message: PtBrMessages.logs.admin.deletingUser(userId),\n    });\n    await this.prisma.user.delete({\n      where: { id: userId },\n    });\n    return { message: PtBrMessages.admin.userRemoved };\n  }\n\n  listDocuments(query: ListQuery) {\n    ApiLogger.info({\n      context: 'AdminService',\n      message: PtBrMessages.logs.admin.listingDocuments,\n    });\n    const pagination = this.getPagination(query.page, query.pageSize);\n\n    return this.prisma.storedDocument.findMany({\n      where: {\n        createdAt: {\n          gte: query.fromDate ? new Date(query.fromDate) : undefined,\n          lte: query.toDate ? new Date(query.toDate) : undefined,\n        },\n        uploader: {\n          username: query.username,\n        },\n      },\n      include: {\n        uploader: {\n          select: {\n            id: true,\n            email: true,\n            username: true,\n            role: true,\n          },\n        },\n      },\n      orderBy: { createdAt: 'desc' },\n      skip: pagination.skip,\n      take: pagination.take,\n    });\n  }\n\n  listAuditLogs(query: ListQuery) {\n    ApiLogger.info({\n      context: 'AdminService',\n      message: PtBrMessages.logs.admin.listingAuditLogs,\n    });\n    const pagination = this.getPagination(query.page, query.pageSize);\n\n    return this.prisma.auditLog.findMany({\n      where: {\n        createdAt: {\n          gte: query.fromDate ? new Date(query.fromDate) : undefined,\n          lte: query.toDate ? new Date(query.toDate) : undefined,\n        },\n        actor: {\n          username: query.username,\n        },\n      },\n      include: {\n        actor: {\n          select: {\n            id: true,\n            email: true,\n            username: true,\n            role: true,\n          },\n        },\n      },\n      orderBy: { createdAt: 'desc' },\n      skip: pagination.skip,\n      take: pagination.take,\n    });\n  }\n\n  listInvoices(query: ListQuery) {\n    ApiLogger.info({\n      context: 'AdminService',\n      message: PtBrMessages.logs.admin.listingInvoices,\n    });\n    const pagination = this.getPagination(query.page, query.pageSize);\n    return this.prisma.invoice.findMany({\n      where: {\n        createdAt: {\n          gte: query.fromDate ? new Date(query.fromDate) : undefined,\n          lte: query.toDate ? new Date(query.toDate) : undefined,\n        },\n        uploader: {\n          username: query.username,\n        },\n      },\n      include: {\n        metrics: true,\n        uploader: {\n          select: {\n            id: true,\n            username: true,\n            email: true,\n            role: true,\n          },\n        },\n        documents: true,\n      },\n      orderBy: { createdAt: 'desc' },\n      skip: pagination.skip,\n      take: pagination.take,\n    });\n  }\n\n  updateInvoiceReferenceMonth(invoiceId: string, mesReferencia: string) {\n    ApiLogger.info({\n      context: 'AdminService',\n      message: PtBrMessages.logs.admin.updatingInvoiceReferenceMonth(invoiceId),\n    });\n    return this.prisma.invoice.update({\n      where: { id: invoiceId },\n      data: { mesReferencia },\n    });\n  }\n\n  async deleteInvoice(invoiceId: string) {\n    ApiLogger.warning({\n      context: 'AdminService',\n      message: PtBrMessages.logs.admin.deletingInvoice(invoiceId),\n    });\n    const invoice = await this.prisma.invoice.findUnique({\n      where: { id: invoiceId },\n      include: { documents: true },\n    });\n    if (!invoice) {\n      throw new NotFoundException(PtBrMessages.admin.invoiceNotFound);\n    }\n\n    for (const document of invoice.documents) {\n      await this.documentStorage.remove(document.objectKey);\n    }\n\n    await this.prisma.invoice.delete({\n      where: { id: invoiceId },\n    });\n\n    return { message: PtBrMessages.admin.invoiceRemoved };\n  }\n\n  async deleteDocument(documentId: string) {\n    ApiLogger.warning({\n      context: 'AdminService',\n      message: PtBrMessages.logs.admin.deletingDocument(documentId),\n    });\n    const document = await this.prisma.storedDocument.findUnique({\n      where: { id: documentId },\n    });\n    if (!document) {\n      throw new NotFoundException(PtBrMessages.admin.documentNotFound);\n    }\n\n    await this.documentStorage.remove(document.objectKey);\n    await this.prisma.storedDocument.delete({\n      where: { id: documentId },\n    });\n\n    return { message: PtBrMessages.admin.documentRemoved };\n  }\n\n  async downloadDocument(documentId: string) {\n    ApiLogger.info({\n      context: 'AdminService',\n      message: PtBrMessages.logs.admin.downloadingDocument(documentId),\n    });\n    const document = await this.prisma.storedDocument.findUnique({\n      where: { id: documentId },\n    });\n    if (!document) {\n      throw new NotFoundException(PtBrMessages.admin.documentNotFound);\n    }\n\n    const file = await this.documentStorage.download(document.objectKey);\n    const decrypted = await this.fileCryptoService.decrypt(file.content);\n\n    return {\n      fileName: document.fileName,\n      mimeType: document.mimeType,\n      contentBase64: decrypted.toString('base64'),\n    };\n  }\n\n  private getPagination(page?: string, pageSize?: string) {\n    const normalizedPage = Math.max(1, Number.parseInt(page ?? '1', 10) || 1);\n    const normalizedPageSize = Math.min(\n      100,\n      Math.max(1, Number.parseInt(pageSize ?? '20', 10) || 20),\n    );\n    return {\n      skip: (normalizedPage - 1) * normalizedPageSize,\n      take: normalizedPageSize,\n    };\n  }\n}\n","backend/src/modules/admin/presentation/admin.controller.ts":"import {\n  Body,\n  Controller,\n  Delete,\n  Get,\n  Param,\n  Patch,\n  Post,\n  Query,\n  UseGuards,\n} from '@nestjs/common';\nimport { AdminService } from '../application/admin.service';\nimport { Roles } from '../../auth/presentation/decorators/roles.decorator';\nimport { JwtAuthGuard } from '../../auth/presentation/guards/jwt-auth.guard';\nimport { RolesGuard } from '../../auth/presentation/guards/roles.guard';\nimport {\n  AdminCreateUserDto,\n  AdminUpdateUserDto,\n} from './dto/admin-upsert-user.dto';\nimport {\n  ApiBearerAuth,\n  ApiBody,\n  ApiOkResponse,\n  ApiOperation,\n  ApiQuery,\n  ApiTags,\n} from '@nestjs/swagger';\n\n@UseGuards(JwtAuthGuard, RolesGuard)\n@Roles('ADMIN')\n@ApiTags('Admin')\n@ApiBearerAuth()\n@Controller('admin')\n/**\n *\n * EN: Administrative controller exposing full governance endpoints for privileged users.\n *\n * PT: Controller administrativo que expoe endpoints de governanca completa para usuarios privilegiados.\n *\n * @params Request decorators and DTO payloads from HTTP layer.\n * @returns Standardized API responses from application services.\n */\nexport class AdminController {\n  constructor(private readonly adminService: AdminService) {}\n\n  /**\n   *\n   * EN: Lists all users for administrative control panel.\n   *\n   * PT: Lista todos os usuarios para o painel de controle administrativo.\n   *\n   * @params none\n   * @returns Collection of users and account metadata.\n   */\n  @Get('users')\n  @ApiOperation({ summary: 'Listar usu\u00e1rios (admin)' })\n  @ApiOkResponse({ description: 'Usu\u00e1rios listados com sucesso' })\n  listUsers() {\n    return this.adminService.listUsers();\n  }\n\n  @Post('users')\n  @ApiOperation({ summary: 'Criar usu\u00e1rio (admin)' })\n  @ApiBody({ type: AdminCreateUserDto })\n  @ApiOkResponse({ description: 'Usu\u00e1rio criado com sucesso' })\n  createUser(@Body() body: AdminCreateUserDto) {\n    return this.adminService.createUser(body);\n  }\n\n  @Patch('users/:id')\n  @ApiOperation({ summary: 'Atualizar usu\u00e1rio (admin)' })\n  @ApiBody({ type: AdminUpdateUserDto })\n  @ApiOkResponse({ description: 'Usu\u00e1rio atualizado com sucesso' })\n  updateUser(@Param('id') id: string, @Body() body: AdminUpdateUserDto) {\n    return this.adminService.updateUser(id, body);\n  }\n\n  @Delete('users/:id')\n  @ApiOperation({ summary: 'Remover usu\u00e1rio (admin)' })\n  @ApiOkResponse({ description: 'Usu\u00e1rio removido com sucesso' })\n  deleteUser(@Param('id') id: string) {\n    return this.adminService.deleteUser(id);\n  }\n\n  @Get('documents')\n  @ApiOperation({ summary: 'Listar documentos com filtros (admin)' })\n  @ApiQuery({ name: 'fromDate', required: false })\n  @ApiQuery({ name: 'toDate', required: false })\n  @ApiQuery({ name: 'username', required: false })\n  @ApiQuery({ name: 'page', required: false })\n  @ApiQuery({ name: 'pageSize', required: false })\n  @ApiOkResponse({ description: 'Documentos listados com sucesso' })\n  listDocuments(\n    @Query('fromDate') fromDate?: string,\n    @Query('toDate') toDate?: string,\n    @Query('username') username?: string,\n    @Query('page') page?: string,\n    @Query('pageSize') pageSize?: string,\n  ) {\n    return this.adminService.listDocuments({\n      fromDate,\n      toDate,\n      username,\n      page,\n      pageSize,\n    });\n  }\n\n  @Get('invoices')\n  @ApiOperation({ summary: 'Listar faturas com filtros (admin)' })\n  @ApiQuery({ name: 'fromDate', required: false })\n  @ApiQuery({ name: 'toDate', required: false })\n  @ApiQuery({ name: 'username', required: false })\n  @ApiQuery({ name: 'page', required: false })\n  @ApiQuery({ name: 'pageSize', required: false })\n  @ApiOkResponse({ description: 'Faturas listadas com sucesso' })\n  listInvoices(\n    @Query('fromDate') fromDate?: string,\n    @Query('toDate') toDate?: string,\n    @Query('username') username?: string,\n    @Query('page') page?: string,\n    @Query('pageSize') pageSize?: string,\n  ) {\n    return this.adminService.listInvoices({\n      fromDate,\n      toDate,\n      username,\n      page,\n      pageSize,\n    });\n  }\n\n  @Patch('invoices/:id/reference-month')\n  @ApiOperation({ summary: 'Atualizar m\u00eas de refer\u00eancia da fatura (admin)' })\n  @ApiOkResponse({ description: 'M\u00eas de refer\u00eancia atualizado com sucesso' })\n  updateInvoiceReferenceMonth(\n    @Param('id') id: string,\n    @Body('mesReferencia') mesReferencia: string,\n  ) {\n    return this.adminService.updateInvoiceReferenceMonth(id, mesReferencia);\n  }\n\n  @Delete('invoices/:id')\n  @ApiOperation({ summary: 'Remover fatura (admin)' })\n  @ApiOkResponse({ description: 'Fatura removida com sucesso' })\n  deleteInvoice(@Param('id') id: string) {\n    return this.adminService.deleteInvoice(id);\n  }\n\n  @Get('documents/:id/download')\n  @ApiOperation({ summary: 'Baixar documento descriptografado (admin)' })\n  @ApiOkResponse({ description: 'Documento retornado com sucesso' })\n  downloadDocument(@Param('id') id: string) {\n    return this.adminService.downloadDocument(id);\n  }\n\n  @Delete('documents/:id')\n  @ApiOperation({ summary: 'Remover documento (admin)' })\n  @ApiOkResponse({ description: 'Documento removido com sucesso' })\n  deleteDocument(@Param('id') id: string) {\n    return this.adminService.deleteDocument(id);\n  }\n\n  @Get('audit-logs')\n  @ApiOperation({ summary: 'Listar logs de auditoria com filtros (admin)' })\n  @ApiQuery({ name: 'fromDate', required: false })\n  @ApiQuery({ name: 'toDate', required: false })\n  @ApiQuery({ name: 'username', required: false })\n  @ApiQuery({ name: 'page', required: false })\n  @ApiQuery({ name: 'pageSize', required: false })\n  @ApiOkResponse({ description: 'Logs de auditoria listados com sucesso' })\n  listAuditLogs(\n    @Query('fromDate') fromDate?: string,\n    @Query('toDate') toDate?: string,\n    @Query('username') username?: string,\n    @Query('page') page?: string,\n    @Query('pageSize') pageSize?: string,\n  ) {\n    return this.adminService.listAuditLogs({\n      fromDate,\n      toDate,\n      username,\n      page,\n      pageSize,\n    });\n  }\n}\n","backend/src/modules/admin/presentation/dto/admin-upsert-user.dto.ts":"import {\n  IsBoolean,\n  IsEmail,\n  IsEnum,\n  IsOptional,\n  IsString,\n  Matches,\n  MaxLength,\n  MinLength,\n} from 'class-validator';\nimport { ApiProperty, ApiPropertyOptional } from '@nestjs/swagger';\nimport { APP_ROLE_ENUM } from '../../../auth/domain/role.type';\nimport type { AppRole } from '../../../auth/domain/role.type';\n\nexport class AdminCreateUserDto {\n  @ApiProperty({ example: 'user@local.test' })\n  @IsEmail()\n  email!: string;\n\n  @ApiProperty({ example: 'usuario_admin', minLength: 3, maxLength: 50 })\n  @IsString()\n  @MinLength(3)\n  @MaxLength(50)\n  username!: string;\n\n  @ApiProperty({ example: 'Admin@123456', minLength: 8, maxLength: 100 })\n  @IsString()\n  @MinLength(8)\n  @MaxLength(100)\n  @Matches(/[A-Z]/)\n  @Matches(/[a-z]/)\n  @Matches(/[0-9]/)\n  @Matches(/[^A-Za-z0-9]/)\n  password!: string;\n\n  @ApiPropertyOptional({ enum: APP_ROLE_ENUM, example: 'USER' })\n  @IsOptional()\n  @IsEnum(APP_ROLE_ENUM)\n  role?: AppRole;\n}\n\nexport class AdminUpdateUserDto {\n  @ApiPropertyOptional({\n    example: 'usuario_editado',\n    minLength: 3,\n    maxLength: 50,\n  })\n  @IsOptional()\n  @IsString()\n  @MinLength(3)\n  @MaxLength(50)\n  username?: string;\n\n  @ApiPropertyOptional({\n    example: 'Admin@123456',\n    minLength: 8,\n    maxLength: 100,\n  })\n  @IsOptional()\n  @IsString()\n  @MinLength(8)\n  @MaxLength(100)\n  @Matches(/[A-Z]/)\n  @Matches(/[a-z]/)\n  @Matches(/[0-9]/)\n  @Matches(/[^A-Za-z0-9]/)\n  password?: string;\n\n  @ApiPropertyOptional({ enum: APP_ROLE_ENUM, example: 'ADMIN' })\n  @IsOptional()\n  @IsEnum(APP_ROLE_ENUM)\n  role?: AppRole;\n\n  @ApiPropertyOptional({ example: true })\n  @IsOptional()\n  @IsBoolean()\n  isActive?: boolean;\n}\n","backend/src/modules/audit/audit.module.ts":"import { Module } from '@nestjs/common';\nimport { AuditService } from './application/audit.service';\n\n@Module({\n  providers: [AuditService],\n  exports: [AuditService],\n})\nexport class AuditModule {}\n","backend/src/modules/audit/application/audit.service.ts":"import { Injectable } from '@nestjs/common';\nimport { AuditStatus, Prisma } from '@prisma/client';\nimport { ApiLogger } from '../../../shared/logging/api-logger';\nimport { PtBrMessages } from '../../../shared/messages/pt-br.messages';\nimport { PrismaService } from '../../../shared/prisma/prisma.service';\n\ntype WriteAuditInput = {\n  actorUserId?: string;\n  action: string;\n  resourceType: string;\n  resourceId?: string;\n  status: AuditStatus;\n  message: string;\n  meta?: unknown;\n  ip?: string;\n  userAgent?: string;\n};\n\n@Injectable()\n/**\n *\n * EN: Audit service centralizing persistence of traceability events.\n *\n * PT: Servico de auditoria que centraliza persistencia de eventos de rastreabilidade.\n *\n * @params Audit payload containing actor, action and execution context.\n * @returns Void promise after successful persistence.\n */\nexport class AuditService {\n  constructor(private readonly prisma: PrismaService) {}\n\n  /**\n   *\n   * EN: Persists audit trail events with optional metadata and transport context.\n   *\n   * PT: Persiste eventos de trilha de auditoria com metadados e contexto de transporte opcionais.\n   *\n   * @params input Audit event payload.\n   * @returns Promise resolved after persistence operation.\n   */\n  async write(input: WriteAuditInput): Promise\u003Cvoid\u003E {\n    ApiLogger.info({\n      context: 'AuditService',\n      message: PtBrMessages.logs.audit.writingEntry(input.action),\n    });\n    await this.prisma.auditLog.create({\n      data: {\n        actorUserId: input.actorUserId,\n        action: input.action,\n        resourceType: input.resourceType,\n        resourceId: input.resourceId,\n        status: input.status,\n        message: input.message,\n        meta: input.meta as Prisma.InputJsonValue | undefined,\n        ip: input.ip,\n        userAgent: input.userAgent,\n      },\n    });\n  }\n}\n","backend/src/modules/auth/auth.module.ts":"import { Module } from '@nestjs/common';\nimport { ConfigService } from '@nestjs/config';\nimport { JwtModule } from '@nestjs/jwt';\nimport { AuthService } from './application/auth.service';\nimport { JwtStrategy } from './infrastructure/jwt.strategy';\nimport { AuthController } from './presentation/auth.controller';\nimport { JwtAuthGuard } from './presentation/guards/jwt-auth.guard';\nimport { RolesGuard } from './presentation/guards/roles.guard';\n\n@Module({\n  imports: [\n    JwtModule.registerAsync({\n      inject: [ConfigService],\n      useFactory: (configService: ConfigService) =\u003E ({\n        secret: configService.get\u003Cstring\u003E('JWT_ACCESS_SECRET'),\n      }),\n    }),\n  ],\n  controllers: [AuthController],\n  providers: [AuthService, JwtStrategy, JwtAuthGuard, RolesGuard],\n  exports: [AuthService, JwtModule, JwtAuthGuard, RolesGuard],\n})\nexport class AuthModule {}\n","backend/src/modules/auth/application/auth.service.ts":"import {\n  BadRequestException,\n  Injectable,\n  NotFoundException,\n  OnModuleInit,\n  UnauthorizedException,\n} from '@nestjs/common';\nimport { ConfigService } from '@nestjs/config';\nimport { JwtService } from '@nestjs/jwt';\nimport { AuditStatus } from '@prisma/client';\nimport * as argon2 from 'argon2';\nimport { randomUUID } from 'crypto';\nimport { durationToSeconds } from '../../../shared/config/duration.util';\nimport { ApiLogger } from '../../../shared/logging/api-logger';\nimport { PtBrMessages } from '../../../shared/messages/pt-br.messages';\nimport { PrismaService } from '../../../shared/prisma/prisma.service';\nimport type { AppRole } from '../domain/role.type';\nimport { LoginDto } from '../presentation/dto/login.dto';\nimport { RefreshTokenDto } from '../presentation/dto/refresh-token.dto';\nimport { RegisterDto } from '../presentation/dto/register.dto';\nimport { UpdateProfileDto } from '../presentation/dto/update-profile.dto';\n\ntype SessionContext = {\n  ip?: string;\n  userAgent?: string;\n};\n\n@Injectable()\n/**\n *\n * EN: Authentication application service responsible for identity lifecycle and token security.\n *\n * PT: Servico de aplicacao de autenticacao responsavel pelo ciclo de identidade e seguranca de tokens.\n *\n * @params Domain DTOs and request session metadata.\n * @returns Authenticated session payloads and profile operations.\n */\nexport class AuthService implements OnModuleInit {\n  constructor(\n    private readonly prisma: PrismaService,\n    private readonly jwtService: JwtService,\n    private readonly configService: ConfigService,\n  ) {}\n\n  /**\n   *\n   * EN: Initializes startup routines for authentication module.\n   *\n   * PT: Inicializa rotinas de bootstrap do modulo de autenticacao.\n   *\n   * @params none\n   * @returns Promise resolved after default admin verification.\n   */\n  async onModuleInit(): Promise\u003Cvoid\u003E {\n    await this.ensureDefaultAdmin();\n  }\n\n  /**\n   *\n   * EN: Registers a new user and issues first token pair.\n   *\n   * PT: Registra novo usuario e emite o primeiro par de tokens.\n   *\n   * @params input Registration DTO payload.\n   * @params context Request metadata (IP and user-agent).\n   * @returns Access/refresh tokens and authenticated user snapshot.\n   */\n  async register(input: RegisterDto, context: SessionContext) {\n    ApiLogger.info({\n      context: 'AuthService',\n      message: PtBrMessages.logs.auth.registeringUser,\n    });\n    const existingByEmail = await this.prisma.user.findUnique({\n      where: { email: input.email.toLowerCase() },\n      select: { id: true },\n    });\n    if (existingByEmail) {\n      throw new BadRequestException(PtBrMessages.auth.emailAlreadyExists);\n    }\n\n    const existingByUsername = await this.prisma.user.findUnique({\n      where: { username: input.username },\n      select: { id: true },\n    });\n    if (existingByUsername) {\n      throw new BadRequestException(PtBrMessages.auth.usernameAlreadyExists);\n    }\n\n    const passwordHash = await argon2.hash(input.password);\n    const user = await this.prisma.user.create({\n      data: {\n        email: input.email.toLowerCase(),\n        username: input.username,\n        passwordHash,\n        role: 'USER',\n      },\n    });\n\n    await this.prisma.auditLog.create({\n      data: {\n        actorUserId: user.id,\n        action: 'AUTH_REGISTER',\n        resourceType: 'USER',\n        resourceId: user.id,\n        status: AuditStatus.SUCCESS,\n        message: PtBrMessages.auth.userRegistered,\n        ip: context.ip,\n        userAgent: context.userAgent,\n      },\n    });\n\n    return this.issueTokens(\n      user.id,\n      user.email,\n      user.username,\n      user.role,\n      context,\n    );\n  }\n\n  /**\n   *\n   * EN: Authenticates existing user credentials and issues token pair.\n   *\n   * PT: Autentica credenciais existentes e emite par de tokens.\n   *\n   * @params input Login DTO payload.\n   * @params context Request metadata (IP and user-agent).\n   * @returns Access/refresh tokens and authenticated user snapshot.\n   */\n  async login(input: LoginDto, context: SessionContext) {\n    ApiLogger.info({\n      context: 'AuthService',\n      message: PtBrMessages.logs.auth.authenticatingUser,\n    });\n    const user = await this.prisma.user.findUnique({\n      where: { email: input.email.toLowerCase() },\n    });\n    if (!user) {\n      throw new NotFoundException(PtBrMessages.auth.userNotFound);\n    }\n    if (!user.isActive) {\n      throw new UnauthorizedException(PtBrMessages.auth.invalidCredentials);\n    }\n\n    const validPassword = await argon2.verify(\n      user.passwordHash,\n      input.password,\n    );\n    if (!validPassword) {\n      throw new UnauthorizedException(PtBrMessages.auth.invalidCredentials);\n    }\n\n    await this.prisma.auditLog.create({\n      data: {\n        actorUserId: user.id,\n        action: 'AUTH_LOGIN',\n        resourceType: 'USER',\n        resourceId: user.id,\n        status: AuditStatus.SUCCESS,\n        message: PtBrMessages.auth.loginSuccess,\n        ip: context.ip,\n        userAgent: context.userAgent,\n      },\n    });\n\n    return this.issueTokens(\n      user.id,\n      user.email,\n      user.username,\n      user.role,\n      context,\n    );\n  }\n\n  /**\n   *\n   * EN: Rotates refresh token and returns a new authenticated session.\n   *\n   * PT: Faz rotacao de refresh token e retorna nova sessao autenticada.\n   *\n   * @params input Refresh token DTO payload.\n   * @params context Request metadata (IP and user-agent).\n   * @returns Renewed access/refresh token pair.\n   */\n  async refresh(input: RefreshTokenDto, context: SessionContext) {\n    ApiLogger.info({\n      context: 'AuthService',\n      message: PtBrMessages.logs.auth.refreshingSession,\n    });\n    const payload = this.verifyRefreshToken(input.refreshToken);\n\n    const persistedToken = await this.prisma.refreshToken.findUnique({\n      where: { jti: payload.jti },\n      incl
